# Detourr on Netlify: the site is the static index.html at the repo root,
# plus one serverless function for live leaderboards (netlify/functions/lb.mjs).
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Game art (CC0 textures, HDRIs, glTF models): long-lived browser cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
