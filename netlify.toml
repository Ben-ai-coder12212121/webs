# Detourr on Netlify: the site is the static index.html at the repo root,
# plus one serverless function for live leaderboards (netlify/functions/lb.mjs).
[build]
  publish = "."
  command = ""
  # Only deploy when the latest commit message contains [deploy]; every other push is skipped
  # (exit 0 = skip build), so batching work doesn't spend deploy credits.
  ignore = "git log -1 --pretty=%B | grep -q '\\[deploy\\]' && exit 1 || exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Game art (CC0 textures, HDRIs, glTF models): long-lived browser cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
