<div class="seo">
<div class="wrap"><div class="top"><a class="pill" href="/">← All games</a></div><main class="card"><div class="body"><h1>Garden Guard</h1><p>Bugs are marching on your vegetable patch. Collect dew, plant pod shooters, frost pods, stump walls and pepper bombs in five lanes, and hold out for ten waves.</p></div></main></div>

<script>
/* ===================== Garden Guard: game code ===================== */
G.push({id:'m_garden',levels:true,name:'Garden Guard',kind:'arcade',tint:'#e0f5c8',blurb:'Bugs are marching on your vegetable patch. Collect dew, plant pod shooters, frost pods, stump walls and pepper bombs in five lanes, and hold out for ten waves.',fmt:b=>'wave '+b,
art:'<rect x="0" y="0" width="120" height="72" fill="#8ad05a"/><rect x="0" y="0" width="40" height="72" fill="#7bc04e"/><rect x="80" y="0" width="40" height="72" fill="#7bc04e"/><circle cx="20" cy="54" r="12" fill="#3ab04a" stroke="#1D1A2F" stroke-width="2"/><rect x="16" y="30" width="8" height="14" fill="#2a8a3a"/><circle cx="20" cy="22" r="5" fill="#b8ff6a" stroke="#1D1A2F" stroke-width="2"/><ellipse cx="60" cy="16" rx="11" ry="14" fill="#6a3a8a" stroke="#1D1A2F" stroke-width="2"/><ellipse cx="100" cy="30" rx="11" ry="14" fill="#8a5a2a" stroke="#1D1A2F" stroke-width="2"/>',
run(root,c){const W=400,H=640,CW=80,TOP=96,RH=62,ROWS=8,COLS=5,BOT=TOP+RH*ROWS;const {cv,x}=MOB.canvas(root,W,H);const FX=MOB.parts(),FL=MOB.floats();
  const PL={bloom:{n:'Glow Bloom',cost:50,hp:5,c:'#ffd23f',cd:6000},pod:{n:'Pod Shooter',cost:100,hp:5,c:'#3ab04a',cd:6000},frost:{n:'Frost Pod',cost:175,hp:5,c:'#6ad0ff',cd:8000},stump:{n:'Stump Wall',cost:50,hp:40,c:'#9a6a3a',cd:18000},pepper:{n:'Pepper Bomb',cost:150,hp:99,c:'#ff4a2a',cd:25000}};
  const KEYS=['bloom','pod','frost','stump','pepper'];
  const BUG={grub:{hp:10,sp:.012,c:'#b8a070',dmg:1},beetle:{hp:28,sp:.011,c:'#6a3a8a',dmg:1},hopper:{hp:8,sp:.028,c:'#5ab04a',dmg:1},snail:{hp:60,sp:.0065,c:'#c87a3a',dmg:2}};
  let grid,bugs,shots,drops,dew,sel,cool,wave,waveT,spawnQ,rakes,state,t,won;
  function reset(){grid=[...Array(ROWS)].map(()=>Array(COLS).fill(null));bugs=[];shots=[];drops=[];dew=150;sel=null;cool={};wave=0;waveT=c.pick(20000,15000,12000);spawnQ=[];rakes=[1,1,1,1,1];state='ready';t=0;won=false;upd()}
  const upd=()=>c.stat('Wave '+wave+'/10 · Dew '+dew+' · Best '+(c.best()||0));
  function nextWave(){wave++;const n=Math.round((2+wave*1.6)*c.pick(.8,1,1.3));const pool=wave<3?['grub']:wave<5?['grub','grub','hopper','beetle']:['grub','beetle','hopper','beetle','snail'];
    for(let i=0;i<n;i++)spawnQ.push({at:t+i*MOB.rnd(1400,2600)*c.pick(1.2,1,.8),k:MOB.pick(pool)});if(wave%5===0)spawnQ.push({at:t+n*1500,k:'snail'});FL.add('Wave '+wave,W/2,H/2,'#fff');upd()}
  function place(col,row){const k=sel;if(!k||grid[row][col])return;const P=PL[k];if(dew<P.cost||(cool[k]||0)>t)return;dew-=P.cost;cool[k]=t+P.cd*c.pick(.7,1,1.15);grid[row][col]={k,hp:P.hp,t:0,fire:MOB.rnd(0,800),boom:k==='pepper'?900:0};sel=null;beep(600,.05,'triangle',.05);upd()}
  MOB.drag(c,cv,W,H,{down:p=>{if(state==='ready'){state='play';return}if(state==='over'){if(t-overT>600)reset();return}
    for(const d of drops)if(!d.got&&Math.hypot(p.x-d.x,p.y-d.y)<26){d.got=1;dew+=25;beep(1100,.05,'sine',.05);upd();return}
    if(p.y<TOP){const i=Math.floor(p.x/(W/5));const k=KEYS[i];if(k)sel=sel===k?null:k;return}
    if(p.y>=TOP&&p.y<BOT){const col=Math.floor(p.x/CW),row=Math.floor((p.y-TOP)/RH);if(sel)place(col,row)}}});
  let overT=0;
  function update(dt){t+=dt;FX.step(dt);FL.step(dt);if(state!=='play')return;
    waveT-=dt;if(waveT<=0&&wave<10){nextWave();waveT=c.pick(26000,22000,19000)}
    if(Math.random()<dt/c.pick(6000,7500,9000))drops.push({x:MOB.rnd(30,W-30),y:TOP,ty:MOB.rnd(TOP+40,BOT-30),t:0});
    for(let i=spawnQ.length-1;i>=0;i--)if(spawnQ[i].at<=t){const k=spawnQ[i].k,B=BUG[k];bugs.push({k,col:Math.random()*COLS|0,y:TOP-20,hp:B.hp*c.pick(.8,1,1.25),max:B.hp,slow:0,eat:0,wob:Math.random()*6});spawnQ.splice(i,1)}
    for(let r=0;r<ROWS;r++)for(let cI=0;cI<COLS;cI++){const p=grid[r][cI];if(!p)continue;p.t+=dt;const cx=cI*CW+CW/2,cy=TOP+r*RH+RH/2;
      if(p.k==='bloom'&&p.t>7000){p.t=0;drops.push({x:cx+MOB.rnd(-10,10),y:cy,ty:cy+MOB.rnd(-6,6),t:0,from:1})}
      if((p.k==='pod'||p.k==='frost')){p.fire-=dt;if(p.fire<=0&&bugs.some(b=>b.col===cI&&b.y<cy)){p.fire=1400;shots.push({col:cI,y:cy-20,frost:p.k==='frost'});beep(900,.02,'square',.02)}}
      if(p.k==='pepper'){p.boom-=dt;if(p.boom<=0){FX.burst(cx,cy,50,['#ff4a2a','#ffd23f','#fff'],6,700);beep(70,.4,'sawtooth',.15);for(const b of bugs)if(Math.abs(b.col-cI)<=1&&Math.abs(b.y-cy)<RH*1.5)b.hp-=90;grid[r][cI]=null}}}
    for(const s of shots){s.y-=dt*.32;for(const b of bugs)if(!s.hit&&b.col===s.col&&Math.abs(b.y-s.y)<16&&b.hp>0){s.hit=1;b.hp-=s.frost?2.5:3;if(s.frost)b.slow=3000;FX.burst(b.col*CW+CW/2,b.y,5,s.frost?'#bff':'#b8ff6a',2,300)}}shots=shots.filter(s=>!s.hit&&s.y>TOP-20);
    for(const b of bugs){if(b.hp<=0){if(!b.dead){b.dead=1;FX.burst(b.col*CW+CW/2,b.y,16,BUG[b.k].c,3,500)}continue}b.slow=Math.max(0,b.slow-dt);const row=Math.floor((b.y+20-TOP)/RH);const p=row>=0&&row<ROWS?grid[row][b.col]:null;
      if(p&&b.y+20>TOP+row*RH+14){b.eat+=dt;if(b.eat>900){b.eat=0;p.hp-=BUG[b.k].dmg;beep(200,.03,'square',.02);if(p.hp<=0)grid[row][b.col]=null}}
      else b.y+=BUG[b.k].sp*dt*(b.slow?.5:1)*c.pick(.85,1,1.15);
      if(b.y>BOT-10){if(rakes[b.col]){rakes[b.col]=0;FL.add('Rake!',b.col*CW+CW/2,BOT-30,'#ffd23f');beep(400,.2,'square',.08);for(const o of bugs)if(o.col===b.col){o.hp=0}}else{state='over';overT=t;c.stat('The bugs got in! Wave '+wave+' · Best '+(c.best()||0));beep(90,.6,'sawtooth',.15)}}}
    bugs=bugs.filter(b=>b.hp>0);
    for(const d of drops){d.t+=dt;if(d.y<d.ty)d.y+=dt*.08;if(d.t>9000)d.got=1}drops=drops.filter(d=>!d.got);
    if(wave>=10&&!spawnQ.length&&!bugs.length&&!won){won=true;c.best(10);FL.add('Garden saved!',W/2,H/2,'#ffd23f');state='over';overT=t;c.stat('You held all 10 waves! Best '+(c.best()||0))}
    if(wave>0&&!won)c.best(wave-1||0)}
  function plant(p,cx,cy){const k=p.k;x.save();x.translate(cx,cy);const bob=Math.sin(t/300+cx)*1.5;
    if(k==='bloom'){x.fillStyle='#2a8a3a';x.fillRect(-2,0,4,18);for(let i=0;i<8;i++){x.fillStyle='#ffd23f';x.beginPath();x.ellipse(Math.cos(i*.785)*10,-6+Math.sin(i*.785)*10+bob,7,4,i*.785,0,7);x.fill()}x.fillStyle='#8a5a1a';x.beginPath();x.arc(0,-6+bob,7,0,7);x.fill()}
    else if(k==='pod'||k==='frost'){const col=k==='pod'?'#3ab04a':'#5ac8f0';x.fillStyle='#2a7a2a';x.fillRect(-3,4,6,16);x.fillStyle=col;x.beginPath();x.arc(0,0+bob,15,0,7);x.fill();x.strokeStyle='#1D1A2F';x.lineWidth=2;x.stroke();x.fillStyle=col;x.fillRect(-6,-26+bob,12,14);x.strokeRect(-6,-26+bob,12,14);x.fillStyle='#1D1A2F';x.fillRect(-7,-2+bob,4,4);x.fillRect(3,-2+bob,4,4)}
    else if(k==='stump'){x.fillStyle='#9a6a3a';MOB.rr(x,-22,-18,44,38,8);x.fill();x.strokeStyle='#1D1A2F';x.lineWidth=2;x.stroke();x.fillStyle='#c89a5a';x.beginPath();x.ellipse(0,-16,20,6,0,0,7);x.fill();x.stroke();if(p.hp<25){x.strokeStyle='#5a3a1a';x.beginPath();x.moveTo(-8,-6);x.lineTo(2,6);x.stroke()}}
    else if(k==='pepper'){const s=1+Math.max(0,(900-p.boom)/900)*.4;x.scale(s,s);x.fillStyle='#ff4a2a';x.beginPath();x.ellipse(0,0,11,17,0,0,7);x.fill();x.strokeStyle='#1D1A2F';x.lineWidth=2;x.stroke();x.fillStyle='#2a8a3a';x.fillRect(-3,-22,6,7)}x.restore()}
  function bug(b){const cx=b.col*CW+CW/2,B=BUG[b.k];x.save();x.translate(cx+Math.sin(t/200+b.wob)*3,b.y);const s=b.k==='snail'?1.4:b.k==='hopper'?.85:1;x.scale(s,s);
    if(b.k==='snail'){x.fillStyle='#e8c8a0';MOB.rr(x,-10,-6,20,30,8);x.fill();x.fillStyle=B.c;x.beginPath();x.arc(0,-2,14,0,7);x.fill();x.strokeStyle='#5a2a0a';x.lineWidth=2;x.beginPath();x.arc(0,-2,8,0,5);x.stroke()}
    else{x.strokeStyle='#1D1A2F';x.lineWidth=2;for(const sd of[-1,1])for(let j=0;j<3;j++){x.beginPath();x.moveTo(sd*8,-6+j*7);x.lineTo(sd*16,-2+j*7+Math.sin(t/80+j)*2);x.stroke()}x.fillStyle=B.c;x.beginPath();x.ellipse(0,0,11,15,0,0,7);x.fill();x.stroke();
      if(b.k==='beetle'){x.beginPath();x.moveTo(0,-15);x.lineTo(0,15);x.stroke()}x.fillStyle='#1D1A2F';x.beginPath();x.arc(0,13,6,0,7);x.fill();x.fillStyle='#fff';x.fillRect(-4,13,3,3);x.fillRect(1,13,3,3)}
    if(b.slow){x.fillStyle='rgba(150,220,255,.4)';x.beginPath();x.arc(0,0,16,0,7);x.fill()}x.restore();if(b.hp<b.max){x.fillStyle='#300';x.fillRect(cx-14,b.y-24,28,4);x.fillStyle='#ff5a5a';x.fillRect(cx-14,b.y-24,28*Math.max(0,b.hp/b.max/c.pick(.8,1,1.25)),4)}}
  function draw(){x.fillStyle='#5a3a24';x.fillRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let cI=0;cI<COLS;cI++){x.fillStyle=(r+cI)%2?'#8ad05a':'#7cc24e';x.fillRect(cI*CW,TOP+r*RH,CW,RH)}
    x.fillStyle='#c8a070';x.fillRect(0,BOT,W,H-BOT);for(let cI=0;cI<COLS;cI++){x.fillStyle='#6a4a2a';for(let k=0;k<4;k++){x.beginPath();x.ellipse(cI*CW+18+k*15,BOT+26,6,10,0,0,7);x.fill()}x.fillStyle='#e04a2a';x.fillRect(cI*CW+34,BOT+10,12,12);if(rakes[cI]){x.strokeStyle='#8a8a8a';x.lineWidth=3;x.beginPath();x.moveTo(cI*CW+10,BOT+4);x.lineTo(cI*CW+70,BOT+4);x.stroke()}}
    for(let r=0;r<ROWS;r++)for(let cI=0;cI<COLS;cI++)if(grid[r][cI])plant(grid[r][cI],cI*CW+CW/2,TOP+r*RH+RH/2+4);
    for(const s of shots){x.fillStyle=s.frost?'#bff4ff':'#b8ff6a';x.beginPath();x.arc(s.col*CW+CW/2,s.y,6,0,7);x.fill();x.strokeStyle='#1D1A2F';x.lineWidth=1.5;x.stroke()}
    for(const b of bugs)if(b.hp>0)bug(b);
    for(const d of drops){x.fillStyle='rgba(150,220,255,.9)';x.beginPath();x.arc(d.x,d.y,15,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();MOB.txt(x,'25',d.x,d.y+1,12,'#1D1A2F')}
    x.fillStyle='#3a2414';x.fillRect(0,0,W,TOP);const cw=W/5;KEYS.forEach((k,i)=>{const P=PL[k],px=i*cw+4;const ok=dew>=P.cost&&(cool[k]||0)<=t;MOB.rr(x,px,6,cw-8,TOP-12,10);x.fillStyle=sel===k?'#ffd23f':ok?'#f5ecd8':'#8a7a6a';x.fill();
      plant({k,hp:99,boom:900},px+(cw-8)/2,40);if((cool[k]||0)>t){x.fillStyle='rgba(0,0,0,.4)';x.fillRect(px,6,cw-8,(TOP-12)*((cool[k]-t)/(PL[k].cd*c.pick(.7,1,1.15))))}MOB.txt(x,String(P.cost),px+(cw-8)/2,TOP-18,14,'#1D1A2F')});
    MOB.rr(x,W-94,TOP+6,88,26,13);x.fillStyle='rgba(0,0,0,.45)';x.fill();MOB.txt(x,'💧 '+dew,W-50,TOP+19,15,'#fff');MOB.txt(x,'Wave '+wave+'/10',60,TOP+19,15,'#fff');
    FX.draw(x);FL.draw(x);if(sel)MOB.txt(x,'Tap a square to plant '+PL[sel].n,W/2,H-12,13,'#1D1A2F');
    if(state==='ready')banner(x,W,H,'Garden Guard','Tap dew drops, pick a plant, tap a square');if(state==='over')banner(x,W,H,won?'Garden saved!':'Bugs got in!','Wave '+wave+' · tap to replay')}
  reset();c.loop(dt=>{update(dt);draw()})}});
</script>
