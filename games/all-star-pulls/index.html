function addItems(items){
 for(const it of items){const id=it.cd.id;it.isNew=!has(it.cd);it.newHolo=it.holo&&!(st.holo[id]>0);
  if(it.holo){st.holo[id]=(st.holo[id]||0)+1;st.st.holoPulls++}else st.own[id]=(st.own[id]||0)+1;
  st.st.pulled[it.cd.r]++;if(it.isNew||it.newHolo)st.newc[id]=1}
}
function rollR(odds,pool){const av=[0,1,2,3,4].map(r=>pool.some(cd=>cd.r===r));let t=0;odds.forEach((w,r)=>{if(av[r])t+=w});if(t<=0){for(let r=4;r>=0;r--)if(av[r])return r}let v=Math.random()*t;for(let r=0;r<5;r++){if(!av[r])continue;v-=odds[r];if(v<=0)return r}for(let r=4;r>=0;r--)if(av[r])return r;return 0}
function roll(P){const pool=P.sport?CARDS.filter(cd=>cd.sport.id===P.sport):CARDS;const out=[];for(let i=0;i<P.n;i++){const odds=i===P.n-1&&P.g?P.g:P.odds,r=rollR(odds,pool);out.push({cd:pk(pool.filter(cd=>cd.r===r)),holo:Math.random()<P.holo})}return out}
function extras(cd){return{b:Math.max(0,(st.own[cd.id]||0)-1),h:Math.max(0,(st.holo[cd.id]||0)-1)}}
function sellExtras(list){let v=0,n=0;for(const cd of list){const e=extras(cd);if(e.b){v+=e.b*sellV(cd,false);n+=e.b;st.own[cd.id]=1}if(e.h){v+=e.h*sellV(cd,true);n+=e.h;st.holo[cd.id]=1}}if(n){st.st.sold+=n;addCoins(v);checkAll()}return{v,n}}
function extrasValue(list){let v=0,n=0;for(const cd of list){const e=extras(cd);v+=e.b*sellV(cd,false)+e.h*sellV(cd,true);n+=e.b+e.h}return{v,n}}

function vPlay(){

function flipCard(cd,holo,w){const f=E('div','fc');f.innerHTML='<div class="shk"><div class="in"><div class="face back"></div><div class="face front"></div></div></div>';f.querySelector('.back').append(backCanvas(w));if(cd){const fr=f.querySelector('.front');fr.append(cardCanvas(cd,holo,w));if(holo)fr.append(E('div','shine'))}f.style.setProperty('--g',cd?RAR[cd.r].glow:'#fff');return f}
function cpuHand(d){const out=[],used=new Set();while(out.length<5){const r=rollR(DIFF[d].odds,CARDS),list=CARDS.filter(cd=>cd.r===r&&!used.has(cd.id));if(!list.length)continue;const cd=pk(list);used.add(cd.id);out.push({cd,holo:d===2&&Math.random()<.2})}return out}
function myHand(){const all=bestOwned(999),seen=new Set(),uniqList=[];for(const o of all){if(seen.has(o.cd.id))continue;seen.add(o.cd.id);uniqList.push(o)}const top=uniqList.slice(0,Math.max(5,Math.min(15,uniqList.length)));const pool=top.length>=5?top:all;return shuf(pool).slice(0,5)}
async function clash(d){
 const D=DIFF[d];let alive2=true;game={stop:()=>{alive2=false}};
 const hand=myHand(),cpu=cpuHand(d),order=shuf([0,1,2,3,rnd(4)]);let me=0,op=0,rd=0,pickRes=null;

 const sc=E('div','sc');const ban=E('div','statban');const ar=E('div','arena2');const res=E('div','res');const hd=E('div','hand');const bar=E('div','row');
 const sMe=E('div','spot','Your card'),sOp=E('div','spot','CPU card');ar.append(sMe,E('div','vs','VS'),sOp);

 const used=new Set();
 const drawHand=(si)=>{hd.innerHTML='';hand.forEach((o,i)=>{const s=cardSlot(o.cd,o.holo,90,{force:1});if(used.has(i))s.classList.add('used');else{const v=statV(o.cd,o.holo,si);const t=E('div','sv',STN[si]+' '+v);t.style.color=STC[si];s.append(t);s.addEventListener('click',()=>{if(pickRes){A.click();const f=pickRes;pickRes=null;f(i)}})}hd.append(s)})};
 while(alive2&&rd<5&&me<3&&op<3){

  sMe.innerHTML='Your card';sOp.innerHTML='CPU card';drawHand(si);A.tn(520,0,.15,'triangle',.07);A.tn(780,.1,.2,'triangle',.07);
  const pi=await new Promise(r=>{pickRes=r;curKey=k=>{const n=+k;if(n>=1&&n<=5&&!used.has(n-1)&&pickRes){const f=pickRes;pickRes=null;f(n-1)}}});curKey=null;
  if(!alive2)return;used.add(pi);drawHand(si);
  const mine=hand[pi];const fm=flipCard(mine.cd,mine.holo,150);fm.classList.add('up');sMe.innerHTML='';sMe.append(fm);A.whoosh();

  const fo=flipCard(co.cd,co.holo,150);sOp.innerHTML='';sOp.append(fo);await wait(500);if(!alive2)return;fo.classList.add('up');A.flip(co.cd.r>=2?1:co.cd.r);await wait(500);if(!alive2)return;
  const a=statV(mine.cd,mine.holo,si),b=statV(co.cd,co.holo,si);
  if(a>b){me++;res.innerHTML=STN[si]+' '+a+' beats '+b+'. Round to you!';res.className='res win';A.good();fm.classList.add('lit');const r=fm.getBoundingClientRect(),ar2=APP.getBoundingClientRect();confetti(24,r.left-ar2.left+r.width/2,r.top-ar2.top+r.height/2)}
  else if(b>a){op++;res.innerHTML=STN[si]+' '+b+' beats '+a+'. CPU takes it.';res.className='res lose';A.bad();fo.classList.add('lit')}

 }

}
