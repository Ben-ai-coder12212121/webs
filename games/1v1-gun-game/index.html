<div class="seo">
<div class="wrap"><div class="top"><a class="pill" href="/">← All games</a></div><main class="card"><div class="body"><h1>1v1 Gun Game</h1><p>First-person 1v1 Gun Game on a Nuketown-style street. Every kill upgrades your weapon, from pistol to rocket launcher. Land the final kill with the knife to win. Face a bot from Easy to Veteran.</p></div></main></div>
</div>
<!-- shared code (see /js/). Only the libraries this game needs are loaded. -->
<script src="/js/core.js"></script>
<script src="/js/catalog-lite.js"></script>
<script>
/* ===================== 1v1 Gun Game: game code ===================== */
// The game itself is a standalone three.js (r160) app in ./play/ (ES modules, see play/README.md).
// This page embeds it and records match wins as the score.
G.push({id:'gungame1v1',name:'1v1 Gun Game',kind:'game',wide:true,big:true,tint:'#ffc21a',
blurb:'First-person 1v1 Gun Game on a Nuketown-style street. Every kill upgrades your weapon, from pistol to rocket launcher. Land the final kill with the knife to win. Face a bot from Easy to Veteran.',
fmt:b=>b+(b===1?' win':' wins'),
art:'<rect x="8" y="10" width="50" height="40" rx="5" fill="#2F6FE0" stroke="#1D1A2F" stroke-width="3"/><rect x="62" y="10" width="50" height="40" rx="5" fill="#D6363C" stroke="#1D1A2F" stroke-width="3"/><text x="60" y="40" font-family="Impact,Arial Black,sans-serif" font-size="24" text-anchor="middle" fill="#FFC21A" stroke="#1D1A2F" stroke-width="2" paint-order="stroke">1v1</text><g stroke="#FFFDF6" stroke-width="3" stroke-linecap="round"><path d="M15 30H27M21 24V36"/><path d="M93 30H105M99 24V36"/></g>',
run(root,c){
  const box=el('div',{class:'g3'});
  const f=el('iframe',{src:'/games/1v1-gun-game/play/',title:'1v1 Gun Game',allow:'fullscreen; autoplay',style:'border:0;width:100%;height:100%;display:block;background:#0f1724'});
  box.append(f);root.append(box);
  const wins=()=>c.best()||0;
  c.stat(wins()?'Wins: '+wins():'Get a kill with every weapon. The knife kill wins.');
  f.addEventListener('load',()=>{try{f.contentWindow.focus()}catch(e){}});
  c.on(window,'message',e=>{
    if(e.origin!==location.origin||e.source!==f.contentWindow)return;
    const d=e.data;if(!d||d.gungame!=='end')return;
    if(d.win){c.best(wins()+1);c.stat('Wins: '+wins())}
  });
}});
</script>
<script src="/js/app.js"></script>
</body></html>
