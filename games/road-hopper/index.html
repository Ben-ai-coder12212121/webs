let rows=new Map(),genRow=0,lastType='grass',groupLeft=0,groupType='grass',prevReach=null;

function planType(r){if(r<3)return'grass';if(groupLeft<=0){const d=difficulty(r);const opts=lastType==='grass'?['road','road','river','rail']:['grass','grass','road','river','rail'];let t=pickA(opts);if(t===groupType&&t!=='grass')t='grass';

function makeRow(r){const type=r<-0?'grass':planType(r);const bi=biomeAt(r);const row={r,type,meshes:[],objs:[],trees:new Set(),coin:null,dir:Math.random()<.5?1:-1,v:0,bi};const z=-r;

/* ---------------- player ---------------- */
const P={g:new T.Group(),m:null,blob:null};scene.add(P.g);
function setHopper(id){const h=HOPPERS.find(q2=>q2.id===id)||HOPPERS[0];if(P.m){P.g.remove(P.m);P.m.geometry.dispose()}P.m=new T.Mesh(vox(h.box()),VM);P.m.castShadow=!LOW;P.g.add(P.m)}
P.blob=new T.Mesh(blobGeo,blobMat);scene.add(P.blob);
const hawk=(()=>{const g=new T.Mesh(vox([[0,0,0,.9,.6,1.6,0x7a4a2a],[0,.1,-1,.6,.5,.6,0x8a5a3a],[0,.05,-1.4,.24,.2,.3,0xffc13a],[-.2,.25,-1.2,.1,.12,.04,D],[.2,.25,-1.2,.1,.12,.04,D],[-1.5,.1,0,2.2,.12,1.0,0x6a3a1a],[1.5,.1,0,2.2,.12,1.0,0x6a3a1a],[-2.5,.1,.15,.6,.1,.7,0x5a2a10],[2.5,.1,.15,.6,.1,.7,0x5a2a10],[0,0,1.1,.7,.12,.7,0x6a3a1a],[-.25,-.4,0,.12,.3,.12,0xffc13a],[.25,-.4,0,.12,.3,.12,0xffc13a]]),VM);g.castShadow=!LOW;g.visible=false;scene.add(g);return g})();

/* particles */
const NP=LOW?50:110;const pPos=new Float32Array(NP*3),pCol=new Float32Array(NP*3);const parts=[];for(let i=0;i<NP;i++){parts.push({life:0,x:0,y:-50,z:0,vx:0,vy:0,vz:0});pPos[i*3+1]=-50}
const pGeo=new T.BufferGeometry();pGeo.setAttribute('position',new T.BufferAttribute(pPos,3));pGeo.setAttribute('color',new T.BufferAttribute(pCol,3));
const pts=new T.Points(pGeo,new T.PointsMaterial({size:.2,vertexColors:true,transparent:true,depthWrite:false}));pts.frustumCulled=false;scene.add(pts);let pI=0;
function burst(x,y,z,n,col,sp,up){tc.setHex(col);for(let k=0;k<n;k++){const i=pI;pI=(pI+1)%NP;const pa=parts[i];pa.life=.45+Math.random()*.4;pa.x=x;pa.y=y;pa.z=z;const a=Math.random()*6.28,s=sp*(.3+Math.random()*.7);pa.vx=Math.cos(a)*s;pa.vz=Math.sin(a)*s;pa.vy=(up||2)+Math.random()*sp;pCol[i*3]=tc.r;pCol[i*3+1]=tc.g;pCol[i*3+2]=tc.b}}

/* ---------------- state ---------------- */
let state='title',pr=0,px=0,score=0,runCoins=0,camRow=0,camX=0,rider=null,face=0,faceT=0,deadT=0,deathKind='',queue=null,hopT=1,hopFrom={x:0,r:0},hopTo={x:0,r:0},squash=0,startT=0,toastT=0,bi=0,newBestShown=false,bumpT=0,idleT=0;
const HOP=.13;let hopCarry=0;
function toast(a,b){ui.toast.innerHTML=a+(b?'<small>'+b+'</small>':'');ui.toast.classList.add('on');toastT=1.4}
function reset(){for(const [,row] of [...rows])dropRow(row);rows.clear();genRow=-8;groupLeft=0;groupType='grass';lastType='grass';prevReach=null;
  pr=0;px=0;score=0;runCoins=0;camRow=0;camX=0;rider=null;face=Math.PI;faceT=Math.PI;deadT=0;queue=null;hopT=1;hopFrom={x:0,r:0};hopTo={x:0,r:0};squash=0;newBestShown=false;idleT=0;
  ensureRows(0);P.g.position.set(0,0,0);P.g.rotation.set(0,Math.PI,0);P.g.scale.set(1,1,1);P.g.visible=true;hawk.visible=false;bi=0;scene.background.set(BIOMES[0].sky);updHud()}
function updHud(){ui.score.textContent=score;ui.best.textContent='Best '+(Math.max(c.best()||0,score));ui.coins.textContent=save.coins+runCoins}

/* ---------------- input ---------------- */
const DIRS={up:[0,1,Math.PI],down:[0,-1,0],left:[-1,0,-Math.PI/2],right:[1,0,Math.PI/2]};
function input(d){if(state==='title'){if(!ui.chars.hidden)return;startGame();if(d!=='up')return}
  if(state==='over'){return}if(state!=='play')return;if(hopT<1){queue=d;return}doHop(d)}
function startGame(){state='play';ui.title.hidden=true;ui.hud.hidden=false;updHud();startT=0;save.runs++;persist();c.stat('Hopping')}
function doHop(d){const [dx,dr,ang]=DIRS[d];faceT=ang;const tr=pr+dr;let tx;
  const cur=rowAt(pr);const onLog=rider&&!rider.pad;
  if(dr!==0)tx=onLog?Math.round(px):Math.round(px);else tx=(onLog?px:Math.round(px))+dx;
  if(tr<Math.floor(camRow)-3||tr<-6){bumpT=.15;SFX.bump();return}
  if(Math.abs(tx)>HALF+.45){bumpT=.15;SFX.bump();return}
  const R=rowAt(tr);if(!R)return;if(R.type==='grass'&&R.trees.has(Math.round(tx))){bumpT=.15;SFX.bump();return}
  hopCarry=(onLog&&dr===0&&cur)?cur.dir*cur.v:0;hopFrom={x:px,r:pr};hopTo={x:tx,r:tr};hopT=0;rider=null;squash=.6;SFX.hop();idleT=0}
function land(){pr=hopTo.r;px=hopTo.x;const R=rowAt(pr);if(pr>score){score=pr;updHud();const b=c.best()||0;if(!newBestShown&&b>0&&score>b){newBestShown=true;toast('New best!');SFX.best()}
    const nb2=biomeAt(score);if(nb2!==bi){bi=nb2;toast(['Meadow','Autumn woods','Snowfield'][bi]+'!')}}
  if(R.type==='river'){let on=null;for(const o of R.objs){if(Math.abs(px-o.x)<o.w/2+.12){on=o;break}}
    if(!on)return die('water');rider=on;if(on.pad){px=on.x}else{const left=on.x-on.w/2;const cell=Math.max(0,Math.min(on.w-1,Math.floor(px-left)));px=left+cell+.5}
    on.dip=1}
  if(R.coin!=null&&Math.round(px)===R.coin&&R.coinM&&R.coinM.visible){R.coinM.visible=false;R.coin=null;runCoins++;SFX.coin();burst(px,.6,-pr,8,0xffd23f,2,2);updHud()}
  squash=-.5;if(queue){const qd=queue;queue=null;doHop(qd)}}
c.on(document,'keydown',e=>{const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;const k=e.key.toLowerCase();
  const map={arrowup:'up',w:'up',' ':'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
  if(k==='enter'&&state==='over'&&deadT>.6){again();e.preventDefault();return}
  if(map[k]){e.preventDefault();if(e.repeat)return;if(state==='over'&&deadT>.6&&map[k]==='up'){again();return}input(map[k])}});
let sw=null;
c.on(cvs,'pointerdown',e=>{sw={x:e.clientX,y:e.clientY,used:false,id:e.pointerId};try{cvs.setPointerCapture(e.pointerId)}catch(_){}cvs.focus({preventScroll:true})});
c.on(cvs,'pointermove',e=>{if(!sw||sw.used||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.hypot(dx,dy)<26)return;sw.used=true;input(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'))});
c.on(cvs,'pointerup',e=>{if(!sw||e.pointerId!==sw.id)return;const u=sw.used;sw=null;if(!u){if(state==='over'){if(deadT>.6)again()}else input('up')}});
c.on(cvs,'pointercancel',()=>{sw=null});

/* ---------------- death and game over ---------------- */
const WHY={car:'Splat!',train:'Train!',water:'Splash!',hawk:'The hawk got you!',swept:'Swept away!'};
function die(kind){if(state!=='play')return;state='dying';deathKind=kind;deadT=0;queue=null;
  if(kind==='car'||kind==='train'){SFX.splat();burst(px,.5,-pr,16,0xffffff,3,2);burst(px,.5,-pr,8,0xffd23f,3,2)}
  else if(kind==='water'||kind==='swept'){SFX.splash();burst(px,0,-pr,22,0xbfe8ff,2.5,3)}
  else if(kind==='hawk'){SFX.hawk();hawk.visible=true}
  const best0=c.best()||0;const best=c.best(score)||score;save.coins+=runCoins;save.top=Math.max(save.top||0,score);const unl=checkUnlocks(score);persist();
  c.after(()=>{state='over';q('#oWhy').textContent=WHY[kind];q('#oScore').textContent=score;q('#oNew').hidden=!(score>best0&&score>0);q('#oBest').textContent=Math.max(best,score);q('#oCoins').textContent='+'+runCoins;
    const ou=q('#oUnl');let canBuy=HOPPERS.find(h=>!save.own.includes(h.id)&&!h.need&&h.price<=save.coins);if(unl){ou.hidden=false;ou.innerHTML=I.star+' New hopper unlocked: '+unl.name+'!'}else if(canBuy){ou.hidden=false;ou.innerHTML=I.coin+' You can afford '+canBuy.name+' now. Open Hoppers to unlock.'}else ou.hidden=true;
    ui.over.hidden=false;c.stat('Last run '+score+' hops · Best '+Math.max(best,score));setTimeout(()=>{try{q('#oAgain').focus({preventScroll:true})}catch(_){}},50)},kind==='hawk'?1500:1000)}
function again(){SFX.ui();ui.over.hidden=true;reset();state='title';ui.title.hidden=false;ui.hud.hidden=false;q('#tBest').textContent=c.best()||0;startGame()}
q('#oAgain').addEventListener('click',again);
q('#oChars').addEventListener('click',()=>{ui.over.hidden=true;reset();state='title';ui.title.hidden=false;ui.hud.hidden=true;q('#tBest').textContent=c.best()||0;openChars()});
q('#bChars').addEventListener('click',e=>{e.stopPropagation();openChars()});

/* ---------------- hopper picker ---------------- */
let selId=save.cur;const thumbs={};
function thumb(h){if(thumbs[h.id])return thumbs[h.id];const cv=document.createElement('canvas');cv.width=112;cv.height=112;const x=cv.getContext('2d');
  // tiny isometric-ish render of the voxel boxes, painted back to front
  const boxes=h.box().slice().sort((a,b)=>(b[2]-a[2])||(a[1]-b[1]));const S2=58,ox=56,oy=86;const iso=(X,Y,Z)=>[ox+(X-Z*.35)*S2,oy-(Y*S2)+Z*.35*S2*.6];
  const shade=(col,k)=>{tc.setHex(col);return 'rgb('+Math.min(255,tc.r*255*k|0)+','+Math.min(255,tc.g*255*k|0)+','+Math.min(255,tc.b*255*k|0)+')'};
  for(const b of boxes){const[cx,cy,cz,w,hh,dd,col]=b;const z0=cz-dd/2,x0=cx-w/2,x1=cx+w/2,y0=cy-hh/2,y1=cy+hh/2;
    const poly=(pp,f)=>{x.fillStyle=f;x.beginPath();pp.forEach((p2,i)=>{const[a,b2]=iso(...p2);i?x.lineTo(a,b2):x.moveTo(a,b2)});x.closePath();x.fill()};
    poly([[x1,y0,z0],[x1,y0,z0+dd],[x1,y1,z0+dd],[x1,y1,z0]],shade(col,.78));poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z0+dd],[x0,y1,z0+dd]],shade(col,1.08));poly([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],shade(col,.95))}
  thumbs[h.id]=cv;return cv}
function openChars(){SFX.ui();selId=save.cur;ui.chars.hidden=false;ui.title.style.visibility='hidden';renderChars()}
function closeChars(){ui.chars.hidden=true;ui.title.style.visibility='';setHopper(save.cur);P.g.rotation.y=Math.PI}
q('#cClose').addEventListener('click',()=>{SFX.ui();closeChars()});
function renderChars(){q('#cCoins').textContent=save.coins;const gEl=q('#cGrid');gEl.innerHTML='';
  for(const h of HOPPERS){const own=save.own.includes(h.id);const b=document.createElement('button');b.type='button';b.className='cc'+(h.id===selId?' sel':'')+(own?'':' lock');
    const tcv=thumb(h);const cl=document.createElement('canvas');cl.width=112;cl.height=112;cl.getContext('2d').drawImage(tcv,0,0);b.append(cl);
    const nm=document.createElement('span');nm.textContent=h.name;b.append(nm);const sm=document.createElement('small');sm.innerHTML=own?(save.cur===h.id?'Picked':'Yours'):h.need?(I.lock+' '+h.need+' hops'):(I.coin+' '+h.price);b.append(sm);
    b.addEventListener('click',()=>{selId=h.id;SFX.ui();setHopper(h.id);renderChars()});gEl.append(b)}
  const h=HOPPERS.find(q2=>q2.id===selId);const own=save.own.includes(h.id);const act=q('#cAct');q('#cInfo').innerHTML='<b>'+h.name+'</b>'+h.line;
  if(own){act.textContent=save.cur===h.id?'Picked':'Pick';act.disabled=save.cur===h.id;act.onclick=()=>{save.cur=h.id;persist();SFX.ui();renderChars()}}
  else if(h.need){act.textContent='Locked';act.disabled=true;act.onclick=null}
  else{act.innerHTML=I.coin+' '+h.price;act.disabled=save.coins<h.price;act.onclick=()=>{if(save.coins<h.price)return;save.coins-=h.price;save.own.push(h.id);save.cur=h.id;persist();SFX.buy();burst(px,1,-pr,20,0xffd23f,3,3);renderChars();updHud()}}}

/* ---------------- update ---------------- */
function rowsUpdate(dt){
  for(const [r,row] of rows){const z=-r;
    if(row.type==='road'||(row.type==='river'&&!row.pads)){const L=row.wrap;for(const o of row.objs){o.x+=row.dir*row.v*dt;if(o.x>L/2)o.x-=L;else if(o.x<-L/2)o.x+=L;o.m.position.set(o.x,o.log?(o.dip>0?-.06*o.dip:0):0,z);if(o.dip>0)o.dip=Math.max(0,o.dip-dt*5)}
      if(row.type==='road'&&state==='play'&&Math.abs(r-pr)<=2&&Math.random()<dt*.04)SFX.honk()}
    else if(row.type==='river'){for(const o of row.objs){if(o.dip>0){o.dip=Math.max(0,o.dip-dt*5);o.m.position.y=-.05*o.dip}}}
    else if(row.type==='rail'){const tr=row.train;if(!tr.on){tr.t-=dt;const warn=tr.t<1.5;if(warn!==tr.warn){tr.warn=warn;if(warn&&Math.abs(r-pr)<10&&state==='play')SFX.bell()}
        if(warn){const on=Math.floor(tr.t*6)%2===0;row.lamps[0].material=on?lampMatOn:lampMatOff;row.lamps[1].material=on?lampMatOff:lampMatOn}
        if(tr.t<=0){tr.on=true;tr.x=-row.dir*(SPAN+TRAIN_LEN);tr.m.visible=true;tr.m.rotation.y=row.dir>0?Math.PI:0;if(Math.abs(r-pr)<8&&state==='play')SFX.train()}}
      else{tr.x+=row.dir*row.v*dt;tr.m.position.set(tr.x,0,z);const lit=Math.floor(performance.now()/160)%2===0;row.lamps[0].material=lit?lampMatOn:lampMatOff;row.lamps[1].material=lit?lampMatOff:lampMatOn;
        if(Math.abs(tr.x)>SPAN+TRAIN_LEN+2){tr.on=false;tr.m.visible=false;tr.t=rnd(3,7)/(1+difficulty(r)*.7);tr.warn=false;row.lamps[0].material=row.lamps[1].material=lampMatOff}}}
    if(row.coinM&&row.coinM.visible)row.coinM.rotation.y+=dt*3}}
// train mesh: the engine sits at x=0 and the cars trail along +x, so its centre is offset
function trainSpan(row){const tr=row.train;if(!tr.on)return null;const front=tr.x;return row.dir>0?[front-TRAIN_LEN+1.6,front+1.6]:[front-1.6,front+TRAIN_LEN-1.6]}
function collide(){const pz=-(hopT<1?hopFrom.r+(hopTo.r-hopFrom.r)*hopT:pr);const ppx=P.g.position.x;
  for(const r of[Math.floor(-pz),Math.ceil(-pz)]){const row=rowAt(r);if(!row)continue;if(Math.abs(-r-pz)>.42)continue;
    if(row.type==='road')for(const o of row.objs){if(Math.abs(o.x-ppx)<o.w/2+.22){die('car');return}}
    if(row.type==='rail'){const sp=trainSpan(row);if(sp){const a=row.dir>0?sp[0]:sp[0],b=sp[1];if(ppx>Math.min(a,b)-.3&&ppx<Math.max(a,b)+.3){die('train');return}}}}}
function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)ui.toast.classList.remove('on')}
  rowsUpdate(dt);
  if(state==='play'){startT+=dt;idleT+=dt;
    if(hopT<1){if(hopCarry){hopFrom.x+=hopCarry*dt;hopTo.x+=hopCarry*dt}hopT=Math.min(1,hopT+dt/HOP);const k=hopT;P.g.position.x=hopFrom.x+(hopTo.x-hopFrom.x)*k;P.g.position.z=-(hopFrom.r+(hopTo.r-hopFrom.r)*k);P.g.position.y=Math.sin(k*Math.PI)*.55+(rowAt(hopTo.r)&&rowAt(hopTo.r).type==='road'?-.1*k:0);if(hopT>=1)land()}
    else{if(rider&&!rider.pad){const R=rowAt(pr);px+=R.dir*R.v*dt;if(Math.abs(px)>HALF+1.1){die('swept');return}}
      P.g.position.x=px;P.g.position.z=-pr;const R=rowAt(pr);P.g.position.y=R&&R.type==='road'?-.1:R&&R.type==='river'?(rider&&rider.log?.16+(rider.dip>0?-.06*rider.dip:0):-.06):0}
    if(state==='play')collide();
    // the camera creeps forward; fall too far behind and the hawk swoops
    const drift=.34+Math.min(.7,score/240);const tgt=pr+.5;if(tgt>camRow)camRow+=(tgt-camRow)*Math.min(1,dt*2.6);if(startT>1.2)camRow+=drift*dt;
    if(state==='play'&&pr<camRow-3.4)die('hawk')}
  // character pose
  if(state==='play'||state==='title'){let dA=faceT-face;while(dA>Math.PI)dA-=Math.PI*2;while(dA<-Math.PI)dA+=Math.PI*2;face+=dA*Math.min(1,dt*22);P.g.rotation.y=face;
    squash+=(0-squash)*Math.min(1,dt*14);if(bumpT>0)bumpT-=dt;const sy=1-squash*.35;P.m.scale.set(1+squash*.18,sy,1+squash*.18);P.m.position.z=bumpT>0?Math.sin(bumpT*40)*.05:0;
    if(state==='title'){P.g.position.set(px,0,-pr);P.m.position.y=Math.abs(Math.sin(performance.now()/300))*.12;if(!ui.chars.hidden){P.g.rotation.y=performance.now()/700;P.m.position.y=0}}else P.m.position.y=0}
  if(state==='dying'||state==='over'){deadT+=dt;const k=Math.min(1,deadT*8);
    if(deathKind==='car'){P.m.scale.set(1.35,Math.max(.12,1-k),1.35);P.g.position.y=0}
    else if(deathKind==='train'){P.g.position.x+=(rowAt(pr)?rowAt(pr).dir:1)*dt*14*Math.max(0,1-deadT);P.g.position.y=Math.max(0,P.g.position.y+dt*(4-deadT*14));P.g.rotation.z+=dt*12*Math.max(0,1-deadT)}
    else if(deathKind==='water'||deathKind==='swept'){P.g.position.y=Math.max(-1.4,-deadT*2.2);if(deadT>.6)P.g.visible=false}
    else if(deathKind==='hawk'){const t=deadT;const tx=P.g.position.x,tz=P.g.position.z;if(t<.55){const u=t/.55;hawk.position.set(tx,6-5.2*u,tz-9+9*u);hawk.rotation.set(-.3,0,0)}else{const u=t-.55;hawk.position.set(tx,.8+u*7,tz-u*9);hawk.rotation.set(.35,0,0);P.g.position.y=hawk.position.y-1.05;P.g.position.z=hawk.position.z;}}}
  ensureRows(Math.max(pr,camRow));
  // camera
  const chOpen=!ui.chars.hidden,wide=camera.aspect>1.2;const fz=chOpen?-(pr-(wide?.6:3.2)):-(camRow+1.5),fx=chOpen&&wide?px+5.4:Math.max(-1.4,Math.min(1.4,P.g.position.x*.45));camX+=(fx-camX)*Math.min(1,dt*3);
  camDir.set(.2,1,.66).normalize().multiplyScalar(camDist);const dir=camDir;
  camera.position.set(camX+dir.x,dir.y,fz+dir.z);camera.lookAt(camX,0,fz);
  sun.position.set(camX-6,18,fz+8);sun.target.position.set(camX,0,fz-2);
  const sky=BIOMES[biomeAt(camRow+6)].sky;if(sky!==curSky){curSky=sky;skyFrom.copy(scene.background);skyTo.set(sky);skyK=0}if(skyK<1){skyK=Math.min(1,skyK+dt*.7);scene.background.copy(skyFrom).lerp(skyTo,skyK)}
  waterTex.offset.x=(waterTex.offset.x+dt*.05)%1;
  P.blob.position.set(P.g.position.x,(rowAt(pr)&&rowAt(pr).type==='river'?(rider&&rider.log?.17:-.04):rowAt(pr)&&rowAt(pr).type==='road'?-.08:.02)+.005,P.g.position.z);P.blob.visible=P.g.visible&&state!=='dying'&&state!=='over';
  for(let i=0;i<NP;i++){const pa=parts[i];if(pa.life<=0)continue;pa.life-=dt;pa.vy-=9*dt;pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;pa.z+=pa.vz*dt;if(pa.life<=0)pa.y=-50;pPos[i*3]=pa.x;pPos[i*3+1]=pa.y;pPos[i*3+2]=pa.z}pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true}
const camDir=new T.Vector3();let curSky=BIOMES[0].sky,skyK=1;const skyFrom=new T.Color(),skyTo=new T.Color();

c.loop(ms=>{const dt=Math.min(.05,ms/1000);update(dt);renderer.render(scene,camera)});
setHopper(save.cur);reset();resize();q('#tBest').textContent=c.best()||0;c.stat('Best '+(c.best()||0)+' hops');
return()=>{ro.disconnect();scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.map&&m.map.dispose();m.dispose()})});for(const k in pools)for(const m of pools[k]){m.geometry&&m.geometry.dispose()}for(const k in geoCache)geoCache[k].dispose();renderer.dispose();try{renderer.forceContextLoss()}catch(e){}host.remove()};
});
}});
</script>
