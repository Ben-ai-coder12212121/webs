<div class="wrap"><div class="top"><a class="pill" href="/">← All games</a></div><main class="card"><div class="body"><h1>Spiral Drop</h1><p>Drag to spin the tower and let the bouncing ball drop through the gaps. Fall through three floors in a row to smash the next one. Red is deadly.</p></div></main></div>

<script>
/* ===================== Spiral Drop: game code ===================== */
G.push({id:'m_spiral',levels:true,name:'Spiral Drop',kind:'arcade',tint:'#e8e0ff',blurb:'Drag to spin the tower and let the bouncing ball drop through the gaps. Fall through three floors in a row to smash the next one. Red is deadly.',fmt:b=>'level '+b,
art:'<rect x="54" y="0" width="12" height="72" fill="#fff" stroke="#1D1A2F" stroke-width="2"/><ellipse cx="60" cy="22" rx="46" ry="9" fill="#9a6aff" stroke="#1D1A2F" stroke-width="2"/><ellipse cx="60" cy="50" rx="46" ry="9" fill="#9a6aff" stroke="#1D1A2F" stroke-width="2"/><path d="M40 57a22 5 0 0 0 30 0" fill="#ff4a4a"/><circle cx="60" cy="38" r="7" fill="#ffd23f" stroke="#1D1A2F" stroke-width="2"/>',
run(root,c){const W=400,H=640,CX=W/2,R=150,RI=36,RY=46,GAP=150,SL=12,TH=16;const {cv,x}=MOB.canvas(root,W,H);const FX=MOB.parts();
  let rings,rot,ball,camY,state,level,score,streak,t,hue;
  function mkRing(i,n){if(i===n)return{goal:1,s:[]};const s=new Array(SL).fill('solid');const g0=Math.random()*SL|0,gl=1+(Math.random()<.5?1:0)+(i===0?1:0);for(let k=0;k<gl;k++)s[(g0+k)%SL]='gap';
    const reds=i<2?0:Math.min(5,Math.floor(Math.random()*c.pick(1.6,2.6,3.6)+level*.25));for(let k=0;k<reds;k++){const j=Math.random()*SL|0;if(s[j]==='solid'&&Math.abs(j-g0)>0)s[j]='red'}return{s,broken:0}}
  function build(){splats.length=0;const n=8+level*2;rings=[];for(let i=0;i<=n;i++)rings.push(mkRing(i,n));rot=0;ball={y:-70,vy:0,passed:0};camY=-260;streak=0;hue=(level*47)%360}
  function reset(full){if(full){level=1;score=0}build();state='ready';upd()}
  const upd=()=>c.stat('Level '+level+' · Score '+score+' · Best level '+(c.best()||0));
  const ringY=i=>i*GAP;
  function slotAt(){const a=((Math.PI/2-rot)%(Math.PI*2)+Math.PI*4)%(Math.PI*2);return Math.floor(a/(Math.PI*2/SL))%SL}
  let dragX=null;MOB.drag(c,cv,W,H,{down:p=>{if(state==='over'){if(t-overT>500)reset(true);return}if(state==='won'){level++;build();state='play';upd();return}if(state==='ready')state='play';dragX=p.x},move:p=>{if(dragX==null)return;rot+=(p.x-dragX)*.012;dragX=p.x},up:()=>{dragX=null}});
  MOB.keys(c,{ArrowLeft:()=>{rot-=.26;if(state==='ready')state='play'},ArrowRight:()=>{rot+=.26;if(state==='ready')state='play'}});
  let overT=0;
  function update(dt){t+=dt;FX.step(dt);if(state!=='play')return;const k=dt/16;const prevY=ball.y;ball.vy+=.42*k;ball.vy=Math.min(ball.vy,11);ball.y+=ball.vy*k;
    const i=Math.floor((ball.y+10)/GAP);if(i>=0&&i<rings.length){const ry=ringY(i);if(prevY+10<=ry&&ball.y+10>=ry){const rg=rings[i];
      if(rg.goal){state='won';c.best(level);score+=10*level;beep(880,.1,'sine',.1);setTimeout(()=>beep(1320,.2,'sine',.1),120);FX.burst(CX,ry-camY,50,['#ffd23f','#fff','#ff6aa0'],6,900);upd();return}
      if(rg.broken){ball.passed++}else{const s=rg.s[slotAt()];
        if(streak>=3&&s!=='gap'){rg.broken=1;streak=0;score+=5;FX.burst(CX,ry-camY,30,['hsl('+hue+',80%,60%)','#fff'],6,700);beep(200,.2,'square',.1);ball.vy=Math.min(ball.vy,4)}
        else if(s==='gap'){streak++;score+=1+streak;rg.broken=1;beep(500+streak*120,.05,'triangle',.06);upd()}
        else if(s==='red'){state='over';overT=t;FX.burst(CX,ry-camY-10,40,['#ff4a4a','#ffd23f'],5,800);beep(90,.5,'sawtooth',.15);c.stat('Level '+level+' · Score '+score+' · Best level '+(c.best()||0));return}
        else{ball.y=ry-10;ball.vy=-8.6;streak=0;splats.push({i,a:Math.PI/2-rot,t:0});beep(300,.04,'sine',.05)}}}}
    camY+=(ball.y-200-camY)*Math.min(1,dt/120);if(camY<-260)camY=-260}
  const splats=[];
  function seg(yc,a0,a1,col,front){const n=8;x.beginPath();for(let j=0;j<=n;j++){const a=a0+(a1-a0)*j/n;x.lineTo(CX+Math.cos(a)*R,yc+Math.sin(a)*RY)}for(let j=n;j>=0;j--){const a=a0+(a1-a0)*j/n;x.lineTo(CX+Math.cos(a)*RI,yc+Math.sin(a)*RY*RI/R)}x.closePath();x.fillStyle=col;x.fill();
    if(front){x.beginPath();for(let j=0;j<=n;j++){const a=a0+(a1-a0)*j/n;x.lineTo(CX+Math.cos(a)*R,yc+Math.sin(a)*RY)}for(let j=n;j>=0;j--){const a=a0+(a1-a0)*j/n;x.lineTo(CX+Math.cos(a)*R,yc+Math.sin(a)*RY+TH)}x.closePath();x.fillStyle='rgba(0,0,0,.28)';x.fill()}}
  function ringDraw(rg,yc,half){if(rg.broken||rg.goal)return;const d=Math.PI*2/SL;for(let j=0;j<SL;j++){const st=rg.s[j];if(st==='gap')continue;const a0=j*d+rot,a1=a0+d;const mid=Math.sin((a0+a1)/2);if(half==='back'&&mid>=0||half==='front'&&mid<0)continue;
      seg(yc,a0,a1+.004,st==='red'?'#ff3a3a':'hsl('+hue+',70%,'+(62+Math.cos(a0)*6)+'%)',half==='front')}}
  function draw(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'hsl('+hue+',60%,88%)');g.addColorStop(1,'hsl('+(hue+40)+',60%,70%)');x.fillStyle=g;x.fillRect(0,0,W,H);
    const i0=Math.max(0,Math.floor((camY-60)/GAP)),i1=Math.min(rings.length-1,Math.ceil((camY+H+60)/GAP));
    x.fillStyle='rgba(255,255,255,.85)';x.fillRect(CX-16,0,32,H);x.fillStyle='rgba(0,0,0,.08)';x.fillRect(CX+6,0,10,H);
    for(let i=i0;i<=i1;i++){const yc=ringY(i)-camY;const rg=rings[i];if(rg.goal){x.fillStyle='#ffd23f';x.beginPath();x.ellipse(CX,yc,R,RY,0,0,7);x.fill();x.fillStyle='#1D1A2F';MOB.txt(x,'FINISH',CX,yc+4,20,'#1D1A2F');continue}
      ringDraw(rg,yc,'back');x.fillStyle='rgba(255,255,255,.9)';x.fillRect(CX-16,yc-RY*RI/R,32,RY*RI/R*2);ringDraw(rg,yc,'front');
      if(!rg.broken)for(const s of splats)if(s.i===i){const a=s.a+rot;if(Math.sin(a)>0){x.fillStyle='hsla('+(hue+180)+',70%,45%,.55)';x.beginPath();x.ellipse(CX+Math.cos(a)*95,yc+Math.sin(a)*RY*95/R,12,5,0,0,7);x.fill()}}}
    const by=ball.y-camY;const sq=ball.vy<-7?1.15:1;x.fillStyle='rgba(0,0,0,.15)';x.fillStyle=streak>=3?'#ff6a1a':'hsl('+(hue+180)+',80%,55%)';x.beginPath();x.ellipse(CX,by+RY*95/R-10+10,11/sq,11*sq,0,0,7);x.fill();x.strokeStyle='#1D1A2F';x.lineWidth=2;x.stroke();
    if(streak>=3){FX.burst(CX,by+RY*95/R,2,['#ffd23f','#ff6a1a'],1.5,300)}FX.draw(x);
    const prog=Math.min(1,Math.max(0,ball.y/ringY(rings.length-1)));MOB.rr(x,60,18,W-120,14,7);x.fillStyle='rgba(255,255,255,.6)';x.fill();MOB.rr(x,60,18,(W-120)*prog,14,7);x.fillStyle='hsl('+(hue+180)+',70%,50%)';x.fill();MOB.txt(x,String(level),42,25,16,'#1D1A2F');MOB.txt(x,String(level+1),W-42,25,16,'#1D1A2F');
    MOB.big(x,String(score),W/2,64,34,'#fff','#1D1A2F');
    if(state==='ready')banner(x,W,H,'Spiral Drop','Drag left and right to spin the tower');if(state==='over')banner(x,W,H,'Game over','Level '+level+' · tap to restart');if(state==='won')banner(x,W,H,'Level '+level+' cleared!','Tap for level '+(level+1))}
  reset(true);c.loop(dt=>{update(dt);draw()})}});
</script>
