run(root,c){

    gr.addColorStop(0,'rgba('+r+','+gg+','+b+','+(core||1)+')');gr.addColorStop(.3,'rgba('+r+','+gg+','+b+',.35)');gr.addColorStop(1,'rgba('+r+','+gg+','+b+',0)');g.fillStyle=gr;g.fillRect(0,0,sz,sz);return cn}

    g.strokeStyle='rgba(127,216,255,.06)';g.lineWidth=1.5;for(let r=120;r<900;r+=110){g.beginPath();g.arc(CX,CY,r,0,TAU);g.stroke()}

  const SCALE=[262,294,330,392,440,523,587,659,784,880,1047,1175,1319,1568];

  /* ---------- pooled particles, rings and floating text (no per-frame allocation) ---------- */
  const PN=420,pX=new Float32Array(PN),pY=new Float32Array(PN),pVX=new Float32Array(PN),pVY=new Float32Array(PN),pL=new Float32Array(PN),pM=new Float32Array(PN),pS=new Float32Array(PN),pD=new Float32Array(PN),pG=new Float32Array(PN),pC=new Uint8Array(PN),pK=new Uint8Array(PN);let pI=0;
  function part(px,py,vx,vy,life,size,col,kind,drag,grav){const i=pI;pI=(pI+1)%PN;pX[i]=px;pY[i]=py;pVX[i]=vx;pVY[i]=vy;pL[i]=pM[i]=life;pS[i]=size;pC[i]=col;pK[i]=kind||0;pD[i]=drag==null?2.5:drag;pG[i]=grav||0}
  function burst(px,py,n,col,sp,life,size,kind,grav){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.2+Math.random()*.8);part(px,py,Math.cos(a)*v,Math.sin(a)*v,life*(.55+Math.random()*.6),size*(.6+Math.random()*.7),col,kind,2.4,grav)}}
  function stepParts(dt){for(let i=0;i<PN;i++){if(pL[i]<=0)continue;pL[i]-=dt;const k=Math.exp(-pD[i]*dt);pVX[i]*=k;pVY[i]=pVY[i]*k+pG[i]*dt;pX[i]+=pVX[i]*dt;pY[i]+=pVY[i]*dt}}

      if(pK[i]===1){x.strokeStyle=COLS[pC[i]];x.lineWidth=Math.max(1,s*.55);x.beginPath();x.moveTo(pX[i],pY[i]);x.lineTo(pX[i]-pVX[i]*.035,pY[i]-pVY[i]*.035);x.stroke()}
      else x.drawImage(SPR[pC[i]],pX[i]-s*2,pY[i]-s*2,s*4,s*4)}x.globalAlpha=1;x.globalCompositeOperation='source-over'}
  const RN=28,rX=new Float32Array(RN),rY=new Float32Array(RN),rA=new Float32Array(RN),rB=new Float32Array(RN),rL=new Float32Array(RN),rM=new Float32Array(RN),rW=new Float32Array(RN),rC=new Uint8Array(RN);let rI=0;
  function ring(px,py,r0,r1,life,col,w){const i=rI;rI=(rI+1)%RN;rX[i]=px;rY[i]=py;rA[i]=r0;rB[i]=r1;rL[i]=rM[i]=life;rC[i]=col;rW[i]=w||4}
  function drawRings(dt){x.globalCompositeOperation='lighter';for(let i=0;i<RN;i++){if(rL[i]<=0)continue;rL[i]-=dt;if(rL[i]<=0)continue;const k=1-rL[i]/rM[i],e=1-(1-k)*(1-k)*(1-k);x.globalAlpha=1-k;x.strokeStyle=COLS[rC[i]];x.lineWidth=rW[i]*(1-k)+.5;x.beginPath();x.arc(rX[i],rY[i],rA[i]+(rB[i]-rA[i])*e,0,TAU);x.stroke()}x.globalAlpha=1;x.globalCompositeOperation='source-over'}
  const FN=18,FT=[];for(let i=0;i<FN;i++)FT.push({s:'',x:0,y:0,l:0,m:1,z:20,c:'#fff'});let fI=0;

  function drawFloats(dt){x.textAlign='center';x.textBaseline='middle';for(const f of FT){if(f.l<=0)continue;f.l-=dt;const k=1-f.l/f.m;const sc=k<.12?.4+k/.12*.8:1.2-Math.min(.2,(k-.12)*1.5);x.globalAlpha=f.l<.25?f.l/.25:1;
      x.font=bagel(Math.round(f.z*sc));x.lineWidth=5;x.strokeStyle='rgba(6,8,20,.85)';const yy=f.y-k*34;x.strokeText(f.s,f.x,yy);x.fillStyle=f.c;x.fillText(f.s,f.x,yy)}x.globalAlpha=1}

  /* ---------- game state ---------- */
  let state='intro',score=0,shots=0,pops=0,bestChain=0,mult=1,combo=0,comboT=0,novaCharge=0,nova=false;

  function stat(){const s='Score '+score+(mult>1?' · x'+mult:'')+' · Best '+Math.max(prevBest,score);if(s!==lastStat){lastStat=s;c.stat(s)}}
  function newHits(){const base=Math.min(10,3+Math.floor(shots/16));let h=base-(Math.random()<.4?1:0)-(Math.random()<.12?1:0)+(Math.random()<.1?1:0);return Math.max(2,h)}
  function seed(){cs=[];let tries=0;while(cs.length<6&&tries++<400){const r=22+Math.random()*24,px=r+Math.random()*(W-2*r),py=r+40+Math.random()*(LINE*.5);
      if(cs.some(o=>Math.hypot(o.x-px,o.y-py)<o.r+r+6))continue;const h=2+(Math.random()*2|0);cs.push(mkC(px,py,r,h,false))}}

  function reset(){mv=[];score=0;shots=0;pops=0;bestChain=0;mult=1;combo=0;comboT=0;novaCharge=0;nova=false;cool=.3;recoil=0;freeze=0;shake=0;slow=1;flash=0;dieQ=null;newBest=false;prevBest=c.best()||0;
    seed();for(let i=0;i<PN;i++)pL[i]=0;for(let i=0;i<RN;i++)rL[i]=0;for(const f of FT)f.l=0;lastStat='';stat()}

  c.on(document,'keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A'){keyL=true;ptrIn=false;e.preventDefault()}else if(k==='ArrowRight'||k==='d'||k==='D'){keyR=true;ptrIn=false;e.preventDefault()}
    else if(k===' '||k==='Enter'||k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(!e.repeat||state==='play')primary()}else if(k==='p'||k==='P'||k==='Escape'){if(state==='play')state='paused';else if(state==='paused')state='play'}});
  c.on(document,'keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keyL=false;else if(k==='ArrowRight'||k==='d'||k==='D')keyR=false});
  c.on(window,'blur',()=>{keyL=keyR=false;if(state==='play')state='paused'});
  c.on(document,'visibilitychange',()=>{if(document.hidden&&state==='play')state='paused'});

  let lastDt=0;reset();
  c.loop(ms=>{let dt=ms/1000;lastDt=dt;if(freeze>0){freeze-=dt;dt=0}if(state==='paused')dt=0;
    if(state==='dying')slow=Math.min(1,slow+dt*.5);update(dt);if(dt===0)lastDt=0;draw()});
  return()=>{try{master&&master.disconnect()}catch(e){}};
}});
</script>
