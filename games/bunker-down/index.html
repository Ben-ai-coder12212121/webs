bd><span>Drop the last thing you picked up</span>\n      <kbd>E / ENTER</kbd><span>Seal the hatch early (when standing on it)</span>\n    </div>\n    <p style="font-size:14px;opacity:.8">After that, you\'ll ration food and water, send people out to scavenge and make hard calls, day after day, until help arrives… if it does.</p>\n    <div class="row"><button class="btn ghost dark" id="btnBriefBack" style="flex:.5">BACK</button><button class="btn red" id="btnGo">I\'M READY</button></div>\n  </div>\n</div>\n\n<!-- How to play -->\n<div id="scrHow" class="screen dim hidden">\n  <div class="panel">\n    <div class="hazard"></div>\n    <h2>HOW TO PLAY</h2>\n    <p><b>Part 1: The Minute.</b> You can carry 4 slots at once (find the 🎒 backpack for 6). Big things like the 🪣 water jug and 📦 food crate take 2 slots but hold 3 supplies. Every trip to the hatch costs time. Family members are slower than you, so wake them up early. The dog won\'t sit still.</p>\n    <p><b>Part 2: The Shelter.</b> Everyone has a food and a water meter. Each day you give each person nothing, half or a full portion of 🥫 soup and 💧 water. Let a meter hit empty for too long and they die. Sick or hurt people need 💊 medicine.</p>\n    <p>Send someone out to the houses, the grocery store, the hospital or (with a 🗺️ map) the army checkpoint. A 😷 gas mask, 🪓 axe, 🔦 flashlight and 📕 handbook make the trip safer. They come back exhausted and need rest.</p>\n    <p>Events will test you. Items like the 🔒 padlock, 🧴 bug spray and 🔧 wrench can save the day. Keep up <b>morale</b> or people may walk out.</p>\n    <p>Want to get out alive? <b>The 📻 radio is your best hope of rescue</b>, but listen out for a caravan too. Kindness to the neighbors has a way of coming back.</p>\n    <div class="row"><button class="btn" id="btnHowBack">GOT IT</button></div>\n  </div>\n</div>\n\n<!-- Pause -->\n<div id="scrPause" class="screen dim hidden">\n  <div class="menu">\n    <h1 style="font-size:48px;color:var(--mustard)">PAUSED< function newScavenge() {

  const named = n => cont.filter(c => c.f.c === n);
  named('Fridge')[0].items = ['water', 'water'];
  named('Medicine Cabinet')[0].items = ['meds'];
  const ps = named('Pantry Shelf'); ps[0].items = ['soup', 'soup']; ps[1].items = ['soup', 'water'];
  const base = ['soup', 'soup', 'soup', 'soup', 'soup', 'water', 'water', 'water', 'water', 'water', 'meds', 'jug', 'crate',
    'radio', 'flashlight', 'axe', 'mask', 'map', 'game', 'spray', 'padlock', 'wrench', 'teddy', 'book', 'cards', 'backpack'];

function updateScavenge(dt) {
  G.t += dt;

  G.floaters.forEach(f => f.t += dt); G.floaters = G.floaters.filter(f => f.t < 1.3);
  G.parts.forEach(q => { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9; }); G.parts = G.parts.filter(q => q.t < q.life);

    G.readyT -= dt;

    if (G.readyT <= 0) { G.phase = 'play'; Snd.startSiren(); Snd.tick(true); toast('GRAB SUPPLIES • FIND FAMILY • GET TO THE HATCH', 4); }
    return;
  }

    return;

  // ---- play ----
  G.time -= dt;
  const sec = Math.ceil(G.time);
  if (sec < G.lastTick) { G.lastTick = sec; if (sec <= 10 && sec > 0) Snd.tick(sec <= 3); }
  G.shake = G.time < 6 ? (6 - G.time) * 1.3 : 0;
  if (G.fullWarn > 0) G.fullWarn -= dt;

  // movement
  const iv = inputVec(), speed = 5.6 * T;
  p.vx += (iv.x * speed - p.vx) * Math.min(1, dt * 14);
  p.vy += (iv.y * speed - p.vy) * Math.min(1, dt * 14);
  const sp = Math.hypot(p.vx, p.vy);

  G.dustT = (G.dustT || 0) - dt; if (sp > 150 && G.dustT <= 0) { G.dustT = .12; dust(p.x, p.y + 12); }
  const steps = Math.ceil(sp * dt / 10) || 1;
  for (let i = 0; i < steps; i++) moveBox(p, p.vx * dt / steps, p.vy * dt / steps);

  // room label
  const rm = roomAt(Math.floor(p.x / T), Math.floor(p.y / T));
  if (rm && rm !== G.room) { G.room = rm; G.roomLabel = { text: rm.name, t: 1.6 }; }

  // search containers
  let near = null, nd = 1e9;
  for (const c of G.cont) {
    if (c.opened) continue;
    const f = c.f, rx = f.x * T, ry = f.y * T, cx = clamp(p.x, rx, rx + f.w * T), cy = clamp(p.y, ry, ry + f.h * T);
    const d = Math.hypot(p.x - cx, p.y - cy);

    if (d < .55 * T) {
      if (it.k === 'backpack') { p.cap = 6; Snd.saved(); floater('🎒 BACKPACK! +2 SLOTS', p.x, p.y - 36, '#9ff0a8', 17); burst(it.x, it.y, '#9ff0a8', 14); continue; }

    }

    const hx = (HATCH.x + 1) * T, hy = (HATCH.y + 1) * T;
    p.carry.forEach((k, i) => {
      const gv = ITEMS[k].gives; if (gv) G.shelter[gv[0]] += gv[1]; else G.shelter[k]++;

  if (moveToward(m, (m.tgt.x + .5) * T, (m.tgt.y + .5) * T, 2.2 * T, dt)) { m.tgt = null; if (Math.random() < .3) m.wait = rand(.2, .9); }
}

// ---------- rendering ----------
let menuPan = 0;
function camera() {
  const s = clamp(Math.min(vw, vh) / (T * 10.5), 0.55, 2.6);
  let cx, cy;
  if (G) { cx = G.player.x; cy = G.player.y; }
  else { menuPan += 1 / 60; cx = MW * T / 2 + Math.cos(menuPan * .07) * MW * T * .3; cy = MH * T / 2 + Math.sin(menuPan * .09) * MH * T * .25; }
  const hw = vw / s / 2, hh = vh / s / 2;
  cx = MW * T < hw * 2 ? MW * T / 2 : clamp(cx, hw, MW * T - hw);
  cy = MH * T < hh * 2 ? MH * T / 2 : clamp(cy, hh, MH * T - hh);
  return { s, cx, cy };
}
function worldToScreen(cam, x, y) { return { x: (x - cam.cx) * cam.s + vw / 2, y: (y - cam.cy) * cam.s + vh / 2 }; }

function render(now) {
  resize();
  const t = now / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#14110f'; ctx.fillRect(0, 0, vw, vh);
  const cam = camera();
  const sh = G ? G.shake : 0;
  ctx.save();
  ctx.translate(vw / 2 + rand(-sh, sh), vh / 2 + rand(-sh, sh));
  ctx.scale(cam.s, cam.s);
  ctx.translate(-cam.cx, -cam.cy);
  ctx.drawImage(STATIC, 0, 0);
  drawHatch(ctx, t);
  // containers
  const cont = G ? G.cont : FURN.filter(f => f.c).map(f => ({ f, opened: false, prog: 0 }));
  for (const c of cont) {
    drawFurn(ctx, c.f, c.opened);
    if (!c.opened && G && G.phase === 'play') {
      const f = c.f; ctx.strokeStyle = `rgba(255,236,170,${0.25 + 0.2 * Math.sin(t * 4 + f.x)})`; ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]); rr(ctx, f.x * T + 2, f.y * T + 2, f.w * T - 4, f.h * T - 4, 8); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  if (G) {
    // items
    for (const it of G.items) {
      const b = Math.sin(t * 3 + it.bob) * 3;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(it.x, it.y + 12, 11, 4, 0, 0, 7); ctx.fill();
      const g = ctx.createRadialGradient(it.x, it.y - 4 + b, 2, it.x, it.y - 4 + b, 24);
      g.addColorStop(0, 'rgba(255,245,190,.55)'); g.addColorStop(1, 'rgba(255,245,190,0)'); ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(it.x, it.y - 4 + b, 24, 0, 7); ctx.fill();
      drawEmoji(ctx, ITEMS[it.k].e, it.x, it.y - 4 + b, 26);
    }
    // family
    const cast = G.fam.filter(m => m.state === 'idle' || m.state === 'run').map(m => ({ y: m.y, f: () => drawFam(ctx, m, t) }));
    cast.push({ y: G.player.y, f: () => drawPlayer(ctx, G.player, t) });
    cast.sort((a, b) => a.y - b.y).forEach(d => d.f());
    // search ring
    if (G.searching && G.searching.prog > 0 && G.phase === 'play') {
      const p = G.player; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(p.x, p.y - 2, 26, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(p.x, p.y - 2, 26, -Math.PI / 2, -Math.PI / 2 + G.searching.prog * Math.PI * 2); ctx.stroke();
      drawEmoji(ctx, '🔍', p.x + 22, p.y - 26, 16);
    }
    // flyers
    for (const f of G.flyers) {
      if (f.t < 0) continue;
      const k = f.t, x = f.sx + (f.tx - f.sx) * k, y = f.sy + (f.ty - f.sy) * k - Math.sin(k * Math.PI) * f.arc;
      drawEmoji(ctx, f.e, x, y, f.shrink ? 24 * (1 - k * .6) : 24);
    }
    for (const q of G.parts) { ctx.globalAlpha = 1 - q.t / q.life; circle(ctx, q.x, q.y, 3, q.col); }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of G.floaters) {
      ctx.globalAlpha = 1 - Math.max(0, f.t - .8) / .5;
      ctx.font = `${f.size}px "Black Ops One", Impact, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.strokeText(f.text, f.x, f.y - f.t * 30); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y - f.t * 30);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // lighting overlays
  const urgency = G && G.phase !== 'end' ? clamp(1 - G.time / 60, 0, 1) : 0;
  const a = G ? (0.05 + 0.07 * (0.5 + 0.5 * Math.sin(t * 3.2))) * (0.6 + urgency) : 0;
  if (a > 0) { ctx.fillStyle = `rgba(255,40,20,${a})`; ctx.fillRect(0, 0, vw, vh); }
  const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * .35, vw / 2, vh / 2, Math.max(vw, vh) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, G ? 'rgba(0,0,0,.6)' : 'rgba(0,0,0,.85)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);
  if (!G) { ctx.fillStyle = 'rgba(15,10,8,.55)'; ctx.fillRect(0, 0, vw, vh); return; }
  if (G.time < 10 && G.phase === 'play') { ctx.fillStyle = `rgba(255,200,120,${(10 - G.time) / 10 * 0.18})`; ctx.fillRect(0, 0, vw, vh); }

  if (G.phase !== 'end') drawHUD(ctx, cam, t);
  else drawEnd(ctx, t);
}

function drawHatch(c, t) {
  const X = HATCH.x * T, Y = HATCH.y * T, w = HATCH.w * T, h = HATCH.h * T, cx = X + w / 2, cy = Y + h / 2;
  const carrying = G && G.player.carry.length > 0;
  const glow = 0.4 + 0.3 * Math.sin(t * 4) + (carrying ? 0.3 : 0);
  const g = c.createRadialGradient(cx, cy, 10, cx, cy, w);
  g.addColorStop(0, `rgba(110,255,140,${0.35 * glow})`); g.addColorStop(1, 'rgba(110,255,140,0)');
  c.fillStyle = g; c.fillRect(X - w / 2, Y - h / 2, w * 2, h * 2);
  // hazard frame
  c.save(); rr(c, X + 2, Y + 2, w - 4, h - 4, 8); c.clip();
  c.fillStyle = '#1a1a1a'; c.fillRect(X, Y, w, h);
  c.fillStyle = '#f2c14e'; for (let i = -6; i < 10; i++) { c.beginPath(); c.moveTo(X + i * 16, Y); c.lineTo(X + i * 16 + 8, Y); c.lineTo(X + i * 16 + 8 + h, Y + h); c.lineTo(X + i * 16 + h, Y + h); c.fill(); }
  c.restore();
  const open = G && G.phase === 'end' && G.survived ? clamp(1 - G.endT / 0.6, 0, 1) : 1;
  box(c, X + 10, Y + 10, w - 20, h - 20, '#59626a', '#2c3236', 10);
  if (open > 0.02) { c.fillStyle = `rgba(0,0,0,${0.85 * open})`; rr(c, X + 16, Y + 16, w - 32, h - 32, 6); c.fill(); }
  c.strokeStyle = '#c9d1d6'; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, 15, 0, 7); c.stroke();
  for (let i = 0; i < 4; i++) { const ang = i * Math.PI / 2 + t * (open > .5 ? 0 : 0); c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * 15, cy + Math.sin(ang) * 15); c.stroke(); }
  [[X + 16, Y + 16], [X + w - 16, Y + 16], [X + 16, Y + h - 16], [X + w - 16, Y + h - 16]].forEach(([a, b]) => circle(c, a, b, 3, '#9aa3a8'));
  c.font = '13px "Black Ops One", Impact, sans-serif'; c.textAlign = 'center'; c.fillStyle = `rgba(160,255,175,${0.7 + 0.3 * Math.sin(t * 4)})`;
  c.fillText('SHELTER', cx, Y - 8);
}

function drawPlayer(c, p, t) {
  const moving = Math.hypot(p.vx, p.vy) > 30;
  p.dir = dirOf(p.vx, p.vy, p.dir);
  drawPerson(c, p.x, p.y + 12, LOOKS.you, p.dir, p.walk * .7, moving ? 'walk' : 'stand', t);
  // carried stack
  const n = p.carry.length;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (i - (n - 1) / 2) * 0.55;
    drawEmoji(c, ITEMS[p.carry[i]].e, p.x + Math.cos(ang) * 26, p.y - 36 + Math.sin(ang) * 26 + Math.sin(t * 6 + i) * 1.5, 18);
  }
}

function drawFam(c, m, t) {
  const feet = m.y + 12, dog = m.def.kind === 'dog';
  if (dog) drawDog(c, m.x, feet, m.flip, m.ph || 0, !!m.moving, t, m.state === 'run');
  else drawPerson(c, m.x, feet, LOOKS[m.def.id], m.dir || 'down', m.ph || 0, m.moving ? 'walk' : m.state === 'idle' ? 'panic' : 'stand', t);
  const top = feet - (dog ? 34 : 50 * LOOKS[m.def.id].s);
  if (m.state === 'idle') {
    const pulse = 1 + 0.15 * Math.sin(t * 8);
    c.save(); c.translate(m.x, top - 8); c.scale(pulse, pulse);
    c.fillStyle = '#d64933'; rr(c, -12, -12, 24, 24, 12); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = '18px "Black Ops One", Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('!', 0, 1);
    c.restore();
  }
  if (m.bubbleT > 0) {
    c.font = '13px "Atkinson Hyperlegible", sans-serif'; const tw = c.measureText(m.bubble).width + 16;
    c.fillStyle = '#fff'; rr(c, m.x - tw / 2, top - 30, tw, 22, 8); c.fill();
    c.beginPath(); c.moveTo(m.x - 5, top - 9); c.lineTo(m.x + 5, top - 9); c.lineTo(m.x, top - 2); c.fill();
    c.fillStyle = '#2b2622'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(m.bubble, m.x, top - 19);
  }
}

function drawHUD(c, cam, t) {
  const safeT = 10, narrow = vw < 560;
  // timer
  const tl = Math.max(0, G.time), secs = Math.ceil(tl), urgent = tl <= 10 && G.phase === 'play';
  const pw = narrow ? 130 : 160, ph = narrow ? 58 : 68, px = vw / 2 - pw / 2, py = safeT;
  c.fillStyle = 'rgba(20,16,14,.82)'; rr(c, px, py, pw, ph, 12); c.fill();
  c.lineWidth = 3; c.strokeStyle = urgent ? (Math.sin(t * 12) > 0 ? '#ff4b3a' : '#7a1d14') : '#f2c14e'; c.stroke();
  c.save(); c.translate(vw / 2, py + ph * .44); const pulse = urgent ? 1 + .07 * Math.max(0, Math.sin(t * 2 * Math.PI)) : 1; c.scale(pulse, pulse);
  c.font = `${narrow ? 34 : 42}px "Black Ops One", Impact, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = urgent ? '#ff5a47' : '#f4ecd8'; c.fillText(secs >= 60 ? '1:00' : '0:' + String(secs).padStart(2, '0'), 0, 0); c.restore();
  c.font = '11px "Atkinson Hyperlegible", sans-serif'; c.textAlign = 'center'; c.fillStyle = '#c9bfa8'; c.fillText('UNTIL IMPACT', vw / 2, py + ph - 9);
  // room label
  if (G.roomLabel) {
    c.globalAlpha = Math.min(1, G.roomLabel.t * 2);
    c.font = '16px "Black Ops One", Impact, sans-serif'; c.fillStyle = '#f2c14e'; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.7)';
    c.strokeText(G.roomLabel.text.toUpperCase(), vw / 2, py + ph + 20); c.fillText(G.roomLabel.text.toUpperCase(), vw / 2, py + ph + 20); c.globalAlpha = 1;
  }
  // family column
  c.textAlign = 'left';
  G.fam.forEach((m, i) => {
    const x = 10, y = 10 + i * 46;
    c.fillStyle = 'rgba(20,16,14,.78)'; rr(c, x, y, narrow ? 46 : 118, 40, 10); c.fill();
    c.drawImage(portrait(m.def.id), x + 6, y + 4, 32, 32);
    const st = m.state === 'saved' ? ['✔', '#58c26b'] : m.state === 'run' ? ['➜', '#f2c14e'] : ['?', '#d64933'];
    circle(c, x + 36, y + 31, 8, st[1]); c.fillStyle = '#111'; c.font = '11px "Black Ops One", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(st[0], x + 36, y + 32);
    if (!narrow) { c.textAlign = 'left'; c.fillStyle = '#f4ecd8'; c.font = '13px "Black Ops One", sans-serif'; c.fillText(m.def.name, x + 50, y + 15); c.font = '11px "Atkinson Hyperlegible", sans-serif'; c.fillStyle = '#bdb19a'; c.fillText(m.state === 'saved' ? 'safe' : m.state === 'run' ? 'running' : 'missing', x + 50, y + 29); }
  });
  // minimap
  const mmW = narrow ? 112 : 170, ms = mmW / (MW * 4), mmH = MH * 4 * ms, mx = vw - mmW - 10, my = 58;
  c.fillStyle = 'rgba(20,16,14,.8)'; rr(c, mx - 4, my - 4, mmW + 8, mmH + 8, 8); c.fill();
  c.globalAlpha = .9; c.drawImage(MINI, mx, my, mmW, mmH); c.globalAlpha = 1;
  const tile = 4 * ms, mp = (x, y) => [mx + x / T * tile, my + y / T * tile];
  c.fillStyle = `rgba(110,255,140,${0.6 + 0.4 * Math.sin(t * 5)})`; c.fillRect(mx + HATCH.x * tile, my + HATCH.y * tile, HATCH.w * tile, HATCH.h * tile);
  G.cont.forEach(k => { if (!k.opened) { c.strokeStyle = 'rgba(255,236,170,.8)'; c.lineWidth = 1; c.strokeRect(mx + k.f.x * tile + .5, my + k.f.y * tile + .5, k.f.w * tile - 1, k.f.h * tile - 1); } });
  G.items.forEach(it => { const [a, b] = mp(it.x, it.y); circle(c, a, b, Math.max(1.5, tile * .35), '#ffe27a'); });
  G.fam.forEach(m => { if (m.state === 'idle' || m.state === 'run') { const [a, b] = mp(m.x, m.y); circle(c, a, b, Math.max(2.2, tile * .5), m.state === 'idle' ? '#ff5a47' : '#f2c14e'); } });
  { const [a, b] = mp(G.player.x, G.player.y); circle(c, a, b, Math.max(2.5, tile * .6), '#fff'); circle(c, a, b, Math.max(1.5, tile * .35), '#2f9c95'); }
  // carry slots
  const p = G.player, ss = Math.min(48, (vw - 200) / p.cap), gap = 6, tw = p.cap * (ss + gap) - gap, sx = vw / 2 - tw / 2, sy = vh - ss - 18;
  c.fillStyle = 'rgba(20,16,14,.75)'; rr(c, sx - 8, sy - 22, tw + 16, ss + 30, 10); c.fill();
  c.font = '10px "Atkinson Hyperlegible", sans-serif'; c.fillStyle = '#c9bfa8'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const used = slotsUsed(p), cells = [];
  p.carry.forEach(k => { for (let j = 0; j < SIZE(k); j++) cells.push({ k, first: j === 0, n: SIZE(k) }); });
  c.fillText(`CARRYING ${used}/${p.cap}`, vw / 2, sy - 11);
  for (let i = 0; i < p.cap; i++) {
    const x = sx + i * (ss + gap), cell = cells[i];
    c.fillStyle = cell ? 'rgba(242,193,78,.25)' : 'rgba(255,255,255,.07)'; rr(c, x, sy, ss, ss, 8); c.fill();
    c.strokeStyle = used >= p.cap ? '#d64933' : 'rgba(255,255,255,.25)'; c.lineWidth = 2; c.stroke();
    if (cell && cell.first) { const span = ss * cell.n + gap * (cell.n - 1); if (cell.n > 1) { c.fillStyle = 'rgba(242,193,78,.25)'; c.fillRect(x + ss - 2, sy + ss / 2 - 4, gap + 4, 8); } drawEmoji(c, ITEMS[cell.k].e, x + span / 2, sy + ss / 2, ss * .6); }
  }
  // hatch pointer
  const hs = worldToScreen(cam, (HATCH.x + 1) * T, (HATCH.y + 1) * T), m = 50;
  if (hs.x < m || hs.x > vw - m || hs.y < m + 60 || hs.y > vh - m - 70) {
    const cx = vw / 2, cy = vh / 2, ang = Math.atan2(hs.y - cy, hs.x - cx);
    const ex = clamp(hs.x, m, vw - m), ey = clamp(hs.y, m + 60, vh - m - 70);
    c.save(); c.translate(ex, ey); c.rotate(ang);
    const big = slotsUsed(p) >= p.cap || G.time < 12;
    c.scale(big ? 1.25 + .1 * Math.sin(t * 8) : 1, big ? 1.25 + .1 * Math.sin(t * 8) : 1);
    c.fillStyle = 'rgba(88,194,107,.95)'; c.beginPath(); c.moveTo(18, 0); c.lineTo(-10, -13); c.lineTo(-4, 0); c.lineTo(-10, 13); c.closePath(); c.fill();
    c.strokeStyle = '#0d3a16'; c.lineWidth = 2; c.stroke(); c.restore();
  }
  // toast
  if (G.toast) {
    c.globalAlpha = Math.min(1, G.toast.t * 3);
    c.font = `${narrow ? 13 : 16}px "Black Ops One", Impact, sans-serif`; const w = Math.min(vw - 20, c.measureText(G.toast.text).width + 30);
    const ty = narrow ? 200 : py + ph + 36;
    c.fillStyle = 'rgba(214,73,51,.92)'; rr(c, vw / 2 - w / 2, ty, w, 34, 8); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(G.toast.text, vw / 2, ty + 18, vw - 30); c.globalAlpha = 1;
  }
  // seal button visibility
  const onH = G.phase === 'play' && inHatch(p.x, p.y);
  const sb = $('#btnSeal');
  if (onH === sb.classList.contains('hidden')) sb.classList.toggle('hidden', !onH);
  if (onH && vw >= 700) {
    const outside = G.fam.filter(f => f.state !== 'saved').length;
    c.font = '14px "Black Ops One", Impact, sans-serif'; c.fillStyle = '#b8f5c2'; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.8)';
    const txt = 'Press E to seal the hatch now' + (outside ? ` (${outside} still outside!)` : '');
    c.strokeText(txt, vw / 2, sy - 90); c.fillText(txt, vw / 2, sy - 90);
  }
  // joystick
  if (joy.id !== null) {
    c.globalAlpha = .5; c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(joy.ox, joy.oy, 55, 0, 7); c.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), k = d > 55 ? 55 / d : 1;
    circle(c, joy.ox + dx * k, joy.oy + dy * k, 24, '#fff'); c.globalAlpha = 1;
  }
  // countdown
  if (G.phase === 'ready') {
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0, 0, vw, vh);
    const n = Math.ceil(G.readyT), fr = G.readyT - Math.floor(G.readyT);
    c.save(); c.translate(vw / 2, vh / 2); c.scale(1 + fr * .5, 1 + fr * .5);
    c.font = '120px "Black Ops One", Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#f2c14e'; c.lineWidth = 8; c.strokeStyle = '#000'; c.strokeText(n, 0, 0); c.fillText(n, 0, 0); c.restore();
    c.font = '20px "Black Ops One", Impact, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText('GET READY', vw / 2, vh / 2 + 90);
  }
}

function drawEnd(c, t) {
  if (G.survived) {
    const k = clamp(G.endT / .6, 0, 1);
    c.fillStyle = '#000'; c.fillRect(0, 0, vw, vh * k / 2); c.fillRect(0, vh - vh * k / 2, vw, vh * k / 2);
    if (G.endT > .6) { c.fillStyle = '#000'; c.fillRect(0, 0, vw, vh); }
    if (G.endT > 1.1) {
      const f = clamp((G.endT - 1.1) / .3, 0, 1) * clamp((2.2 - G.endT) / .8 + 1, 0, 1);
      c.fillStyle = `rgba(255,240,210,${0.08 * f})`; c.fillRect(0, 0, vw, vh);
      c.globalAlpha = clamp((G.endT - 1.6) / .6, 0, 1);
      c.font = '22px "Atkinson Hyperlegible", sans-serif'; c.fillStyle = '#e8dcc0'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('The hatch slams shut.', vw / 2, vh / 2 - 18);
      c.globalAlpha = clamp((G.endT - 2.4) / .6, 0, 1);
      c.fillText('Above you, the world turns white.', vw / 2, vh / 2 + 18); c.globalAlpha = 1;
    }
  } else {
    c.fillStyle = `rgba(255,252,240,${G.flash})`; c.fillRect(0, 0, vw, vh);
  }
}

// ---------- main loop ----------
function frame(dtMs, now) {
  const dt = Math.min(0.05, dtMs / 1000);
  if (mode === 'scavenge' && G) {
    updateScavenge(dt);
    if (Snd.siren && Snd.off()) Snd.stopSiren();
    else if (!Snd.siren && !Snd.off() && G.phase === 'play' && !paused) Snd.startSiren();
  }
  if (mode === 'menu' || mode === 'scavenge') render(now);
}

// ---------- screens ----------
function show(id) { ['#scrTitle', '#scrBrief', '#scrHow', '#scrPause', '#scrResult', '#scrEnd'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function hideAll() { show(null); }
function bestLine() {
  const b = c.best();
  $('#bestLine').textContent = b ? `Best: ${b} day${b === 1 ? '' : 's'} survived` : '';
}
function toMenu() {
  c.stat('');
  mode = 'menu'; G = null; S = null; paused = false; Snd.stopSiren();
  $('#survival').classList.add('hidden'); $('#hudbtns').classList.add('hidden'); $('#topbtns').classList.add('hidden');
  show('#scrTitle'); bestLine();
}
function startScavenge() {

  mode = 'survival'; hideAll(); Snd.stopSiren();

    queue: [], flags: {}, stats: { exp: 0, found: 0, events: 0, portions: 0 }
  };
  const n = S.people.length;
  S.log.push({ t: `The hatch is sealed. Through a foot of steel and concrete we heard the world roar, then go quiet. There ${n === 1 ? 'is just me' : `are ${n} of us`} down here.`, c: '' });
  S.log.push({ t: 'Nobody knows how long we will have to wait. Ration carefully: a can or a bottle can be shared, and water runs out faster than food.', c: '' });

function moraleWord() { const m = S.morale; return m >= 75 ? 'Hopeful' : m >= 50 ? 'Steady' : m >= 30 ? 'Uneasy' : m >= 15 ? 'Grim' : 'Breaking'; }
function lootText(obj) { return Object.entries(obj).filter(([, n]) => n > 0).map(([k, n]) => `${n > 1 ? n + '× ' : ''}${E(k)} ${ITEMS[k].name}`).join(', ') || 'nothing'; }
function randomLoot(n, rich = false) {
  const out = {};
  for (let i = 0; i < n; i++) {
    const pool = [['soup', 34], ['water', 34], ['meds', rich ? 10 : 6]];
    ['radio', 'padlock', 'spray', 'game', 'wrench', 'mask', 'flashlight', 'axe', 'map'].forEach(k => { if (!has(k) && !out[k]) pool.push([k, k === 'radio' ? 5 : 3]); });
    const tot = pool.reduce((a, [, w]) => a + w, 0); let r = Math.random() * tot, k = pool[0][0];
    for (const [kk, w] of pool) { r -= w; if (r <= 0) { k = kk; break; } }
    out[k] = (out[k] || 0) + 1;
  }
  Object.entries(out).forEach(([k, n2]) => addItem(k, n2));
  return out;
}
function loseRandom(n) {
  const lost = {};
  for (let i = 0; i < n; i++) {
    const pool = INV_ORDER.filter(k => has(k)).flatMap(k => Array(k === 'soup' || k === 'water' ? 3 : 1).fill(k));
    if (!pool.length) break;
    const k = pick(pool); takeItem(k); lost[k] = (lost[k] || 0) + 1;
  }
  return lootText(lost);
}

function destLoot(dest, n) {
  const table = { houses: null, grocery: [['soup', 50], ['water', 46], ['cards', 4]], hospital: [['meds', 60], ['water', 20], ['soup', 20]],
    army: [['radio', has('radio') ? 0 : 24], ['mask', 10], ['flashlight', 10], ['axe', 8], ['padlock', 8], ['wrench', 8], ['book', 8], ['water', 12], ['soup', 12]] }[dest];
  if (!table) return randomLoot(n, true);
  const out = {};
  for (let i = 0; i < n; i++) {
    const tot = table.reduce((a, [, w]) => a + w, 0); let r = Math.random() * tot, k = table[0][0];
    for (const [kk, w] of table) { r -= w; if (r <= 0) { k = kk; break; } }

}

function rescueEvent(kind) {

  return {

    text: kind === 'radio' ? 'Diesel engines rumble above, right on schedule. Boots crunch on rubble. This is it. You have to signal them NOW.' : 'Out of nowhere: engines, voices, a megaphone crackling. A patrol is passing right over the shelter!',

function pickEvent() {

const QUIET = ['A quiet day. We counted the cans twice.', 'Nothing happened today. That is a good day down here.', 'Someone hummed an old song. Then everyone was humming.',

function beginDay() {

  else if (due >= 0 && home().length) S.event = ARCS[S.queue.splice(due, 1)[0].id]();
  else if (!S.rescueDay && S.day >= 16 && home().length && Math.random() < .08) S.event = rescueEvent('patrol');
  else if (S.day >= 2 && home().length && has('radio') && Math.random() < .35) S.event = EVENTS.find(e => e.id === 'radio').make();

function clampRations() {
  const left = { soup: S.inv.soup, water: S.inv.water };
  for (const p of home()) {
    const r = S.rations[p.id]; if (!r) continue;
    for (const k of ['soup', 'water']) { const want = r[k] || 0, give = Math.min(want, Math.floor(left[k] * 2) / 2); r[k] = give; left[k] -= give; }

function needText(p) {

  if (p.water <= 0 || (p.dry && p.water < dw)) out.push(['d', 'Will die without water today']);

  if (p.food <= 0 && p.starve >= 2) out.push(['d', 'Will starve without food today']);

    Snd.click(); S.event.result = c.run(); S.event.done = true; S.stats.events++;
  } else if (act === 'portion') {
    const r = S.rations[b.dataset.id] || (S.rations[b.dataset.id] = {}), k = b.dataset.k, v = +b.dataset.v, cur = r[k] || 0;
    if (v > cur && S.inv[k] - allocated(k) + cur < v - 1e-9) return; r[k] = v; Snd.click();
  } else if (act === 'treat') {
    const p = byId(b.dataset.id); if (p && p.ill && takeItem('meds')) { p.ill = null; S.note = `${name(p)} took the medicine and ${p.id === 'you' ? 'feel' : 'feels'} much better.`; Snd.good(); }
  } else if (act === 'who') {
    S.exp.who = b.dataset.id; Snd.click();
  } else if (act === 'nobody') {
    S.exp.who = null; S.exp.gear = {}; Snd.click();
  } else if (act === 'gear') {
    S.exp.gear[b.dataset.k] = !S.exp.gear[b.dataset.k]; Snd.click();
    const dd = DESTS.find(d => d.id === S.exp.dest); if (dd.needs && !S.exp.gear[dd.needs]) S.exp.dest = 'houses';
  } else if (act === 'dest') {
    S.exp.dest = b.dataset.k; Snd.click();
  } else if (act === 'play') {
    S.lastGame = S.day; S.morale += 10; S.note = `You'll play the ${E('game')} board game tonight. Everyone perks up.`; Snd.good();
  } else if (act === 'next' || act === 'back') {
    const steps = daySteps(); S.step = steps[clamp(steps.indexOf(S.step) + (act === 'next' ? 1 : -1), 0, steps.length - 1)]; Snd.click(); toTop = true;
  } else if (act === 'end') { Snd.click(); endDay(); return; }
  else if (act === 'climb') { Snd.click(); finishSurvival(true); return; }
  const y = SV.scrollTop; renderDay(); SV.scrollTop = toTop ? 0 : y;
});

function die(p, cause, log) { p.status = 'dead'; p.cause = cause; S.deaths++; S.morale -= p.kind === 'dog' ? 12 : 16; log.push({ t: `💀 ${name(p)} ${cause}.`, c: 'bad' }); }

function endDay() {
  const log = [];
  // 1. rations and needs
  for (const p of home()) {
    const r = S.rations[p.id] || {};
    const ate = takeItem('soup', r.soup || 0), drank = takeItem('water', r.water || 0);
    p.food = clamp(p.food + ate * NEED.food.per - NEED.food.drain[p.kind] * DMUL, 0, 100); S.stats.portions += ate + drank; if (p.tired) p.tired--;
    p.water = clamp(p.water + drank * NEED.water.per - NEED.water.drain[p.kind] * DMUL, 0, 100);
    p.dry = p.water <= 0 ? p.dry + 1 : 0; p.starve = p.food <= 0 ? p.starve + 1 : 0;
    if (p.ill) p.ill.days++;
    else if ((p.water < 25 || p.food < 20) && Math.random() < .18) { makeIll(p, 'sick'); log.push({ t: `${name(p)} ${p.id === 'you' ? 'are' : 'is'} weak and feverish from going without.`, c: 'bad' }); }
    if (p.dry >= 2) die(p, 'died of thirst', log);
    else if (p.starve >= 3) die(p, 'starved to death', log);
    else if (p.ill && p.ill.days >= 5) die(p, p.ill.type === 'injured' ? 'did not survive the injury' : 'lost the fight with the fever', log);
    else if (p.dry === 1) log.push({ t: `${name(p)} can barely speak. Water is needed <b>today</b> or it\'s over.`, c: 'bad' });
    else if (p.starve === 2) log.push({ t: `${name(p)} ${p.id === 'you' ? 'are' : 'is'} skin and bone. Food is needed <b>today</b>.`, c: 'bad' });
  }
  // 2. departures
  const ex = S.exp;
  if (ex.who) {
    const p = byId(ex.who);
    if (p && canGo(p)) {
      p.gear = Object.keys(ex.gear).filter(k => ex.gear[k] && has(k)); p.gear.forEach(k => takeItem(k));
      const dd = DESTS.find(d => d.id === ex.dest) || DESTS[0];
      p.status = 'away'; p.dest = dd.id; p.away = Math.max(1, randi(dd.days[0], dd.days[1]) - (p.gear.includes('map') ? 1 : 0)); p.left = S.day; S.stats.exp++;
      log.push({ t: `${name(p)} climbed out at dusk, heading for the ${dd.name.toLowerCase()}${p.gear.length ? ' with ' + p.gear.map(E).join(' ') : ' with nothing but courage'}. The hatch clanged shut behind ${p.id === 'you' ? 'you' : 'them'}.`, c: '' });
    }
  }
  // 3. returns
  for (const p of S.people) {
    if (p.status !== 'away' || p.left === S.day) continue;
    p.away--;
    if (p.away > 0) continue;
    const g = k => p.gear.includes(k);
    const dd = DESTS.find(d => d.id === p.dest) || DESTS[0];
    let risk = .3 + dd.risk - (g('mask') ? .12 : 0) - (g('axe') ? .1 : 0) - (g('flashlight') ? .04 : 0) - (g('book') ? .06 : 0);
    risk = Math.max(.05, risk);
    const roll = Math.random();
    if (roll < risk * .3) {
      p.status = 'lost'; p.cause = 'Never came back from outside'; S.morale -= 14;
      log.push({ t: `Day after day we waited. ${name(p)} never came back.`, c: 'bad' });
      continue;
    }
    p.status = 'home'; p.tired = 2; p.food = clamp(p.food - 10, 0, 100); p.water = clamp(p.water - 12, 0, 100);
    if (g('axe') && Math.random() < .1) { p.gear = p.gear.filter(k => k !== 'axe'); log.push({ t: `The ${E('axe')} axe was lost outside.`, c: 'bad' }); }
    p.gear.forEach(k => addItem(k)); p.gear = [];
    if (roll < risk) {
      const type = !g('mask') && Math.random() < .6 ? 'sick' : 'injured'; makeIll(p, type);
      const loot = destLoot(dd.id, randi(0, 2)); S.stats.found += Object.values(loot).reduce((a, b) => a + b, 0);
      log.push({ t: `${name(p)} stumbled back in, ${type === 'sick' ? 'pale and vomiting from the fallout' : 'bleeding from a deep gash'}. Brought back: ${lootText(loot)}.`, c: 'bad' });
    } else {
      const loot = destLoot(dd.id, randi(2, 3) + (g('flashlight') ? 1 : 0) + (dd.id === 'grocery' ? 1 : 0)); S.stats.found += Object.values(loot).reduce((a, b) => a + b, 0);
      S.morale += 6;
      log.push({ t: `${name(p)} ${p.id === 'you' ? 'are' : 'is'} back, filthy but in one piece! Brought back: ${lootText(loot)}.`, c: 'good' });
      if (!g('mask') && Math.random() < .3) { makeIll(p, 'sick'); log.push({ t: `But ${name(p)} breathed in a lot of dust out there and ${p.id === 'you' ? 'feel' : 'feels'} sick.`, c: 'bad' }); }
    }
  }
  // 4. morale
  S.morale -= 3;
  if (S.people.find(p => p.kind === 'dog' && p.status === 'home')) S.morale += 2;
  if (S.morale < 20) {
    const cand = home().filter(p => p.kind === 'adult' || p.kind === 'teen').filter(p => p.id !== 'you');
    if (cand.length && Math.random() < .25) {
      const p = pick(cand); p.status = 'lost'; p.cause = 'Walked out in despair';
      log.push({ t: `When we woke up, the hatch was unlatched. ${p.name} had left in the night. No note.`, c: 'bad' });
    }
  }
  S.morale = clamp(S.morale, 0, 100);
  // 5. advance
  S.day++;
  S.log = log;
  if (!living().length) { nightThen(() => finishSurvival(false)); return; }
  if (!home().length) S.log.push({ t: 'The shelter is empty and silent. We can only wait for whoever is still out there.', c: 'bad' });
  beginDay();
  nightThen(() => { renderDay(); SV.scrollTop = 0; });
}

function nightThen(fn) {
  const n = $('#night'); n.textContent = `Night ${S.day - 1}…`; n.classList.add('show');
  c.after(() => { fn(); c.after(() => n.classList.remove('show'), 150); }, 900);
}

function finishSurvival(rescued) {
  mode = 'over';
  const days = rescued ? S.day : S.day - 1, out = S.people.filter(p => p.status === 'home');
  recordRun(days, rescued);
  const fates = S.people.map(p => {
    const f = p.status === 'home' ? (rescued ? 'Rescued' : '') : p.status === 'away' ? 'Still out there' : p.cause;
    return `<span class="chip ${p.status === 'home' && rescued ? '' : 'lost'}">${face(p.id)} ${p.name} · ${f}</span>`;
  }).join('');
  const score = days * 10 + (rescued ? out.length * 100 + 250 : 0), st = S.stats;
  const summary = `<p style="font-size:15px">Days: <b>${days}</b> · Expeditions: <b>${st.exp}</b> · Supplies found: <b>${st.found}</b> · Events faced: <b>${st.events}</b> · Portions shared: <b>${amt(st.portions)}</b></p>`;
  const caravan = S.rescued === 'caravan';
  const b = { days: c.best() || days };
  $('#endBody').innerHTML = rescued
    ? `<div class="hazard"></div><h2>${caravan ? 'ON THE ROAD' : 'RESCUED!'}</h2><p>${caravan ? `On day ${days}, ${out.length === 1 ? 'you climbed' : 'you all climbed'} onto a rattling truck and the caravan rolled out toward the safe zone in the hills.` : `On day ${days}, the hatch groaned open and gray daylight poured in. ${out.length === 1 ? 'One survivor' : out.length + ' survivors'} climbed out into a changed world.`}</p>
       <div class="chips">${fates.replace(/Rescued/g, caravan ? 'Left with the caravan' : 'Rescued')}</div>${summary}<p><b>Score: ${score}</b> · Best run: ${b.days} days</p>
       <div class="row"><button class="btn ghost dark" data-go="menu" style="flex:.6">MENU</button><button class="btn red" data-go="retry">PLAY AGAIN</button></div>`
    : `<div class="hazard"></div><h2>THE SHELTER FALLS SILENT</h2><p>You held on for ${days} day${days === 1 ? '' : 's'}. Nobody came in time.</p>
       <div class="chips">${fates}</div>${summary}<p><b>Score: ${score}</b> · Best run: ${b.days} days</p>
       <p style="font-size:14px;opacity:.8">Tip: water matters more than food, a gas mask makes scavenging much safer, and the radio is the fastest way out.</p>
       <div class="row"><button class="btn ghost dark" data-go="menu" style="flex:.6">MENU</button><button class="btn red" data-go="retry">PLAY AGAIN</button></div>`;
  SV.classList.add('hidden');
  show('#scrEnd');
}

// ---------- boot ----------
buildStatic();
bestLine();
c.loop(frame);
return () => { Snd.stopSiren(); try { Snd.master && Snd.master.disconnect(); } catch (e) {} };

}});
</script>
<script src="/js/app.js"></script>
</body></html>
