/* ===================== Lumberjack Tycoon: game code ===================== */
const LT_CSS = `
/* Lumberjack Tycoon: full-bleed third-person 3D world; HUD on dark wooden plates with chunky gold numbers. */
:host{--ink:#1d1a14;--paper:#fff7e6;--dim:#cbbfa6;--plate:rgba(30,25,18,.8);--plate2:#3a3022;--line:#0e0c09;--gold:#ffd25a;--leaf:#9be070;--red:#ef6a4c;--sky:#8fd3ff;
--f-d:"Bagel Fat One","Arial Black",Impact,system-ui,sans-serif;--f-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
#game{position:absolute;inset:0;overflow:hidden;background:#9cc8e4;color:var(--paper);font-family:var(--f-b);font-size:15px;line-height:1.25;text-align:left;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;container-type:size}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;margin:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.plate{background:var(--plate);border:2px solid var(--line);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
#hud{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,8,4,.38) 100%)}
#award{position:absolute;left:50%;top:12px;transform:translate(-50%,-140%);transition:transform .35s;padding:8px 16px;background:#2a2117;border:2px solid var(--gold);border-radius:6px;text-align:center;font-family:var(--f-d);font-size:20px;color:var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.4);z-index:6;white-space:nowrap}
#award b{display:block;font-family:var(--f-b);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
#award small{display:block;font-family:var(--f-b);font-weight:600;font-size:12px;color:var(--paper)}
#award.on{transform:translate(-50%,0)}
#order{position:absolute;left:12px;top:132px;max-width:min(300px,calc(100% - 150px));padding:6px 10px;font-size:12px;line-height:1.3}
#order b{color:var(--gold)}
#order .bar{display:block;height:5px;margin-top:3px;background:rgba(0,0,0,.6);border:1px solid #000}
#order .bar i{display:block;height:100%;background:var(--leaf)}
.g-touch #order{display:none}
#netTags{position:absolute;inset:0;overflow:hidden}
.ntag{position:absolute;left:0;top:0;padding:2px 7px;background:rgba(20,16,10,.75);border:1px solid #000;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap;color:#fff}
#netBadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:4px 10px;font-size:12px;font-weight:700}
#moneyBox{position:absolute;left:12px;top:12px;padding:6px 14px 7px 9px;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:8px}
#moneyBox svg{width:28px;height:28px;grid-row:span 2}
#money{font-family:var(--f-d);font-size:26px;line-height:1;color:var(--gold);text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
#axeName{font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
#goal{position:absolute;left:12px;top:64px;max-width:min(300px,calc(100% - 150px));padding:6px 10px;font-size:13px;line-height:1.3}
#goal b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.g-touch #goal{display:none}
#clockBox{position:absolute;right:12px;top:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;pointer-events:auto}
#clockBox svg{width:22px;height:22px}
#clock{font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{height:30px;min-width:30px;padding:0 7px;display:grid;place-items:center;background:var(--plate2);border:2px solid var(--line);border-radius:5px;color:var(--paper);font-size:12px;font-weight:600}
.mini svg{width:18px;height:18px}
.mini:hover{background:#4a3d2b}
#region{position:absolute;left:50%;top:16%;transform:translateX(-50%);text-align:center;font-family:var(--f-d);font-size:clamp(24px,5cqw,44px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.35);opacity:0;transition:opacity .5s;white-space:nowrap}
#region small{display:block;font-family:var(--f-b);font-weight:600;font-size:clamp(12px,1.8cqw,16px);letter-spacing:.06em;text-transform:uppercase;opacity:.9}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross i:nth-child(1){left:10px;top:2px;width:2px;height:6px}#cross i:nth-child(2){left:10px;bottom:2px;width:2px;height:6px}
#cross i:nth-child(3){top:10px;left:2px;height:2px;width:6px}#cross i:nth-child(4){top:10px;right:2px;height:2px;width:6px}
#cross.hot i{background:var(--gold)}
#cross.grab i{background:var(--leaf)}
#aim{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);padding:5px 10px;font-size:13px;text-align:center;white-space:nowrap}
#aim b{color:var(--gold);font-weight:700}
#aim .bar{display:block;height:5px;margin-top:4px;background:rgba(0,0,0,.6);border:1px solid #000}
#aim .bar i{display:block;height:100%;width:0;background:var(--leaf)}
#prompt{position:absolute;left:50%;top:calc(50% + 60px);transform:translateX(-50%);padding:7px 14px;font-weight:600;font-size:15px;text-align:center;max-width:calc(100% - 32px);pointer-events:auto;cursor:pointer}
#prompt kbd,#hint kbd,.keys kbd{display:inline-block;min-width:20px;padding:1px 5px;margin:0 2px;border:2px solid var(--gold);border-radius:4px;color:var(--gold);font-family:var(--f-b);font-weight:700;font-size:12px;line-height:16px;text-align:center}
#hint{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 14px;background:rgba(18,15,10,.82);border:2px dashed var(--gold);border-radius:6px;font-size:14px;text-align:center;max-width:min(560px,calc(100% - 32px));text-wrap:balance;transition:opacity .3s}
#toast{position:absolute;left:50%;top:calc(50% - 96px);transform:translateX(-50%);padding:8px 16px;font-weight:600;font-size:15px;text-align:center;max-width:calc(100% - 32px);transition:opacity .3s;opacity:0}
#toast.bad{border-color:#5a1a10;background:rgba(80,24,14,.9)}
#floats{position:absolute;inset:0;overflow:hidden}
.fl{position:absolute;left:0;top:0;font-family:var(--f-d);font-size:22px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.5);white-space:nowrap;will-change:transform,opacity}
.fl small{display:block;font-family:var(--f-b);font-weight:700;font-size:12px;color:#fff;text-align:center}
#bar{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;pointer-events:none}
.slot{pointer-events:auto;width:64px;height:58px;position:relative;display:grid;place-items:center;background:var(--plate);border:2px solid var(--line);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.slot svg{width:34px;height:34px}
.slot .k{position:absolute;left:4px;top:2px;font-size:11px;font-weight:700;color:var(--dim)}
.slot .n{position:absolute;left:0;right:0;bottom:2px;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--dim);text-align:center;text-transform:uppercase}
.slot.on{border-color:var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 2px var(--gold)}
.slot.on .k,.slot.on .n{color:var(--gold)}
#swing{position:absolute;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:120px;height:4px;margin-left:-60px;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
#swing i{display:block;height:100%;width:0;background:var(--gold)}
#resume{position:absolute;left:50%;top:50%;transform:translate(-50%,36px);padding:7px 12px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
#topBtns{position:absolute;right:12px;top:56px;display:flex;gap:5px;pointer-events:auto}
#drive{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:13px;display:grid;gap:3px}
#drive b{font-family:var(--f-d);font-size:22px;font-weight:400;color:var(--gold);line-height:1}
#cargoTxt{color:var(--dim)}
#driveKeys{display:block;margin:2px 0 0;font-size:11px;color:var(--dim)}
.g-touch #driveKeys{display:none}
.driving #bar{display:none}
@container (max-height:430px){#hint{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px))}}

/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,247,230,.35);background:rgba(20,16,10,.25);transform:translate(-50%,-50%);display:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,210,90,.6);border:2px solid #000}
.tb{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;background:rgba(30,25,18,.78);border:2px solid #0e0c09;color:var(--paper);font-weight:800;font-size:13px;letter-spacing:.04em;touch-action:none;display:grid;place-items:center;text-transform:uppercase}
.tb.big{width:88px;height:88px;border-color:var(--gold);color:var(--gold);font-size:15px}
.tb.on{background:rgba(255,210,90,.35)}
#tChop{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#tGrab{right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#tUse{right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(192px + env(safe-area-inset-bottom,0px))}
#tJump{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(166px + env(safe-area-inset-bottom,0px));width:58px;height:58px;font-size:11px}
#tTip{right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.g-short .tb{width:54px;height:54px;font-size:11px}.g-short .tb.big{width:68px;height:68px;font-size:13px}.g-short #tChop{bottom:calc(14px + env(safe-area-inset-bottom,0px))}.g-short #tGrab,.g-short #tTip{right:calc(94px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}.g-short #tUse{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px))}.g-short #tJump{right:calc(94px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:46px;height:46px;font-size:10px}
.g-touch #bar{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px));justify-content:flex-start;left:12px}
.g-touch .slot{width:52px;height:48px}.g-touch .slot svg{width:26px;height:26px}
.g-touch #hint{bottom:auto;top:calc(116px + env(safe-area-inset-top,0px))}
.g-touch #region{top:34%;font-size:26px}
.g-touch #drive{bottom:auto;top:calc(116px + env(safe-area-inset-top,0px))}
.g-touch #topBtns{top:52px}

/* panels */
.panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:#241d14;border-left:3px solid #0e0c09;box-shadow:-10px 0 30px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:20;pointer-events:auto}
.panel header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid #0e0c09;background:#3a2e1f}
.panel header h2{flex:1;margin:0;font-family:var(--f-d);font-weight:400;font-size:22px;line-height:1.1;color:var(--gold)}
.panel header .sub{display:block;font-family:var(--f-b);font-size:12px;color:var(--dim);font-weight:600}
.panel .list{flex:1;overflow:auto;padding:10px 12px 16px;display:grid;gap:8px;align-content:start;-webkit-overflow-scrolling:touch}
.close{height:34px;padding:0 12px;border:2px solid #0e0c09;border-radius:5px;background:#5a4630;font-weight:700}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:#2f261a;border:2px solid #0e0c09;border-radius:6px}
.item .ic{width:52px;height:52px;background:#1a150e;border-radius:5px;display:grid;place-items:center}
.item .ic svg{width:42px;height:42px}
.item h3{margin:0 0 2px;font-size:15px;font-weight:800;color:var(--paper)}
.item p{margin:0;font-size:12px;color:var(--dim);line-height:1.3}
.item .stats{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;margin-top:4px;font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;align-items:center}
.item .stats i{display:block;height:5px;background:#120e08;border:1px solid #000}
.item .stats i b{display:block;height:100%;background:var(--leaf)}
.buy{min-width:84px;height:40px;padding:0 10px;border:2px solid #0e0c09;border-radius:5px;background:var(--gold);color:#241a06;font-weight:800;font-size:14px;box-shadow:0 2px 0 #000}
.buy:active{transform:translateY(1px);box-shadow:none}
.buy.no{background:#5b4c38;color:#d8c9ad}
.buy.own{background:#3f5a2a;color:#d9f5c0}
.sec{font-family:var(--f-d);font-size:15px;color:var(--leaf);margin:6px 0 0;font-weight:400}

#intro,#menu{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,11,7,.55);z-index:30;pointer-events:auto;padding:16px}
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:#2a2117;border:3px solid #0e0c09;border-radius:8px;box-shadow:0 6px 0 rgba(0,0,0,.5);padding:18px 20px 18px}
.card h1{margin:0;font-family:var(--f-d);font-weight:400;font-size:clamp(28px,6cqw,40px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #000}
.card .tag{margin:6px 0 12px;color:var(--dim);font-size:14px}
.steps{display:grid;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;font-size:14px}
.steps svg{width:36px;height:36px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:12px;color:var(--dim);margin:0 0 14px}
.go{width:100%;height:50px;border:2px solid #0e0c09;border-radius:6px;background:var(--gold);color:#241a06;font-family:var(--f-d);font-size:22px;box-shadow:0 3px 0 #000}
.go2{width:100%;height:42px;margin-top:8px;border:2px solid #0e0c09;border-radius:6px;background:#4a3b28;font-weight:700}
#map{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,5,.7);z-index:25;pointer-events:auto}
#map .wrap{position:relative;width:min(92cqw,86cqh);aspect-ratio:1;border:3px solid #0e0c09;border-radius:8px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.5)}
#mapCv{width:100%;height:100%;display:block}
#map .mclose{position:absolute;right:8px;top:8px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#1a150e;z-index:35;padding:16px}
.ldbar{height:12px;border:2px solid #0e0c09;background:#120e08;border-radius:3px;margin-top:10px}
.ldbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:16px;background:#1a150e;z-index:40}
@container (max-width:760px){#goal{display:none}}
@container (max-height:430px){#region{display:none}#hint{font-size:12px}}
@container (max-width:560px){#money{font-size:21px}#moneyBox svg{width:22px;height:22px}#clock{font-size:12px}.slot{width:54px;height:50px}.slot svg{width:28px;height:28px}#hint{font-size:13px}}

#moneyBox{grid-template-columns:auto auto auto}
#axeName{grid-column:2/4}
#gems{display:flex;align-items:center;gap:3px;font-weight:800;font-size:15px;color:#7ff5df;text-shadow:0 1px 0 #000;margin-left:6px}
#gems svg{width:17px;height:17px;grid-row:auto}
#gems.pop{animation:gpop .5s}
@keyframes gpop{40%{transform:scale(1.35)}}
#netList{position:absolute;right:12px;top:96px;padding:6px 10px;font-size:12px;display:grid;gap:2px;max-width:200px;pointer-events:none}
#netList b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#netList span{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#netList i{width:9px;height:9px;border:1px solid #000;flex:none}
.slot.pk{width:auto;min-width:64px;padding:0 8px;pointer-events:auto}
.slot.pk .n{color:var(--gold)}
#tTip.carry{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(236px + env(safe-area-inset-bottom,0px));width:58px;height:58px;font-size:11px}
.g-short #tTip.carry{right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:46px;height:46px;font-size:10px}
#introNet{color:var(--gold);font-weight:700;min-height:1.3em}
.hasDebt #goal{top:78px}.hasDebt #order{top:146px}.g-touch.hasDebt #bar{top:calc(76px + env(safe-area-inset-top,0px))}
#debtTxt{grid-column:2/4;font-size:11px;font-weight:800;color:#ff9a7a;white-space:nowrap}
.riding #cross{display:none}
.gorow{display:flex;gap:8px}.gorow .go{flex:2}.gorow .go2{flex:1;margin-top:0;height:50px}

const LT_HTML = `<div id="game">
<canvas id="gl" tabindex="-1" aria-label="A 3D forest. Walk up to a tree and chop it with your axe."></canvas>
