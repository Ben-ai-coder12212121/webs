<div class="wrap"><div class="top"><a class="pill" href="/">← All games</a></div><main class="card"><div class="body"><h1>Juice Slicer</h1><p>Fruit flies up, you swipe through it. Slice several in one swipe for combos, but never touch a bomb, and don't let three fruits fall.</p></div></main></div>

<script>
/* ===================== Juice Slicer: game code ===================== */
G.push({id:'m_slicer',levels:true,name:'Juice Slicer',kind:'arcade',tint:'#ffe0e6',blurb:'Fruit flies up, you swipe through it. Slice several in one swipe for combos, but never touch a bomb, and don\'t let three fruits fall.',fmt:b=>b+' pts',
art:'<circle cx="40" cy="40" r="18" fill="#FF6B6B" stroke="#1D1A2F" stroke-width="3"/><circle cx="84" cy="34" r="14" fill="#FFD23F" stroke="#1D1A2F" stroke-width="3"/><path d="M14 64L110 12" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M14 64L110 12" stroke="#7fd8ff" stroke-width="2"/>',
run(root,c){const W=400,H=640;const {cv,x}=MOB.canvas(root,W,H);const FX=MOB.parts(),FL=MOB.floats();
  const KINDS=[{n:'apple',c:'#e8363a',in:'#fff4d0',r:24},{n:'orange',c:'#ff9a1f',in:'#ffd27a',r:24},{n:'lemon',c:'#ffe23a',in:'#fff8b0',r:21},{n:'melon',c:'#2e9e44',in:'#ff5a6a',r:34},{n:'kiwi',c:'#8a6a3a',in:'#8ad04a',r:20},{n:'plum',c:'#7a2a9a',in:'#e8c070',r:20},{n:'coconut',c:'#6a4a2a',in:'#fffaf0',r:27}];
  let items,halves,trail,score,miss,state,wave,combo,comboT,t;
  function reset(){items=[];halves=[];trail=[];score=0;miss=0;state='ready';wave=900;combo=0;comboT=0;overT=0;upd()}
  const upd=()=>c.stat('Score '+score+' · Misses '+miss+'/3 · Best '+(c.best()||0));
  function toss(){const n=1+Math.floor(Math.random()*c.pick(2,3,4)+Math.min(3,score/60));for(let i=0;i<n;i++){const bomb=Math.random()<c.pick(.08,.13,.18)+Math.min(.1,score/800);const k=MOB.pick(KINDS);
      const px=MOB.rnd(60,W-60);items.push({x:px,y:H+40,vx:(W/2-px)*MOB.rnd(.002,.006)+MOB.rnd(-.8,.8),vy:-MOB.rnd(13.5,16.5)*c.pick(.95,1,1.05),r:bomb?22:k.r,k,bomb,rot:0,vr:MOB.rnd(-.1,.1),delay:i*MOB.rnd(80,220)})}}
  function slice(a,b){let cut=0;for(const it of items){if(it.delay>0||it.dead)continue;const d=segD(a,b,it);if(d>it.r)continue;it.dead=1;
      if(it.bomb){boom(it);return}cut++;const ang=Math.atan2(b.y-a.y,b.x-a.x);for(const s of[-1,1])halves.push({x:it.x,y:it.y,vx:it.vx+Math.cos(ang+s*1.57)*2,vy:it.vy+Math.sin(ang+s*1.57)*2-1,r:it.r,k:it.k,ang,side:s,rot:0,vr:s*.08});
      FX.burst(it.x,it.y,14,it.k.in,4,600,.25);splat.push({x:it.x,y:it.y,c:it.k.in,r:it.r*1.6,t:0});score+=1;beep(500+Math.random()*300,.06,'triangle',.05)}
    if(cut){combo+=cut;comboT=260}upd()}
  const splat=[];
  function segD(a,b,p){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let u=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;u=Math.max(0,Math.min(1,u));return Math.hypot(a.x+dx*u-p.x,a.y+dy*u-p.y)}
  function boom(it){FX.burst(it.x,it.y,60,['#fff','#ffd23f','#ff6a3a','#333'],8,900);beep(80,.6,'sawtooth',.2);state='over';overT=t;flash=1;c.stat('Boom! Score '+score+' · Best '+c.best(score))}
  let flash=0,last=null,pressed=false;
  MOB.drag(c,cv,W,H,{down:p=>{if(state!=='play'){if(state==='over'&&t-overT<500)return;reset();state='play';return}pressed=true;last=p;trail.push({x:p.x,y:p.y,t:0})},move:p=>{if(state!=='play'||!pressed)return;trail.push({x:p.x,y:p.y,t:0});if(last&&Math.hypot(p.x-last.x,p.y-last.y)>2)slice(last,p);last=p},up:()=>{pressed=false;last=null}});
  let overT=0;
  function update(dt){t+=dt;FX.step(dt);FL.step(dt);for(const s of splat)s.t+=dt;while(splat.length&&splat[0].t>2500)splat.shift();for(const p of trail)p.t+=dt;while(trail.length&&trail[0].t>140)trail.shift();flash=Math.max(0,flash-dt/600);
    if(state!=='play')return;wave-=dt;if(wave<=0&&items.filter(i=>!i.dead).length<3){toss();wave=c.pick(1500,1200,950)*Math.max(.6,1-score/400)}
    const k=dt/16;for(const it of items){if(it.delay>0){it.delay-=dt;continue}it.x+=it.vx*k;it.y+=it.vy*k;it.vy+=.3*k;it.rot+=it.vr*k;if(it.x<it.r||it.x>W-it.r)it.vx*=-1}
    for(const it of items)if(!it.dead&&it.vy>0&&it.y>H+50){it.dead=1;if(!it.bomb){miss++;beep(160,.2,'square',.06);upd();if(miss>=3){state='over';overT=t;c.stat('Out of lives! Score '+score+' · Best '+c.best(score))}}}
    items=items.filter(i=>!i.dead||false);for(const h of halves){h.x+=h.vx*k;h.y+=h.vy*k;h.vy+=.3*k;h.rot+=h.vr*k}halves=halves.filter(h=>h.y<H+80);
    if(comboT>0){comboT-=dt;if(comboT<=0){if(combo>=3){score+=combo;FL.add('Combo x'+combo+'  +'+combo,W/2,H*.35,'#ffd23f');beep(1200,.15,'sine',.08);upd()}combo=0}}
}
  function fruit(it){x.save();x.translate(it.x,it.y);x.rotate(it.rot);if(it.bomb){x.fillStyle='#222';x.beginPath();x.arc(0,0,it.r,0,7);x.fill();x.strokeStyle='#000';x.lineWidth=3;x.stroke();x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(-7,-7,6,0,7);x.fill();x.strokeStyle='#8a6a3a';x.lineWidth=4;x.beginPath();x.moveTo(0,-it.r);x.quadraticCurveTo(8,-it.r-10,14,-it.r-8);x.stroke();x.fillStyle=Math.sin(t/40)>0?'#ffd23f':'#ff4a1a';x.beginPath();x.arc(14,-it.r-8,5,0,7);x.fill()}
    else{const k=it.k;x.fillStyle=k.c;x.beginPath();x.arc(0,0,it.r,0,7);x.fill();x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.35)';x.stroke();if(k.n==='melon'){x.strokeStyle='#1a6a2a';x.lineWidth=3;for(let i=-2;i<=2;i++){x.beginPath();x.ellipse(i*9,0,3,it.r*.95,0,0,7);x.stroke()}}
      x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(-it.r*.35,-it.r*.4,it.r*.3,it.r*.18,-.6,0,7);x.fill();if(k.n==='apple'||k.n==='orange'){x.fillStyle='#3a8a2a';x.beginPath();x.ellipse(4,-it.r-2,6,3,.5,0,7);x.fill()}}x.restore()}
  function half(h){x.save();x.translate(h.x,h.y);x.rotate(h.ang+h.rot);x.beginPath();x.arc(0,0,h.r,h.side>0?0:Math.PI,h.side>0?Math.PI:Math.PI*2);x.closePath();x.fillStyle=h.k.c;x.fill();x.beginPath();x.arc(0,0,h.r*.82,h.side>0?0:Math.PI,h.side>0?Math.PI:Math.PI*2);x.closePath();x.fillStyle=h.k.in;x.fill();x.restore()}
  function draw(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5a3a24');g.addColorStop(1,'#3a2414');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=2;for(let i=1;i<6;i++){x.beginPath();x.moveTo(i*W/6,0);x.lineTo(i*W/6,H);x.stroke()}
    for(const s of splat){x.globalAlpha=.5*(1-s.t/2500);x.fillStyle=s.c;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.globalAlpha=1;
    for(const h of halves)half(h);for(const it of items)if(it.delay<=0)fruit(it);FX.draw(x);
    if(trail.length>1){x.lineCap='round';for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];x.strokeStyle='rgba(200,240,255,'+(1-b.t/140)+')';x.lineWidth=2+i/trail.length*7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    FL.draw(x);MOB.big(x,String(score),W/2,44,40,'#FFD23F','#1D1A2F');for(let i=0;i<3;i++)MOB.txt(x,'✕',W-80+i*26,40,22,i<miss?'#ff4a4a':'rgba(255,255,255,.25)');
    if(flash>0){x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H)}
    if(state==='ready')banner(x,W,H,'Juice Slicer','Swipe through fruit. Avoid bombs!');if(state==='over')banner(x,W,H,score+' pts','Tap to play again')}
  reset();c.loop(dt=>{update(dt);draw()})}});
</script>
