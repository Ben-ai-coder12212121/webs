/* ===================== Green Thumb Grow Co.: game code ===================== */
/* Green Thumb Grow Co.: a licensed farm tycoon. Grow plants in a 3D garage tent, cross strains, cure, package and sell
   to dispensaries, then expand to a grow room, a warehouse and a greenhouse campus. Everything lives in one shadow tree. */
function GreenThumbGame(host, env) {
'use strict';
env = env || {};
const THREE = env.THREE || window.THREE;
const CSS = `
:host{--bg:#101813;--plate:rgba(16,26,20,.9);--plate2:#1e2e24;--plate3:#283d30;--line:#060a07;--cream:#f4f1e4;--dim:#a8b8a6;--mute:#6f826f;
--lime:#a6e36e;--lime2:#6fbf45;--gold:#ffcf5a;--red:#ef6a4c;--blue:#6cc4ff;--orange:#ff9a3c;--pink:#ff8fb1;
--f-d:"Bagel Fat One","Arial Black",Impact,system-ui,sans-serif;--f-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
#game{position:absolute;inset:0;overflow:hidden;background:#141c17;color:var(--cream);font-family:var(--f-b);font-size:13px;line-height:1.3;text-align:left;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;container-type:size}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.hov{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;margin:0;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.plate{background:var(--plate);border:2px solid var(--line);border-radius:7px;box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 11px;background:var(--plate3);border:2px solid var(--line);border-radius:6px;box-shadow:0 3px 0 var(--line);font-weight:700;font-size:13px;color:var(--cream);white-space:nowrap;transition:transform .06s,background .12s}
.b:hover{background:#34503e}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.b.go{background:var(--lime2);color:#0d1a0f}
.b.go:hover{background:#82d156}
.b.gold{background:var(--gold);color:#2a1d05}
.b.gold:hover{background:#ffdb7d}
.b.red{background:#a8432f}
.b.blue{background:#2f6f9a}
.b.blue:hover{background:#3a82b3}
.b.sm{min-height:26px;padding:3px 8px;font-size:12px;box-shadow:0 2px 0 var(--line)}
.b[disabled],.b.off{opacity:.42;pointer-events:none}
.b.wide{width:100%}
.b svg.i{width:16px;height:16px}
/* top HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
#top>*{pointer-events:auto}
#cash{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 6px}
#cash .logo{width:30px;height:30px}
#money{font-family:var(--f-d);font-size:21px;line-height:1;color:var(--gold);text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
#cash small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
#repBox{display:flex;align-items:center;gap:6px;padding:3px 10px}
#repBox b{font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--lime)}
#repBox small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#clockBox{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 9px}
#clockTxt{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:86px}
#clockTxt small{display:block;font-weight:600;font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.spd{width:30px;height:28px;display:grid;place-items:center;border-radius:5px;background:var(--plate2);border:2px solid var(--line);font-weight:800;font-size:11px;color:var(--dim)}
.spd.on{background:var(--lime2);color:#0d1a0f}
.spd svg.i{width:15px;height:15px}
#topR{margin-left:auto;display:flex;gap:6px}
.ib{width:38px;height:38px;display:grid;place-items:center;position:relative}
.ib svg.i{width:20px;height:20px}
.badge{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);border:2px solid var(--line);font-size:10px;font-weight:800;line-height:14px;text-align:center;color:#fff}
#rooms{position:absolute;left:8px;top:58px;display:flex;gap:4px;pointer-events:auto;flex-wrap:wrap;max-width:calc(100% - 350px)}
.rt{padding:4px 9px;font-size:12px;font-weight:700;background:var(--plate);border:2px solid var(--line);border-radius:6px;color:var(--dim);display:flex;align-items:center;gap:5px}
.rt.on{color:#0d1a0f;background:var(--lime)}
.rt .dot{width:8px;height:8px;border-radius:2px;background:var(--orange)}
.rt.on .dot{background:#0d1a0f}
#goal{position:absolute;left:8px;top:92px;width:min(250px,calc(100% - 350px));padding:6px 9px;font-size:12px;pointer-events:auto;cursor:pointer}

#envChip{position:absolute;left:8px;bottom:10px;display:flex;gap:4px;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 350px)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;background:var(--plate);border:2px solid var(--line);border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}

#toasts{position:absolute;left:calc(50% - 170px);top:60px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(400px,calc(100% - 370px));z-index:6}
.toast{padding:6px 12px;background:rgba(14,22,17,.94);border:2px solid var(--line);border-left:5px solid var(--lime);border-radius:6px;font-weight:600;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.4);animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.bad{border-left-color:var(--red)}
.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#award{position:absolute;left:calc(50% - 170px);top:8px;transform:translate(-50%,-150%);transition:transform .35s;padding:7px 16px;background:#1d2a1f;border:2px solid var(--gold);border-radius:7px;text-align:center;font-family:var(--f-d);font-size:18px;color:var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.45);z-index:8;pointer-events:none;white-space:nowrap}
#award small{display:block;font-family:var(--f-b);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
#award.on{transform:translate(-50%,0)}
/* plant bubbles */
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;display:flex;gap:2px;padding:2px;background:rgba(14,22,17,.88);border:2px solid var(--line);border-radius:6px;transform:translate(-50%,-100%);will-change:transform}
.bub svg.i{width:15px;height:15px}
.bub .w{color:var(--blue)}.bub .x{color:var(--red)}.bub .r{color:var(--gold)}.bub .p{color:var(--orange)}.bub .g{color:var(--lime)}
.bub.sel{border-color:var(--lime)}
.flt{position:absolute;left:0;top:0;font-family:var(--f-d);font-size:17px;color:var(--gold);text-shadow:0 2px 0 #000;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%)}
/* side panel */
#panel{position:absolute;right:8px;top:58px;bottom:8px;width:326px;display:flex;background:var(--plate);border:2px solid var(--line);border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.45);overflow:hidden;pointer-events:auto}
#tabs{width:46px;flex:none;display:flex;flex-direction:column;gap:2px;padding:4px;background:#0b120d;border-right:2px solid var(--line);overflow-y:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{width:36px;height:40px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--mute);position:relative}
.tab svg.i{width:20px;height:20px}
.tab span{display:none}
.tab:hover{color:var(--cream);background:var(--plate2)}
.tab.on{color:#0d1a0f;background:var(--lime)}
.tab .badge{right:-3px;top:-2px}
#pwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#phead{display:flex;align-items:center;gap:6px;padding:7px 10px 6px;border-bottom:2px solid var(--line);background:var(--plate2)}

#pbody{flex:1;overflow-y:auto;padding:8px 10px 14px;scrollbar-width:thin;scrollbar-color:#3d5a45 transparent;overscroll-behavior:contain}
#pbody::-webkit-scrollbar{width:7px}#pbody::-webkit-scrollbar-thumb{background:#3d5a45;border-radius:4px}
.sec{margin:0 0 10px}
.sec>h3{margin:4px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--lime);display:flex;align-items:center;gap:6px}
.sec>h3 i{flex:1;height:2px;background:var(--plate3)}
.card{background:var(--plate2);border:2px solid var(--line);border-radius:7px;padding:7px 8px;margin-bottom:6px}
.card.hl{border-color:var(--lime2)}
.card.lock{opacity:.55}
.row{display:flex;align-items:center;gap:6px}
.row.sp{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.nm{font-weight:800;font-size:14px;line-height:1.15}
.sub{font-size:11.5px;color:var(--dim)}
.tiny{font-size:10.5px;color:var(--dim)}
.money{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.tagc{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;background:#0e1611;border:1px solid #2d4535;font-size:10.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.tagc.l{color:var(--lime)}.tagc.g{color:var(--gold)}.tagc.o{color:var(--orange)}.tagc.b{color:var(--blue)}.tagc.r{color:#ffb4a2}.tagc.p{color:var(--pink)}
.bar{position:relative;height:8px;background:#0b120d;border:1px solid #000;border-radius:3px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--lime)}
.bar>u{position:absolute;top:0;bottom:0;background:rgba(166,227,110,.18);border-left:1px dashed rgba(166,227,110,.6);border-right:1px dashed rgba(166,227,110,.6)}
.bar.blue>i{background:var(--blue)}.bar.gold>i{background:var(--gold)}.bar.red>i{background:var(--red)}.bar.org>i{background:var(--orange)}
.kv{display:grid;grid-template-columns:62px 1fr 42px;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.kv>span:first-child{color:var(--dim);font-weight:600}
.kv>b{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.acts .b{padding:4px 4px;font-size:12px;min-height:34px;gap:4px}
.iss{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;margin-top:4px;background:#2a1c16;border:1px solid #5a2d1e;border-radius:5px;font-size:11.5px}
.iss svg.i{color:var(--orange);width:16px;height:16px;margin-top:1px}
.iss b{color:#ffd0bd}
.iss.ok{background:#16271a;border-color:#2f5a35}
.iss.ok svg.i{color:var(--lime)}
.seg{display:flex;gap:3px}
.seg button{flex:1;padding:4px 2px;border-radius:5px;background:#0b120d;border:2px solid var(--line);font-size:11.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--lime);color:#0d1a0f}
.sl{display:grid;grid-template-columns:30px 1fr 36px;align-items:center;gap:6px;margin:4px 0}
.sl label{font-weight:800;font-size:12px;color:var(--dim)}
.sl output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#0b120d;border:1px solid #000;border-radius:3px}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:4px;background:var(--lime);border:2px solid var(--line)}

input[type=range].n::-webkit-slider-thumb{background:#7fd27f}input[type=range].p::-webkit-slider-thumb{background:var(--orange)}input[type=range].k::-webkit-slider-thumb{background:var(--blue)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 7px;background:#0e1611;border:2px solid var(--line);border-radius:6px;font-size:12px;font-weight:700}
.tog .sw{width:34px;height:18px;border-radius:4px;background:#2c3a30;border:2px solid var(--line);position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;left:1px;top:1px;width:12px;height:12px;border-radius:2px;background:var(--dim);transition:left .12s}
.tog.on .sw{background:var(--lime2)}.tog.on .sw::after{left:17px;background:#fff}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tr{display:grid;grid-template-columns:52px 1fr;gap:3px 6px;font-size:11px;align-items:center;margin-top:5px}

.mbar{display:flex;gap:2px}
.mbar i{flex:1;height:6px;border-radius:2px;background:#0b120d;border:1px solid #000}
.mbar i.f{background:var(--lime)}
.gauge{width:26px;height:64px;border:2px solid var(--line);border-radius:5px;background:#0b120d;position:relative;overflow:hidden;flex:none}

.grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;border:2px solid var(--line);font-family:var(--f-d);font-size:15px;line-height:1;color:#0d1a0f;flex:none}
.grade.S{background:var(--gold)}.grade.A{background:var(--lime)}.grade.B{background:#7fc8e8}.grade.C{background:#c9b48a}.grade.D{background:#8a8a8a}
.empty{padding:14px 8px;text-align:center;color:var(--dim);font-size:12px;border:2px dashed #2d4535;border-radius:7px}
.spark{width:100%;height:46px;display:block}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:5px}

.pick{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}

.pick button.on{background:var(--lime);color:#0d1a0f}
.note{font-size:11.5px;color:var(--dim);margin:4px 0 6px}

#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,6,.62);z-index:10;padding:10px;pointer-events:auto}
#mcard{width:min(520px,100%);max-height:100%;overflow-y:auto;background:#152019;border:2px solid var(--line);border-radius:10px;box-shadow:0 6px 0 rgba(0,0,0,.5);padding:16px 18px;scrollbar-width:thin}

.how{display:grid;grid-template-columns:34px 1fr;gap:7px 10px;align-items:center;margin:10px 0;font-size:13.5px}

.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim);margin-top:6px}
kbd{display:inline-block;min-width:20px;padding:0 5px;border:2px solid var(--lime);border-radius:4px;color:var(--lime);font-family:var(--f-b);font-weight:800;font-size:11px;line-height:16px;text-align:center}
.who{display:flex;gap:12px;align-items:center;margin-bottom:6px}

.who small{color:var(--dim);font-size:12px}
.say{position:relative;background:#f4f1e4;color:#1a1f1a;border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.4;font-weight:600}
input.txt{width:100%;padding:8px 10px;background:#0b120d;border:2px solid var(--line);border-radius:6px;color:var(--cream);font:inherit;font-size:15px;font-weight:700;-webkit-user-select:text;user-select:text}

.check svg.i{width:20px;height:20px}
.check.y svg.i{color:var(--lime)}.check.n svg.i{color:var(--red)}
#phone{position:absolute;right:12px;top:54px;width:min(330px,calc(100% - 24px));height:min(470px,calc(100% - 66px));display:flex;flex-direction:column;background:#0d1410;border:3px solid #000;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.5);z-index:9;pointer-events:auto;overflow:hidden}
#phone header{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#18241c;border-bottom:2px solid #000;font-weight:800}
#phone header b{flex:1;font-size:14px}
#plist{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.msg{display:flex;gap:7px;align-items:flex-end}
.msg svg.face{width:30px;height:30px;flex:none;border-radius:6px;border:2px solid #000;background:#2a3a30}
.msg .bb{background:#22342a;border-radius:9px 9px 9px 2px;padding:6px 9px;font-size:13px;line-height:1.35;max-width:calc(100% - 40px)}
.msg .bb b{display:block;font-size:10.5px;color:var(--lime);letter-spacing:.04em}
.msg .bb small{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.msg.new .bb{background:#2e4a36}
/* trim minigame */
#mini{position:absolute;inset:0;z-index:11;background:#0c130e;display:flex;flex-direction:column;pointer-events:auto}
#mini header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#18241c;border-bottom:2px solid #000}
#mini header b{font-family:var(--f-d);font-weight:400;font-size:20px;color:var(--lime)}
#mini header span{font-weight:700;font-size:13px;color:var(--dim)}
#mini header .grow{text-align:right}
#trimCv{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:crosshair}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#101813;z-index:20;text-align:center}
#loading b{display:block;font-family:var(--f-d);font-weight:400;font-size:26px;color:var(--lime);margin:8px 0}
#ldBar{width:200px;height:8px;margin:8px auto 0;background:#0b120d;border:2px solid #000;border-radius:4px;overflow:hidden}
#ldBar i{display:block;height:100%;width:0;background:var(--lime);transition:width .2s}
#err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;max-width:80%;z-index:30;background:#3a1610;border:2px solid #000;border-radius:8px;font-weight:700}
/* narrow / phone: panel becomes a bottom sheet with a tab bar */
@container (max-width:700px){
  #top{left:6px;right:6px;top:6px;gap:4px}
  #cash{padding:2px 7px 2px 4px}#cash .logo{width:24px;height:24px}#money{font-size:17px}
  #repBox{padding:2px 7px}#repBox b{font-size:14px}#repBox svg{display:none}
  #clockBox{order:5;width:100%;justify-content:space-between}
  #clockTxt{min-width:0;display:flex;gap:8px;align-items:baseline}
  #clockTxt small{display:none}
  #mini header{gap:6px;padding:6px 8px}#mini header b{font-size:15px;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini header span{font-size:11.5px}
  .ib{width:34px;height:34px}
  #rooms{top:84px;left:6px;max-width:calc(100% - 12px)}
  #goal{top:auto;bottom:54px;left:6px;width:calc(100% - 12px);font-size:11.5px;padding:4px 8px}
  #goal.min{display:none}
  #envChip{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:46px;flex-direction:column-reverse;border-radius:10px 10px 0 0;border-width:2px 0 0}
  #panel.open{height:min(54%,calc(100% - 120px))}
  #tabs{width:auto;height:46px;flex-direction:row;justify-content:space-around;border-right:0;border-top:2px solid var(--line);padding:3px 2px;overflow-x:auto}
  .tab{width:40px;height:38px}
  #pwrap{min-height:0}
  #panel:not(.open) #pwrap{display:none}
  #pclose{display:grid}
  #toasts{top:118px;left:50%;width:calc(100% - 24px)}
  #award{left:50%}
  #phone{top:auto;bottom:52px;right:6px;width:calc(100% - 12px);height:calc(100% - 100px)}
  #mcard{padding:12px 13px}#mcard h1{font-size:24px}#mcard p{font-size:13px}
  .how{font-size:12.5px;gap:5px 8px}.how svg.i{width:22px;height:22px}
}
@container (max-height:420px) and (min-width:701px){#goal{display:none}}

function genContracts() {

/* ===== harvest pipeline ===== */
function stepBatches(dtD) {

  for (const b of S.batches) {
    if (b.stage === 'dry') {
      if (S.t - b.dryT0 >= DRY_MODES[b.dryMode].days) { b.stage = 'drydone'; b.dryQ = DRY_MODES[b.dryMode].q; ui.toast(b.name + ' is dry. Put it in a jar to cure.'); }

      const prog = Math.min(1, c.hours / 96);

      c.rh += dtH * 0.95 * (1 - prog * 0.6) * (S.facil.packs ? 0.5 : 1);
      if (S.facil.packs) c.rh += (62 - c.rh) * Math.min(1, dtH * 0.04);
      c.rh = Math.min(80, c.rh);
      if (c.rh >= 58 && c.rh <= 66) c.good += dtH;

}
const cureQ = c => clamp(c.good / 72, 0, 1) * (1 - Math.min(0.5, c.bad / 30)) * (1 - Math.min(0.3, c.dry / 60));

}

/* ===== staff ===== */
function stepStaff(dtD) {
  for (const s of S.staff) {
    s.cd = (s.cd || 0) - dtD; if (s.cd > 0) continue; s.cd = 0.04;
    if (s.role === 'trimmer') {
      const b = S.batches.find(x => x.stage === 'trim' && S.t - x.at > 0.05);
      if (b) { setTrim(b, 0.78 + R() * 0.08); hang(b, 2) || hang(b, 1); }
      const t2 = S.batches.find(x => x.stage === 'trimmed'); if (t2) hang(t2, 2);
    } else if (s.role === 'curer') {
      for (const b of S.batches) {
        if (b.stage === 'drydone') jarIt(b);
        else if (b.stage === 'cure') { if (b.cure.rh > 65) burp(b, true); if (b.cure.hours >= 78) packageBatch(b); }
      }
    } else if (s.role === 'sales') {
      for (const c of S.contracts.slice()) if (c.acc && canDeliver(c)) deliver(c);
    }
  }
}

/* ===== breeding ===== */
const WORDS = s => s.replace(/’s/g, '').split(' ');

}

/* ================= art loading ================= */
const ART_BASE = '/assets/';
const ART = { tex: {}, hdr: null, glb: {} };
function loadArt(onp) {
  const T = THREE;
  const libP = (T.GLTFLoader && T.RGBELoader) ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = ART_BASE + 'lib/loaders.js'; s.onload = res; s.onerror = () => rej(new Error('loaders')); document.head.append(s);
  });
  const texL = new T.TextureLoader();
  const img = (u, srgb) => new Promise(res => texL.load(ART_BASE + u, t => { if (srgb) t.encoding = T.sRGBEncoding; t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = HQ ? 4 : 1; res(t); }, undefined, () => res(null)));
  const TEX = ['concrete', 'plaster', 'brick', 'metal', 'planks', 'darkwood', 'gravel', 'grass', 'mud', 'tiles'];
  const jobs = [];
  for (const k of TEX) {
    jobs.push(() => img('tex/' + k + '_col.jpg', true).then(t => { (ART.tex[k] = ART.tex[k] || {}).c = t; }));
    if (HQ) jobs.push(() => img('tex/' + k + '_nor.jpg', false).then(t => { (ART.tex[k] = ART.tex[k] || {}).n = t; }));
  }
  const glb = (k, path) => () => new Promise(res => { if (!T.GLTFLoader) return res(); new T.GLTFLoader().load(ART_BASE + path, g => { ART.glb[k] = g; res(); }, undefined, () => res()); });
  for (const k of ['shelf', 'cardbox', 'table', 'sofa', 'trashcan', 'plcrate', 'barrel', 'wrench', 'crate', 'milcrate']) jobs.push(glb(k, 'models/' + k + '.glb'));
  if (HQ) jobs.push(() => new Promise(res => { if (!T.RGBELoader) return res(); new T.RGBELoader().setDataType(T.UnsignedByteType).load(ART_BASE + 'hdr/workshop.hdr', h => { ART.hdr = h; res(); }, undefined, () => res()); }));
  let done = 0;

}

let pickA = null, pickB = null;

/* ================= trim minigame ================= */
let TR = null;
function startTrim(b) {
  const mini = $('#mini'); mini.hidden = false;
  const cv = $('#trimCv');
  TR = { b, t: 26, cut: 0, total: 0, nicks: 0, buds: [], cur: 0, fall: [], marks: [], px: 0, py: 0, x: -99, y: -99, down: false, ncd: 0, done: 0, flash: 0, snip: 0 };
  $('#miniT').textContent = 'Trim: ' + b.name;
  $('#miniQ').textContent = S.facil.trimmer ? 'Tumble trim' : 'Quick trim';
  sizeTrim();
  for (let i = 0; i < 2; i++) TR.buds.push(genBud(i));
  TR.total = TR.buds.reduce((a, x) => a + x.leaves.length, 0);
  sfx('click');
}
function sizeTrim() {
  const cv = $('#trimCv'), r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(200, Math.round(r.width * d)); cv.height = Math.max(150, Math.round(r.height * d)); TR.d = d;
}
function genBud(i) {
  const cv = $('#trimCv'), W2 = cv.width, H2 = cv.height;
  const rx = Math.min(W2 * 0.2, H2 * 0.2), ry = rx * 1.4, cx = W2 / 2, cy = H2 * 0.5;
  const st = strainById(TR.b.sid);
  const bc = '#' + st.bud.toString(16).padStart(6, '0');
  const leaves = [];
  const n = 8 + ri(3);
  for (let k = 0; k < n; k++) {
    let a = (k + 0.3 + R() * 0.4) / n * TAU * 0.86 + TAU * 0.07 - PI;   // keep the bottom (stem) free
    a += PI;
    const bx = cx + Math.sin(a) * rx * 0.78, by = cy - Math.cos(a) * ry * 0.78;
    const j = (R() - 0.5) * 0.6, len = rx * (0.6 + R() * 0.5);
    leaves.push({ bx, by, dx: Math.sin(a + j), dy: -Math.cos(a + j), len, wid: len * 0.3, cut: false, wob: R() * TAU });
  }
  const lumps = [], pist = [], frost = [];
  for (let k = 0; k < 70; k++) { const a = R() * TAU, rr = Math.sqrt(R()) * 0.84; lumps.push([cx + Math.sin(a) * rx * rr, cy - Math.cos(a) * ry * rr, rx * (0.16 + R() * 0.16), R()]); }
  lumps.sort((p, q) => p[1] - q[1]);
  for (let k = 0; k < 60; k++) { const a = R() * TAU, rr = Math.sqrt(R()) * 0.9; pist.push([cx + Math.sin(a) * rx * rr, cy - Math.cos(a) * ry * rr, R() * TAU, rx * (0.12 + R() * 0.12)]); }
  for (let k = 0; k < 260; k++) { const a = R() * TAU, rr = Math.sqrt(R()) * 0.95; frost.push([cx + Math.sin(a) * rx * rr, cy - Math.cos(a) * ry * rr, 0.8 + R() * 1.6]); }
  return { cx, cy, rx, ry, leaves, lumps, pist, frost, bc, leaf: '#' + st.leaf.toString(16).padStart(6, '0') };
}
function segX(ax, ay, bx, by, cx, cy, dx, dy) {
  const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx); if (Math.abs(d) < 1e-6) return false;
  const u = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d, v = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
  return u >= 0 && u <= 1 && v >= 0 && v <= 1;
}
function distSeg(px, py, ax, ay, bx, by) { const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy; let t = l ? ((px - ax) * vx + (py - ay) * vy) / l : 0; t = clamp(t, 0, 1); return Math.hypot(px - ax - vx * t, py - ay - vy * t); }
function trimCut(tap) {
  const B = TR.buds[TR.cur]; if (!B || TR.done) return;
  for (const L of B.leaves) {
    if (L.cut) continue;
    const ex = L.bx + L.dx * L.len * 0.5, ey = L.by + L.dy * L.len * 0.5;
    const hit = tap ? distSeg(TR.x, TR.y, L.bx, L.by, ex, ey) < 22 * TR.d : segX(TR.px, TR.py, TR.x, TR.y, L.bx, L.by, ex, ey);
    if (hit) { L.cut = true; TR.cut++; TR.snip = 0.15; TR.fall.push({ L, x: 0, y: 0, vx: (R() - 0.5) * 120, vy: -60, r: 0, vr: (R() - 0.5) * 6, t: 0 }); sfx('snip'); }
  }
  // nicking the bud

  if (B.leaves.every(l => l.cut)) { if (TR.cur < TR.buds.length - 1) { TR.cur++; TR.marks.length = 0; } else endTrim(); }
}
function endTrim(quick) {
  if (!TR || TR.done) return;
  let q;
  if (quick) q = S.facil.trimmer ? 0.72 : 0.5;
  else { const sc = clamp(TR.cut / TR.total * 100 - TR.nicks * 7 + Math.max(0, TR.t) * 0.8, 0, 100); q = clamp(sc / 100, 0.3, 1); if (sc >= 90) ach('trim95'); TR.score = Math.round(sc); }

}
function trimFrame(dt) {

  const cv = $('#trimCv'), x = cv.getContext('2d'), W2 = cv.width, H2 = cv.height, d = TR.d;
  if (TR.done) { if (performance.now() >= TR.doneAt) { $('#mini').hidden = true; toast('Trim score ' + TR.score + '. Now pick a dry speed.', TR.score >= 80 ? 'gold' : ''); TR = null; uiDirty = true; return; } }
  else { TR.t -= dt; if (TR.t <= 0) { TR.t = 0; endTrim(); } }
  TR.ncd -= dt; TR.flash = Math.max(0, TR.flash - dt); TR.snip = Math.max(0, TR.snip - dt);
  // board
