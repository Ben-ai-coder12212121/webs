  function ring(px,py,r0,r1,life,col,w){const i=rI;rI=(rI+1)%RN;rX[i]=px;rY[i]=py;rA[i]=r0;rB[i]=r1;rL[i]=rM[i]=life;rC[i]=col;rW[i]=w||4}

  const BOLTS=[];for(let i=0;i<12;i++)BOLTS.push({x0:0,y0:0,x1:0,y1:0,l:0});let bI=0;
  function bolt(a,b,c2,d){const q=BOLTS[bI];bI=(bI+1)%BOLTS.length;q.x0=a;q.y0=b;q.x1=c2;q.y1=d;q.l=.25}
  function wrong(o,msg){lives--;streak=0;if(mult>1)float('Streak lost',CX,FLOOR-30,18,'#ff9aa5',1);mult=1;const ci=o.kind==='c'?o.col:GREY;
    burst(o.x,o.y,18,GREY,300,.8,6,2,700,1.2);burst(o.x,o.y,10,ci,260,.6,5,2,700,1.2);ring(o.x,o.y,10,90,.4,0,8);float(msg,o.x,o.y-OR,22,'#FF6B78',1.1);
    freeze=.12;shake=18;vign=1;noise(.35,.16,500);tone(140,.35,'sawtooth',.09,70);tone(110,.35,'square',.05,60);stat();if(lives<=0)die()}
  function miss(o){lives--;streak=0;if(mult>1)float('Streak lost',CX,FLOOR-30,18,'#ff9aa5',1);mult=1;burst(o.x,FLOOR,16,o.col,240,.6,5,2,700,1.2);ring(o.x,FLOOR,10,70,.4,0,6);float('Missed one!',o.x,FLOOR-40,20,'#FF6B78',1);
    shake=12;vign=.8;freeze=.08;tone(220,.3,'sawtooth',.07,90);stat();if(lives<=0)die()}
  function switchColor(){prevCur=cur;cur=next;hueA=0;if(smashed>=22&&nColors<4){nColors=4;float('New color: green',CX,250,22,HUES[3],1.6)}else if(smashed>=60&&nColors<5){nColors=5;float('New color: orange',CX,250,22,HUES[4],1.6)}
    next=pickNext();swDur=Math.max(2.6,5.5-elapsed/30);swT=swDur;coreSpin=1;ring(CX,CY,CORE,W,.7,cur,10);ring(CX,CY,CORE,W*.6,.5,WHITE,4);
    for(const o of orbs)if(o.kind==='c'&&o.col===cur&&o.y>FLOOR-150)o.grace=true;
    tone(330,.18,'triangle',.06,660);tone(660,.2,'triangle',.05,1320,.06);noise(.2,.05,3000,true)}
  function die(){state='dying';dieT=0;prevBest=c.best()||0;newBest=score>prevBest;c.best(score);c.stat('Game over · '+score+' pts · Best '+Math.max(prevBest,score));
    for(const o of orbs){if(o.dead)continue;o.dead=true;burst(o.x,o.y,8,o.kind==='c'?o.col:GREY,260,.7,5,2,600,1.2)}ring(CX,CY,CORE,W,1,0,12);noise(.8,.18,600);tone(300,.9,'sawtooth',.07,50)}

  /* ---------- update ---------- */
  function update(dt){time+=dt;stepParts(dt);flash=Math.max(0,flash-dt*2);shake=Math.max(0,shake-dt*50);vign=Math.max(0,vign-dt*1.6);coreKick=Math.max(0,coreKick-dt*4);coreSpin=Math.max(0,coreSpin-dt*2.5);hueA=Math.min(1,hueA+dt*3);for(let i=0;i<4;i++)laneFlash[i]=Math.max(0,laneFlash[i]-dt*4);
    for(const q of BOLTS)if(q.l>0)q.l-=dt;
    if(state==='intro'){if(Math.random()<dt*1.5&&orbs.length<6){spawnT=0;elapsed=0;spawn()}for(const o of orbs){o.y+=o.vy*dt*.6;if(o.y>FLOOR+OR)o.dead=true}orbs=orbs.filter(o=>!o.dead);swT-=dt;if(swT<=0){cur=(cur+1)%3;swT=2}return}
    if(state==='dying'){dieT+=dt;if(dieT>1.2){state='over';overT=time}return}
    if(state!=='play')return;
    const sl=slowT>0?.5:1;slowT=Math.max(0,slowT-dt);const gdt=dt*sl;elapsed+=dt;
    swT-=dt;if(swT<=0)switchColor();
    spawnT-=gdt;if(spawnT<=0){spawn();spawnT=Math.max(.28,.72-elapsed/170)*(.7+Math.random()*.6)}
    for(const o of orbs){if(o.dead)continue;o.sw+=gdt*3;o.rot+=gdt;
      if(o.mode==='arc'){o.vy+=o.g*gdt;o.x+=o.vx*gdt;o.y+=o.vy*gdt;if(o.x<OR&&o.vx<0&&o.y<FLOOR){o.vx=-o.vx}if(o.x>W-OR&&o.vx>0&&o.y<FLOOR){o.vx=-o.vx}}
      else{o.y+=o.vy*gdt;o.x+=Math.cos(o.sw)*o.swA*gdt*(o.mode==='zig'?2.4:1);if(o.x<OR){o.x=OR}else if(o.x>W-OR){o.x=W-OR}}
      if(o.y>FLOOR&&(o.mode!=='arc'||o.vy>0)){o.dead=true;if(o.kind==='c'&&o.col===cur&&!o.grace){miss(o);if(state!=='play')return}else{burst(o.x,FLOOR,6,o.kind==='c'?o.col:GREY,120,.4,3,0)}}}
    let j=0;for(const o of orbs)if(!o.dead)orbs[j++]=o;orbs.length=j}

  /* ---------- drawing ---------- */
  function drawOrb(o){const age=time-o.born,sp=age<.18?.4+age/.18*.75:age<.3?1.15-(age-.18)/.12*.15:1,r=OR*sp;
    if(o.kind==='c'){const match=o.col===cur&&state==='play';if(match){x.globalCompositeOperation='lighter';x.globalAlpha=.55+.15*Math.sin(time*8);x.drawImage(HALO[o.col],o.x-r*2.1,o.y-r*2.1,r*4.2,r*4.2);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
      const z=OSZ*sp;x.drawImage(ORB[o.col],o.x-z/2,o.y-z/2,z,z);if(o.grace){x.strokeStyle='rgba(255,255,255,.35)';x.setLineDash([4,4]);x.lineWidth=2;x.beginPath();x.arc(o.x,o.y,r+5,0,TAU);x.stroke();x.setLineDash([])}return}
    x.save();x.translate(o.x,o.y);
    if(o.kind==='bomb'){x.rotate(o.rot*2);x.fillStyle='#1b1a2c';x.beginPath();for(let i=0;i<16;i++){const a=i/16*TAU,rr=i%2?r*.78:r*1.02;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill();x.strokeStyle='#FF4D5E';x.lineWidth=2.5;x.stroke();
      x.rotate(-o.rot*2);x.strokeStyle='#FF4D5E';x.lineWidth=4;x.beginPath();x.moveTo(-9,-9);x.lineTo(9,9);x.moveTo(9,-9);x.lineTo(-9,9);x.stroke()}
    else if(o.kind==='prism'){x.globalCompositeOperation='lighter';x.drawImage(HALO[WHITE],-r*2,-r*2,r*4,r*4);x.globalCompositeOperation='source-over';for(let i=0;i<5;i++){x.fillStyle=HUES[i];x.beginPath();x.moveTo(0,0);x.arc(0,0,r,o.rot+i/5*TAU,o.rot+(i+1)/5*TAU);x.closePath();x.fill()}x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(0,0,r,0,TAU);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(0,0,r*.32,0,TAU);x.fill()}
    else if(o.kind==='slow'){x.fillStyle='#e8f8ff';x.beginPath();x.arc(0,0,r,0,TAU);x.fill();x.strokeStyle='#3DA5FF';x.lineWidth=3;x.stroke();x.strokeStyle='#1b1a2c';x.lineWidth=3.5;x.lineCap='round';x.beginPath();x.moveTo(0,0);x.lineTo(0,-r*.6);x.moveTo(0,0);x.lineTo(Math.cos(o.rot*3)*r*.45,Math.sin(o.rot*3)*r*.45);x.stroke();x.lineCap='butt'}
    else{x.fillStyle='#ffe3ee';x.beginPath();x.arc(0,0,r,0,TAU);x.fill();x.strokeStyle='#FF9EC4';x.lineWidth=3;x.stroke();x.fillStyle='#FF4D7A';x.beginPath();x.moveTo(0,r*.5);x.bezierCurveTo(-r*.9,-r*.05,-r*.4,-r*.75,0,-r*.3);x.bezierCurveTo(r*.4,-r*.75,r*.9,-r*.05,0,r*.5);x.fill()}
    x.restore()}
  function drawCore(){const k=1+coreKick*.18+Math.sin(time*5)*.02,r=CORE*k;x.globalCompositeOperation='lighter';x.globalAlpha=.8;x.drawImage(BIG[cur],CX-r*3.4,CY-r*3.4,r*6.8,r*6.8);x.globalAlpha=1;x.globalCompositeOperation='source-over';
    /* switch timer ring, the last stretch previews the next color */
    const p=Math.max(0,swT/swDur);x.lineWidth=7;x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(CX,CY,r+12,0,TAU);x.stroke();x.strokeStyle=HUES[cur];x.beginPath();x.arc(CX,CY,r+12,-Math.PI/2,-Math.PI/2+TAU*p);x.stroke();
    if(swT<1.1&&state==='play'){x.strokeStyle=HUES[next];x.globalAlpha=.5+.5*Math.sin(time*20);x.lineWidth=4;x.beginPath();x.arc(CX,CY,r+21,0,TAU);x.stroke();x.globalAlpha=1;x.save();x.translate(CX+r+46,CY-4);x.fillStyle=HUES[next];x.beginPath();x.arc(0,0,13,0,TAU);x.fill();x.fillStyle='#fff';shape(x,next,12);x.fill('evenodd');x.restore();x.font=figF(800,11);x.fillStyle='rgba(255,255,255,.7)';x.textAlign='center';x.fillText('NEXT',CX+r+46,CY+20)}
    x.save();x.translate(CX,CY);x.rotate(coreSpin*coreSpin*TAU);const z=OSZ*(r/OR)*1.05;x.drawImage(ORB[cur],-z/2,-z/2,z,z);x.restore();
    if(hueA<1){x.globalAlpha=1-hueA;const z=OSZ*(r/OR)*1.05;x.drawImage(ORB[prevCur],CX-z/2,CY-z/2,z,z);x.globalAlpha=1}}
  function heart(px,py,s,on){x.fillStyle=on?'#FF4D7A':'rgba(255,255,255,.14)';x.beginPath();x.moveTo(px,py+s*.55);x.bezierCurveTo(px-s,py-s*.05,px-s*.45,py-s*.8,px,py-s*.3);x.bezierCurveTo(px+s*.45,py-s*.8,px+s,py-s*.05,px,py+s*.55);x.fill()}
  function drawHud(){x.textBaseline='middle';x.textAlign='left';x.font=bagel(28);x.lineWidth=5;x.strokeStyle='rgba(5,6,15,.8)';x.strokeText(String(score),14,30);x.fillStyle='#fff';x.fillText(String(score),14,30);
    for(let i=0;i<Math.max(3,lives);i++)heart(24+i*24,60,11,i<lives);
    x.textAlign='right';x.font=figF(800,11);x.fillStyle='rgba(220,230,255,.6)';x.fillText('BEST',W-14,18);x.font=bagel(18);x.fillStyle='#FFE27A';x.fillText(String(Math.max(prevBest,score)),W-14,38);
    /* streak meter */
    if(state==='play'||state==='dying'){const seg=streak%6,mw=120,mx=CX-mw/2;x.textAlign='center';x.font=bagel(20);x.fillStyle=mult>1?'#FFE27A':'rgba(255,255,255,.55)';x.fillText('x'+mult,CX,24);for(let i=0;i<6;i++){x.fillStyle=i<seg||mult>=8?HUES[cur]:'rgba(255,255,255,.12)';x.fillRect(mx+i*(mw/6)+2,40,mw/6-4,6)}}
    if(slowT>0){x.textAlign='right';x.font=figF(800,13);x.fillStyle='#9FE8FF';x.fillText('Slow '+slowT.toFixed(1)+'s',W-14,62)}
    /* floor line and lane hints */
    x.strokeStyle='rgba(255,255,255,.22)';x.lineWidth=2;x.setLineDash([10,8]);x.lineDashOffset=-time*25;x.beginPath();x.moveTo(0,FLOOR);x.lineTo(W,FLOOR);x.stroke();x.setLineDash([]);
    if(kbUsed){const keys='DFJK';x.font=figF(800,13);x.textAlign='center';for(let i=0;i<4;i++){const lx=W/8+i*W/4;x.fillStyle='rgba(255,255,255,'+(.25+laneFlash[i]*.6)+')';x.fillText(keys[i],lx,FLOOR+16);if(laneFlash[i]>0){x.fillStyle='rgba(255,255,255,'+(laneFlash[i]*.08)+')';x.fillRect(i*W/4,0,W/4,FLOOR)}}}}
  function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
  function panel(y0,h){x.fillStyle='rgba(6,7,18,.88)';rr(26,y0,W-52,h,16);x.fill();x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;x.stroke()}
  function button(label,y){const bw=210,bh=50,p=1+Math.sin(time*4)*.03;x.save();x.translate(CX,y);x.scale(p,p);x.fillStyle='#FFE27A';rr(-bw/2,-bh/2,bw,bh,10);x.fill();x.fillStyle='#1a1405';x.font=bagel(24);x.textAlign='center';x.textBaseline='middle';x.fillText(label,0,1);x.restore()}
  function drawIntro(){panel(70,470);x.textAlign='center';x.textBaseline='middle';x.font=bagel(52);x.lineWidth=8;x.strokeStyle='#05060f';x.strokeText('Hue Smash',CX,124);
    const g=x.createLinearGradient(CX-130,0,CX+130,0);g.addColorStop(0,HUES[0]);g.addColorStop(.35,HUES[2]);g.addColorStop(.7,HUES[3]);g.addColorStop(1,HUES[1]);x.fillStyle=g;x.fillText('Hue Smash',CX,124);
    const rows=[['Tap orbs that match the','color of the core below.'],['Wrong color costs a heart.','So does a match that slips by.'],['The ring shows when the core','switches. Watch for NEXT.'],['Streaks grow your multiplier.','Prisms clear a whole color.']];
    for(let i=0;i<4;i++){const y=192+i*64,ix=70;
      if(i===0){x.drawImage(ORB[1],ix-22,y-22,44,44)}else if(i===1){heart(ix,y+2,15,true)}else if(i===2){x.lineWidth=5;x.strokeStyle=HUES[2];x.beginPath();x.arc(ix,y,15,-Math.PI/2,Math.PI*.9);x.stroke();x.strokeStyle='rgba(255,255,255,.2)';x.beginPath();x.arc(ix,y,15,Math.PI*.9,Math.PI*1.5);x.stroke()}
      else{for(let k=0;k<5;k++){x.fillStyle=HUES[k];x.beginPath();x.moveTo(ix,y);x.arc(ix,y,16,time+k/5*TAU,time+(k+1)/5*TAU);x.closePath();x.fill()}}
      x.textAlign='left';x.fillStyle='#eef1ff';x.font=figF(700,16);x.fillText(rows[i][0],106,y-10);x.fillStyle='rgba(225,230,255,.7)';x.fillText(rows[i][1],106,y+11);x.textAlign='center'}
    x.font=figF(700,13);x.fillStyle='rgba(225,230,255,.65)';x.fillText('Each color has its own shape too.',CX,446);button('Play',492);x.font=figF(700,13);x.fillStyle='rgba(225,230,255,.6)';x.fillText('Best '+prevBest+' pts',CX,528)}
  function drawOver(){panel(150,340);x.textAlign='center';x.textBaseline='middle';x.font=bagel(30);x.fillStyle='#FF8FA0';x.fillText('Out of hearts',CX,192);x.font=bagel(58);x.fillStyle='#fff';x.fillText(String(score),CX,252);
    x.font=figF(800,15);x.fillStyle=newBest?'#FFE27A':'rgba(225,230,255,.7)';x.fillText(newBest?'New personal best!':'Best '+Math.max(prevBest,score)+' pts',CX,296);
    x.font=figF(700,15);x.fillStyle='#d8dcff';x.fillText(smashed+' smashed   ·   best streak '+bestStreak+'   ·   '+Math.round(elapsed)+'s',CX,332);if(time-overT>.8)button('Play again',414);x.font=figF(700,13);x.fillStyle='rgba(225,230,255,.55)';x.fillText('or press Space',CX,456)}
  let lastDt=0;
  function draw(){const s1=shake>0?(Math.random()-.5)*shake:0,s2=shake>0?(Math.random()-.5)*shake:0;x.setTransform(DPR,0,0,DPR,0,0);x.drawImage(bg,0,0,W,H);
    x.globalCompositeOperation='lighter';x.globalAlpha=.22*hueA;x.drawImage(BIG[cur],-W*.4,FLOOR-H*.55,W*1.8,H*1.1);if(hueA<1){x.globalAlpha=.22*(1-hueA);x.drawImage(BIG[prevCur],-W*.4,FLOOR-H*.55,W*1.8,H*1.1)}x.globalAlpha=1;x.globalCompositeOperation='source-over';
    x.setTransform(DPR,0,0,DPR,s1*DPR,s2*DPR);for(const o of orbs)if(!o.dead)drawOrb(o);
    x.globalCompositeOperation='lighter';for(const q of BOLTS){if(q.l<=0)continue;x.globalAlpha=q.l*4;x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(q.x0,q.y0);const mx=(q.x0+q.x1)/2+(Math.random()-.5)*30,my=(q.y0+q.y1)/2+(Math.random()-.5)*30;x.lineTo(mx,my);x.lineTo(q.x1,q.y1);x.stroke()}x.globalAlpha=1;x.globalCompositeOperation='source-over';
    drawParts();drawRings(lastDt);drawCore();x.setTransform(DPR,0,0,DPR,0,0);drawHud();drawFloats(lastDt);
    if(flash>0){x.globalAlpha=flash*.5;x.fillStyle=COLS[flashC];x.fillRect(0,0,W,H);x.globalAlpha=1}
    if(vign>0){x.globalAlpha=vign*.55;x.strokeStyle='#FF2D45';x.lineWidth=40;x.strokeRect(0,0,W,H);x.globalAlpha=1}
    if(slowT>0&&state==='play'){x.globalAlpha=Math.min(.12,slowT*.05);x.fillStyle='#9FE8FF';x.fillRect(0,0,W,H);x.globalAlpha=1}
    if(state==='intro')drawIntro();else if(state==='over')drawOver();else if(state==='paused'){panel(260,150);x.textAlign='center';x.font=bagel(36);x.fillStyle='#fff';x.fillText('Paused',CX,310);x.font=figF(700,15);x.fillStyle='rgba(225,230,255,.75)';x.fillText('Tap or press P to keep going',CX,356)}}

  /* ---------- input ---------- */
  function lp(e){const r=cv.getBoundingClientRect(),w=cv.clientWidth||r.width,h=cv.clientHeight||r.height;return[(e.clientX-r.left-cv.clientLeft)*W/w,(e.clientY-r.top-cv.clientTop)*H/h]}
  function start(){unlockAudio&&unlockAudio();reset();state='play';beep(523,.08,'triangle',.06);setTimeout(()=>beep(784,.1,'triangle',.06),70)}
  function tapAt(px,py){let best=null,bd=1e9;for(const o of orbs){if(o.dead)continue;const d=Math.hypot(o.x-px,o.y-py);if(d<OR+16&&d<bd){bd=d;best=o}}
    if(best)smash(best);else{ring(px,py,4,30,.25,WHITE,2);tone(200,.04,'sine',.03,0,0,'empty',60)}}
  function primary(){if(state==='intro')start();else if(state==='over'){if(time-overT>.8)start()}else if(state==='paused')state='play'}
  c.on(cv,'pointerdown',e=>{e.preventDefault();if(state!=='play'){primary();return}const[px,py]=lp(e);tapAt(px,py)});
  c.on(cv,'contextmenu',e=>e.preventDefault());
  const LANES={d:0,f:1,j:2,k:3,'1':0,'2':1,'3':2,'4':3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};
  c.on(document,'keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
    if(k===' '||k==='Enter'){e.preventDefault();if(!e.repeat)primary();return}if(k==='p'||k==='Escape'){if(state==='play')state='paused';else if(state==='paused')state='play';return}
    const ln=LANES[k];if(ln==null)return;e.preventDefault();if(e.repeat)return;if(state!=='play'){primary();return}kbUsed=true;laneFlash[ln]=1;
    let best=null;for(const o of orbs){if(o.dead||o.y<-OR*.5||o.y>FLOOR)continue;if(Math.floor(Math.max(0,Math.min(W-1,o.x))/(W/4))!==ln)continue;if(!best||o.y>best.y)best=o}if(best)smash(best);else tone(200,.04,'sine',.03,0,0,'empty',60)});
  c.on(window,'blur',()=>{if(state==='play')state='paused'});
  c.on(document,'visibilitychange',()=>{if(document.hidden&&state==='play')state='paused'});

  prevBest=c.best()||0;stat();
  c.loop(ms=>{let dt=ms/1000;lastDt=dt;if(freeze>0){freeze-=dt;dt=0}if(state==='paused')dt=0;update(dt);if(dt===0)lastDt=0;draw()});
  return()=>{try{master&&master.disconnect()}catch(e){}};
}});
</script>
