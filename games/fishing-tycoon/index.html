<script>
/* ===================== Fishing Tycoon: game code ===================== */
G.push({id:'fishtycoon',name:'Fishing Tycoon',kind:'sim',wide:true,tint:'#bfe6ff',blurb:'Cast, hook and sell 30 kinds of fish, from sardines to legends. Upgrade your rod and boat, hire a crew, build a harbor and fish five waters.',
fmt:b=>{const u=['','K','M','B','T','Qa','Qi'];let i=0;while(b>=1000&&i<6){b/=1000;i++}return'\x24'+(i?b.toFixed(b<10?2:b<100?1:0):Math.floor(b))+u[i]},
art:'<rect width="120" height="72" fill="#9fd8ff"/><rect y="34" width="120" height="38" fill="#2f86c8"/><path d="M0 40Q15 36 30 40T60 40T90 40T120 40" stroke="#bfe6ff" stroke-width="2" fill="none"/><rect x="96" y="14" width="6" height="20" fill="#fff" stroke="#1D1A2F" stroke-width="1.5"/><rect x="96" y="20" width="6" height="5" fill="#d64933"/><path d="M28 44H64L58 54H34Z" fill="#fff" stroke="#1D1A2F" stroke-width="2"/><rect x="40" y="34" width="12" height="10" fill="#d64933" stroke="#1D1A2F" stroke-width="1.5"/><path d="M58 36L84 18" stroke="#6b4423" stroke-width="2"/><path d="M84 18Q90 40 88 50" stroke="#fff" stroke-width="1"/><ellipse cx="88" cy="58" rx="9" ry="5" fill="#ffd23f" stroke="#1D1A2F" stroke-width="1.5"/><path d="M79 58L73 53V63Z" fill="#ffd23f" stroke="#1D1A2F" stroke-width="1.5"/>',
run(root,c){const W=960,H=540,SW=640,PX=648,PW=304;const {cv,x}=MOB.canvas(root,W,H);cv.style.width='min(100%,calc(72vh*1.7778))';
  const INK='#1D1A2F',HZ=214;

  /* ---------- data ---------- */
  const RAR=[{name:'Common',col:'#cfd8e0',val:4},{name:'Uncommon',col:'#7fd4a0',val:10},{name:'Rare',col:'#5ab0ff',val:28},{name:'Epic',col:'#c79bff',val:80},{name:'Legendary',col:'#ffd23f',val:350}];
  const F=(name,r,col,col2,pat)=>({name,r,col,col2,pat});
  const LOCS=[
    {name:'Harbor Bay',boat:1,mult:1,sea:['#3a9ad8','#1f5a8a'],sky:['#8fd3ff','#e8f6ff'],fish:[F('Sardine',0,'#9fb6cc','#e8f0f8'),F('Mackerel',0,'#3a7aa8','#cfe0ee','stripes'),F('Sea Bass',1,'#6a7a8a','#d8dde2'),F('Red Snapper',2,'#e85a4a','#ffc0b0'),F('Pufferfish',3,'#e8c84a','#fff4c0','spikes'),F('Golden Bream',4,'#ffd23f','#fff4a0','shine')]},
    {name:'Coral Reef',boat:2,mult:5,sea:['#2fc0c8','#1a7a9a'],sky:['#9fe0ff','#effbff'],fish:[F('Clownfish',0,'#ff8a2a','#ffffff','bands'),F('Blue Tang',0,'#2f6fd8','#ffd23f'),F('Parrotfish',1,'#3fc08a','#ff8ab0'),F('Lionfish',2,'#d8603a','#fff0e0','stripes'),F('Moorish Idol',3,'#fff4c0','#1D1A2F','bands'),F('Rainbow Wrasse',4,'#ff5ab0','#5ad8ff','rainbow')]},
    {name:'Open Ocean',boat:3,mult:22,sea:['#1f6ab0','#0f3a6a'],sky:['#7fc0f0','#e0f2ff'],fish:[F('Tuna',0,'#2a4a7a','#c8d4e0'),F('Mahi-Mahi',0,'#3fae4a','#ffe04a'),F('Swordfish',1,'#4a5a8a','#c0c8e0','sword'),F('Blue Marlin',2,'#2a5ab8','#cfe0ff','sword'),F('Ocean Sunfish',3,'#9aa8b8','#e8eef4','round'),F('Sailfish King',4,'#1f4ad8','#ffd23f','sword')]},
    {name:'Deep Sea',boat:4,mult:100,sea:['#123a6a','#050f24'],sky:['#4a6a9a','#a8c0dc'],fish:[F('Lanternfish',0,'#3a4a6a','#9ad8ff','glow'),F('Viperfish',0,'#2a2a3a','#5a6a8a','fangs'),F('Anglerfish',1,'#4a3a3a','#8a6a5a','lure'),F('Gulper Eel',2,'#1f1f2a','#5a5a7a','eel'),F('Giant Squid',3,'#c85a5a','#ffb0a0','squid'),F('Ghost Shark',4,'#d8e4f0','#ffffff','shine')]},
    {name:'Frozen Fjord',boat:5,mult:480,sea:['#5aa8c8','#2a5a7a'],sky:['#bcd6ee','#f2f8ff'],fish:[F('Arctic Char',0,'#d8603a','#ffd0b0'),F('Cod',0,'#8a8a6a','#e8e8d8'),F('Halibut',1,'#7a6a5a','#f0ece4','flat'),F('Ice Pike',2,'#7ac0d8','#e8f8ff','stripes'),F('Frost Salmon',3,'#ff8a8a','#e0f4ff','shine'),F('Aurora Sturgeon',4,'#5ad8a8','#c79bff','rainbow')]}];
  const BOATS=['Rowboat','Skiff','Trawler','Cruiser','Research Vessel'],BOAT_COST=[0,1500,4e4,9e5,2.5e7];
  const DEF={money:0,life:0,lifeAll:0,rod:1,sonar:0,boat:1,crew:0,net:0,auto:0,autoOn:1,market:0,plant:0,loc:0,dex:{},pearls:0,caught:0,legends:0,rate:0,seen:0};
  const KEY='ty_fish';
  let st=TY.load(KEY,DEF);st.dex=st.dex||{};

  /* ---------- formulas ---------- */
  const L=()=>LOCS[st.loc];
  const speed=()=>1+.12*(st.rod-1);
  const luck=()=>.03*(st.rod-1)+.07*st.sonar;
  const dexDone=i=>LOCS[i].fish.every(f=>st.dex[f.name]);
  const valMul=()=>(1+.05*(st.rod-1))*(1+.2*st.market)*(1+.35*st.plant)*(1+.05*st.pearls)*(dexDone(st.loc)?1.25:1);
  const value=f=>RAR[f.r].val*L().mult*valMul();
  const crewMax=()=>2*st.boat;
  const crewInterval=()=>7/(1+.12*(st.boat-1));
  const pearlsFor=life=>Math.floor(Math.sqrt(life/2e5));
  function roll(lk){const fs=L().fish,w=fs.map(f=>[60,25,10,4,1][f.r]/(f.r===0?2:1)*Math.pow(1+lk,f.r));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<fs.length;i++){r-=w[i];if(r<=0)return fs[i]}return fs[0]}
  const UPG=[
    {id:'rod',name:'Fishing Rod',icon:'rod',lvl:()=>'Lv. '+st.rod,sub:()=>'Bites '+Math.round((speed()-1)*100)+'% faster, better luck',cost:()=>TY.cost(25,1.55,st.rod-1),buy:()=>st.rod++},
    {id:'auto',name:'Auto Fisher',icon:'auto',lvl:()=>st.auto?'Owned':'Not owned',sub:()=>'Casts and reels for you',cost:()=>2000,buy:()=>{st.auto=1;st.autoOn=1},max:()=>st.auto,maxLabel:'OWNED'},
    {id:'crew',name:'Hire Crew',icon:'crew',lvl:()=>st.crew+' / '+crewMax(),sub:()=>'Each lands a fish every '+crewInterval().toFixed(1)+'s',cost:()=>TY.cost(120,1.45,st.crew),buy:()=>st.crew++,max:()=>st.crew>=crewMax(),maxLabel:'FULL'},
    {id:'net',name:'Net Upgrade',icon:'net',lvl:()=>st.net?'Lv. '+st.net:'No net',sub:()=>st.net?'Hauls '+(st.net*.35).toFixed(2)+' small fish a second':'Catches small fish all day',cost:()=>TY.cost(300,1.75,st.net),buy:()=>st.net++},
    {id:'sonar',name:'Sonar',icon:'sonar',lvl:()=>'Lv. '+st.sonar,sub:()=>'Finds rarer fish',cost:()=>TY.cost(400,2,st.sonar),buy:()=>st.sonar++,max:()=>st.sonar>=10},
    {id:'boat',name:'Boat Upgrade',icon:'boat',lvl:()=>BOATS[st.boat-1],sub:()=>st.boat<5?'Next: '+BOATS[st.boat]+' (new waters, more crew)':'The best boat afloat',cost:()=>BOAT_COST[Math.min(4,st.boat)],buy:()=>st.boat++,max:()=>st.boat>=5},
    {id:'market',name:'Fish Market',icon:'market',lvl:()=>'Lv. '+st.market,sub:()=>'Fish sell for 20% more per level',cost:()=>TY.cost(600,1.9,st.market),buy:()=>st.market++},
    {id:'plant',name:'Processing Plant',icon:'plant',lvl:()=>st.plant?'Lv. '+st.plant:'Not built',sub:()=>'Smoked, canned, filleted: +35% value',cost:()=>TY.cost(5000,2.3,st.plant),buy:()=>st.plant++}];

  /* ---------- runtime ---------- */
  let t=0,tab='shop',fs={state:'idle',t:0},bob={x:470,y:400},parts=[],floats=[],pop=null,crewAcc=0,netAcc=0,confirm=0,welcome=TY.offline(st),saveT=0,bestT=0,banner=null,lastCatch=null;
  const M=TY.meter(6);
  if(welcome){st.money+=welcome.amt;st.life+=welcome.amt;st.lifeAll+=welcome.amt}
  function earn(v){st.money+=v;st.life+=v;st.lifeAll+=v;M.add(v)}
  function addFloat(s,px,py,col,size){floats.push({s,x:px,y:py,t:0,c:col,size:size||15})}
  function splash(px,py,n){for(let i=0;i<n;i++){const a=-Math.PI*Math.random(),v=1+Math.random()*2.5;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.14,t:0,l:600,c:i%2?'#ffffff':'#bfe6ff',r:2+Math.random()*2})}}
  const ROD={x:318,y:268};
  function cast(){if(welcome||banner&&banner.block)return;
    if(fs.state==='idle'){bob={x:420+Math.random()*150,y:372+Math.random()*60};fs={state:'cast',t:0};beep(500,.06,'triangle',.05)}
    else if(fs.state==='wait'){addFloat('Too early!',bob.x,bob.y-40,'#ffb0a0');fs.t=0;fs.wait=(.8+Math.random()*.6)*3.2/speed();beep(200,.06,'square',.04)}
    else if(fs.state==='bite')hook()}
  function hook(){fs={state:'reel',t:0};beep(700,.06,'square',.05)}
  function landFish(f,manual){const v=value(f);earn(v);st.caught++;const isNew=!st.dex[f.name];st.dex[f.name]=(st.dex[f.name]||0)+1;
    if(manual){pop={f,t:0,v,isNew};lastCatch={f,v};splash(bob.x,bob.y,14)}
    if(f.r===4){st.legends++;banner={s:'LEGENDARY! '+f.name,t:0};beep(1320,.3,'sine',.08);setTimeout(()=>beep(1760,.3,'sine',.08),180)}
    else if(manual)beep(880+f.r*120,.12,'sine',.06);
    if(isNew&&dexDone(st.loc))setTimeout(()=>{banner={s:L().name+' Fishdex complete! +25%',t:0}},600)}
  function buy(u){const cst=u.cost();if(st.money<cst)return;st.money-=cst;u.buy();beep(660,.06,'triangle',.07);beep(990,.08,'triangle',.06);save()}
  function travel(i){if(i===st.loc||LOCS[i].boat>st.boat)return;st.loc=i;fs={state:'idle',t:0};banner={s:LOCS[i].name,t:0};save()}
  function prestige(){const gain=pearlsFor(st.lifeAll)-st.pearls;if(gain<=0)return;if(!confirm){confirm=3000;return}
    const keep={pearls:st.pearls+gain,lifeAll:st.lifeAll,dex:st.dex,caught:st.caught,legends:st.legends};st=Object.assign(JSON.parse(JSON.stringify(DEF)),keep);fs={state:'idle',t:0};confirm=0;tab='shop';
    banner={s:'+'+gain+' Pearls',t:0};c.best(Math.floor(st.lifeAll));save();beep(1320,.3,'sine',.08)}
  function save(){st.rate=M.rate();TY.save(KEY,st)}

  const U=TY.ui(c,cv,W,H,p=>{if(p.x<SW)cast()});
  c.on(document,'keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();if(welcome){welcome=null;return}cast()}else if(/^[1-4]$/.test(e.key))tab=['shop','waters','dex','harbor'][+e.key-1]});

  /* ---------- drawing: fish ---------- */
  function fish(f,px,py,s,flip,dim){x.save();x.translate(px,py);x.scale((flip?-1:1)*s,s);const body=dim?'#2a3a4a':f.col,b2=dim?'#2a3a4a':f.col2,ol=dim?'#4a5a6a':INK;
    x.lineJoin='round';const p=f.pat;
    if(p==='squid'){x.fillStyle=body;x.beginPath();x.ellipse(-4,0,14,7,0,0,7);x.fill();x.lineWidth=1.6;x.strokeStyle=ol;x.stroke();x.strokeStyle=body;x.lineWidth=2.5;for(let i=0;i<5;i++){x.beginPath();x.moveTo(9,-3+i*1.5);x.quadraticCurveTo(18,-6+i*3+Math.sin(t/150+i)*2,24,-6+i*3);x.stroke()}x.fillStyle='#fff';x.beginPath();x.arc(6,-2,2.2,0,7);x.fill();x.fillStyle=INK;x.beginPath();x.arc(6.5,-2,1,0,7);x.fill();x.restore();return}
    if(p==='eel'){x.strokeStyle=body;x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(-18,0);x.bezierCurveTo(-8,-8,4,8,14,0);x.stroke();x.fillStyle=body;x.beginPath();x.moveTo(10,-6);x.lineTo(22,-2);x.lineTo(22,4);x.lineTo(10,6);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(14,-2,1.6,0,7);x.fill();x.restore();return}
    const rx=p==='round'?11:p==='flat'?15:14,ry=p==='round'?11:p==='flat'?5:7;
    x.fillStyle=body;x.beginPath();x.moveTo(-rx+2,0);x.lineTo(-rx-9,-7);x.lineTo(-rx-9,7);x.closePath();x.fill();x.lineWidth=1.6;x.strokeStyle=ol;x.stroke();
    x.beginPath();x.moveTo(-4,-ry+1);x.quadraticCurveTo(2,-ry-7,8,-ry+2);x.fill();x.stroke();
    x.beginPath();x.ellipse(0,0,rx,ry,0,0,7);x.fillStyle=body;x.fill();
    x.save();x.clip();x.fillStyle=b2;x.beginPath();x.ellipse(0,ry*.55,rx,ry*.55,0,0,7);x.fill();
    if(!dim){if(p==='stripes'){x.fillStyle='rgba(0,0,0,.28)';for(let i=-10;i<12;i+=5)x.fillRect(i,-ry,2,ry*1.4)}
      else if(p==='bands'){x.fillStyle='#ffffff';for(const bx of[-6,3])x.fillRect(bx,-ry,3.5,ry*2);if(f.col2==='#1D1A2F'){x.fillStyle=INK;x.fillRect(-2,-ry,4,ry*2)}}
      else if(p==='rainbow'){['#ff5a5a','#ffd23f','#5ae07a','#5ab0ff'].forEach((col,i)=>{x.fillStyle=col;x.fillRect(-12+i*6,-ry,5,ry*2)})}
      else if(p==='shine'){x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.ellipse(-2,-ry*.4,rx*.5,1.6,0,0,7);x.fill()}}
    x.restore();x.beginPath();x.ellipse(0,0,rx,ry,0,0,7);x.lineWidth=1.6;x.strokeStyle=ol;x.stroke();
    if(!dim){x.fillStyle='#fff';x.beginPath();x.arc(rx-5,-1.5,2.4,0,7);x.fill();x.fillStyle=INK;x.beginPath();x.arc(rx-4.5,-1.5,1.2,0,7);x.fill();
      if(p==='sword'){x.strokeStyle=b2;x.lineWidth=2;x.beginPath();x.moveTo(rx-1,1);x.lineTo(rx+14,0);x.stroke()}
      if(p==='spikes'){x.strokeStyle=ol;x.lineWidth=1.2;for(let i=0;i<10;i++){const a=i*Math.PI/5;x.beginPath();x.moveTo(Math.cos(a)*rx,Math.sin(a)*ry);x.lineTo(Math.cos(a)*(rx+3),Math.sin(a)*(ry+3));x.stroke()}}
      if(p==='lure'||p==='glow'){x.strokeStyle=ol;x.lineWidth=1.2;if(p==='lure'){x.beginPath();x.moveTo(rx-6,-ry);x.quadraticCurveTo(rx+2,-ry-10,rx+6,-ry-4);x.stroke()}x.globalAlpha=.5+.4*Math.sin(t/200);x.fillStyle='#bff4ff';x.beginPath();x.arc(p==='lure'?rx+6:0,p==='lure'?-ry-4:-ry*.2,p==='lure'?3:2,0,7);x.fill();x.globalAlpha=1}
      if(p==='fangs'){x.fillStyle='#fff';for(let i=0;i<3;i++){x.beginPath();x.moveTo(rx-6+i*2,2);x.lineTo(rx-5+i*2,5);x.lineTo(rx-4+i*2,2);x.fill()}}}
    x.restore()}

  /* ---------- drawing: scene ---------- */
  function scene(){const l=L(),g=x.createLinearGradient(0,0,0,HZ);g.addColorStop(0,l.sky[0]);g.addColorStop(1,l.sky[1]);x.fillStyle=g;x.fillRect(0,0,SW,HZ);
    x.fillStyle='rgba(255,246,200,.9)';x.beginPath();x.arc(100,64,26,0,7);x.fill();
    for(let i=0;i<4;i++){const cx=((i*200+t*.007*(1+i%2))%(SW+160))-80,cy=46+i*19%50;x.fillStyle='rgba(255,255,255,.85)';for(const[dx,dy,r]of[[0,0,14],[16,-7,18],[34,0,13]]){x.beginPath();x.arc(cx+dx,cy+dy,r,0,7);x.fill()}}
    // harbor town on the left horizon; buildings grow with the plant and market
    const town=[[16,'#e8604a'],[46,'#f2c14e'],[76,'#5ab0e0'],[106,'#f4f0e8']];town.forEach(([hx,col],i)=>{TY.box(x,hx,HZ-30-(i%2)*6,26,30+(i%2)*6,2,col,INK,1.5);x.fillStyle='#8a3a2a';x.beginPath();x.moveTo(hx-3,HZ-30-(i%2)*6);x.lineTo(hx+13,HZ-44-(i%2)*6);x.lineTo(hx+29,HZ-30-(i%2)*6);x.closePath();x.fill();x.lineWidth=1.5;x.strokeStyle=INK;x.stroke();x.fillStyle='#ffe9a0';x.fillRect(hx+9,HZ-18,8,8)});
    if(st.market){TY.box(x,140,HZ-22,34,22,2,'#fffdf6',INK,1.5);for(let i=0;i<4;i++){x.fillStyle=i%2?'#d64933':'#fff';x.fillRect(138+i*9.5,HZ-30,9.5,8)}}
    if(st.plant){TY.box(x,182,HZ-40,50,40,2,'#9aa4ae',INK,1.5);TY.box(x,220,HZ-62,8,22,1,'#6a6a72',INK,1.5);for(let i=0;i<3;i++){x.globalAlpha=.4-i*.1;x.fillStyle='#e8e8e8';x.beginPath();x.arc(224+Math.sin(t/500+i)*3,HZ-68-i*10-(t/50%10),4+i*2,0,7);x.fill()}x.globalAlpha=1;TY.txt(x,'CANNERY',207,HZ-22,8,'#fff');if(st.plant>2){TY.box(x,238,HZ-28,30,28,2,'#7a8a9a',INK,1.5)}}
    x.fillStyle='#8a6a48';x.fillRect(0,HZ-4,150,6);
    // island + lighthouse

  function update(dt){const s=dt/1000;t+=dt;if(confirm)confirm=Math.max(0,confirm-dt);fs.t+=s;

    else if(fs.state==='cast'&&fs.t>=.45){fs={state:'wait',t:0,wait:(.7+Math.random()*.6)*3.2/speed()};splash(bob.x,bob.y,8);beep(300,.05,'sine',.04)}
    else if(fs.state==='wait'&&fs.t>=fs.wait){fs={state:'bite',t:0,win:Math.min(1.7,1.1+.05*(st.rod-1))};splash(bob.x,bob.y,10);beep(1000,.07,'square',.05)}
    else if(fs.state==='bite'){if(auto&&fs.t>.25)hook();else if(fs.t>=fs.win){fs={state:'idle',t:0};addFloat('It got away…',bob.x,bob.y-40,'#ffb0a0');beep(160,.15,'triangle',.05)}}
    else if(fs.state==='reel'&&fs.t>=.6){landFish(roll(luck()),true);fs={state:'idle',t:0}}

    if(st.net){netAcc+=st.net*.35*s;while(netAcc>=1){netAcc--;const fsh=L().fish.filter(f=>f.r<=1);const f=fsh[Math.floor(Math.random()*fsh.length)];earn(value(f));st.caught++;st.dex[f.name]=(st.dex[f.name]||0)+1}}
    for(const p of parts){p.t+=dt;p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=p.g*dt/16}parts=parts.filter(p=>p.t<p.l);
    for(const f of floats){f.t+=dt;f.y-=dt*.04}floats=floats.filter(f=>f.t<1200);
    if(pop){pop.t+=s;if(pop.t>2.2)pop=null}

    if(lastCatch){TY.box(x,12,H-62,190,50,12,'rgba(15,26,38,.85)');fish(lastCatch.f,44,H-37,1.3,false,false);TY.txt(x,lastCatch.f.name,70,H-46,13,'#fff','left');TY.txt(x,TY.money(lastCatch.v),70,H-27,13,RAR[lastCatch.f.r].col,'left')}

    const hint=fs.state==='idle'&&!(st.auto&&st.autoOn)?'Tap the water to cast':fs.state==='wait'?'Wait for a bite…':fs.state==='bite'&&!(st.auto&&st.autoOn)?'TAP NOW!':'';
    if(hint&&st.caught<15||fs.state==='bite'&&!(st.auto&&st.autoOn)){x.globalAlpha=fs.state==='bite'?1:.7+.3*Math.sin(t/220);TY.box(x,SW/2-100,HZ+18,200,30,15,'rgba(15,26,38,.85)');TY.txt(x,hint,SW/2,HZ+33,14,fs.state==='bite'?'#ffd23f':'#fff');x.globalAlpha=1}
    if(banner){const k=Math.min(1,banner.t/300)*Math.min(1,(2600-banner.t)/300);x.globalAlpha=k;TY.box(x,SW/2-200,150,400,64,16,'rgba(15,26,38,.9)','#ffd23f',2);TY.title(x,banner.s,SW/2,182,22,'#ffd23f');x.globalAlpha=1}
    x.restore();panel();
    if(welcome){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);TY.box(x,W/2-200,H/2-110,400,220,18,'#0f1a26','#2f86c8',2);TY.title(x,'Welcome back!',W/2,H/2-66,30,'#ffd23f');
      TY.txt(x,'Your crew kept fishing for '+TY.dur(welcome.secs)+'.',W/2,H/2-24,15,'#e8f0f8','center','600 ');TY.coin(x,W/2-70,H/2+14,13);TY.txt(x,'+'+TY.money(welcome.amt),W/2+10,H/2+14,24,'#7fd4a0');
      TY.box(x,W/2-80,H/2+48,160,42,10,'#34c25a');TY.txt(x,'Collect',W/2,H/2+70,17,'#fff');U.btn(W/2-80,H/2+48,160,42,()=>{welcome=null;beep(880,.1,'sine',.06)})}}

  c.loop(dt=>{update(dt);draw()});
  return()=>save()}});
</script>
