const TC_CSS = `
:host{--ink:#1D1A2F;--paper:#FFFDF6;--sun:#FFD23F;--coral:#F2352A;--sea:#2f86c8;--mint:#3fd0a0;--dim:#6b6680;
--f-d:"Bagel Fat One",Impact,system-ui,sans-serif;--f-b:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
--r0:#d9d6cf;--r1:#5fd36a;--r2:#4aa8ff;--r3:#c768ff;--r4:#ffb21f;--r5:#ff4d6d;color-scheme:light}
[hidden]{display:none!important}
#game{position:absolute;inset:0;overflow:hidden;background:#7ec4ec;color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.25;text-align:left;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;container-type:size;container-name:tc}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;margin:0;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;display:block}
.plate{background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:7px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.btn:hover{background:#fff6d2}

.btn.pri{background:var(--sun)}
.btn.pri:hover{background:#ffdf6b}
.btn.go{background:var(--mint)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .pe{pointer-events:auto}
#tl{position:absolute;left:12px;top:12px;padding:8px 12px 9px;min-width:150px}
#money{font-family:var(--f-d);font-size:26px;line-height:1;color:var(--ink);letter-spacing:.5px}
#loc{font-weight:800;font-size:13px;margin-top:5px;color:#2b5d86}
#clock{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:4px;color:var(--dim)}
#clock svg{width:18px;height:18px}
#tr{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}

#prompt{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;font-weight:800;font-size:15px;white-space:nowrap}

#hint{position:absolute;left:50%;bottom:134px;transform:translateX(-50%);max-width:min(560px,90%);text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.5);transition:opacity .3s}

#powerFill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--mint)}

#shake{position:absolute;inset:0}

#shakeBtn:active{box-shadow:1px 1px 0 var(--ink)}
#shakeInfo{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 0 var(--ink)}
#shakeTime{width:200px;height:10px;margin:6px auto 0;background:rgba(255,255,255,.5);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
#shakeTime i{display:block;height:100%;background:var(--coral);width:100%}
#reel{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:min(560px,86%);padding:10px 12px 10px}
#reelTop{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;margin-bottom:6px;gap:8px}
#reelName{font-family:var(--f-d);font-weight:400;font-size:18px}
#reelBar{position:relative;height:38px;background:#1f5f8f;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
#reelBar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.08) 38px 40px)}
#reelZone{position:absolute;top:2px;bottom:2px;left:0;width:20%;background:rgba(255,253,246,.85);border:2px solid #fff;border-radius:5px}
#reelZone.hit{background:rgba(95,211,106,.9)}
#reelFish{position:absolute;top:50%;left:0;width:44px;height:30px;transform:translate(-50%,-50%)}
#reelFish canvas{width:44px;height:30px;display:block}
#reelProg{margin-top:7px;height:14px;background:#e9e4d6;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
#reelProgFill{height:100%;width:30%;background:var(--mint)}
#reelTip{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--dim);text-align:center}
#catch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,86%);padding:14px 16px 14px;text-align:center;pointer-events:auto;animation:cin .3s cubic-bezier(.2,1.4,.5,1)}
@keyframes cin{from{transform:translate(-50%,-40%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#catch canvas{width:100%;height:auto;display:block;margin:2px 0 4px}
#catch .rar{display:inline-block;padding:2px 10px;border:2px solid var(--ink);border-radius:6px;font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase}
#catch h3{margin:6px 0 2px;font-family:var(--f-d);font-weight:400;font-size:26px;line-height:1.05}
#catch .row{display:flex;justify-content:center;gap:14px;font-weight:800;font-size:15px;margin-top:4px}
#catch .new{position:absolute;right:-10px;top:-12px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:2px 9px;font-family:var(--f-d);font-size:16px;transform:rotate(8deg)}
#catch .var{color:#b06d00;font-weight:900}
#catch small{display:block;margin-top:6px;font-size:12px;color:var(--dim);font-weight:700}
#panel{position:absolute;inset:0;background:rgba(19,30,48,.45);display:grid;place-items:center;padding:12px}
.pcard{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.pcard header{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 16px;border-bottom:3px solid var(--ink);background:var(--sun)}

#pClose{width:36px;height:36px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:9px}

.say{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-weight:700}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:5px 10px;border:3px solid var(--ink);border-radius:9px;background:var(--paper);font-weight:800;font-size:13px}
.tab.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px}
.fc{position:relative;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:6px 6px 7px;text-align:center;font-size:12px;font-weight:700}
.fc canvas{width:100%;height:auto;display:block}
.fc .nm{font-weight:900;font-size:13px;line-height:1.1;margin-top:2px}
.fc .meta{color:var(--dim);margin-top:2px}
.fc .bar{position:absolute;left:0;right:0;top:0;height:6px;border-radius:6px 6px 0 0}

.rods{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}

.rc h4{margin:0;font-family:var(--f-d);font-weight:400;font-size:18px;display:flex;align-items:center;gap:8px}

.rc .d{font-size:12px;color:var(--dim);font-weight:700;margin:3px 0 6px;min-height:30px}
.st{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:6px;font-size:12px;font-weight:800;margin:3px 0}
.st .b{height:9px;background:#ece8dc;border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.st .b i{display:block;height:100%;background:var(--sea)}
.st .v{text-align:right;color:var(--dim)}
.rc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.rc .pr{font-family:var(--f-d);font-size:17px}
.rc .where{font-size:12px;font-weight:800;color:var(--dim)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px}
.li svg.big{width:40px;height:40px;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px}
.li .tx small{display:block;color:var(--dim);font-weight:700;font-size:12px}
.li .ow{font-weight:800;font-size:12px;color:var(--dim);white-space:nowrap}
.li.on{background:#fff7d4}
.prog{height:12px;background:#ece8dc;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--mint)}
.sumrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-weight:800}
#bigmap{width:100%;max-width:min(100%,calc(100cqh - 150px));height:auto;display:block;margin:0 auto;border:3px solid var(--ink);border-radius:10px}
#intro{position:absolute;inset:0;display:grid;place-items:center;background:rgba(19,30,48,.35);padding:12px}

.c0{color:#77736a}.c1{color:#2e9a3a}.c2{color:#1f72c9}.c3{color:#9a37d6}.c4{color:#c77d00}.c5{color:#e0244a}

    el.powerFill.style.background = FS.pow > .88 ? '#FFD23F' : '#3fd0a0';
    faceCamera();
  } else el.power.hidden = true;
  if (st === 'fly') {
    const t = Math.min(1, FS.t / FS.dur);
    FS.bx = lerp(FS.sx, FS.tx, t); FS.bz = lerp(FS.sz, FS.tz, t); FS.by = lerp(FS.sy, 0, t) + Math.sin(Math.PI * t) * FS.arc;
    if (t >= 1) { FS.reelD = Math.hypot(FS.tx - (P.inBoat ? boat.x : P.x), FS.tz - (P.inBoat ? boat.z : P.z)); bobberLand(); }
  } else if (st === 'wait') {
    if (!FS.onLand) {
      FS.by = WAVE(FS.bx, FS.bz, clock) * waveAmp(FS.bx, FS.bz) + .02;
      FS.nib -= dt; if (FS.nib <= 0 && FS.t < FS.wait - 1) { FS.nib = rnd(1.8, 4); FS.jig = .12; sfx.nibble(); emit(FS.bx, .05, FS.bz, 3, .8, 1.5, '#ffffff', 10, .4); }
      if (FS.t >= FS.wait) bite();
    }
  } else if (st === 'shake') {
    FS.by = WAVE(FS.bx, FS.bz, clock) * waveAmp(FS.bx, FS.bz) - .25 + Math.sin(FS.t * 30) * .05;
    FS.shT -= dt; el.shakeTime.style.width = clamp(FS.shT / FS.shMax * 100, 0, 100) + '%';
    bang.position.y = 1.7 + Math.sin(FS.t * 8) * .1;
    if (FS.shT <= 0) escape('It got away before you hooked it!');
  } else if (st === 'reel') {
    FS.by = WAVE(FS.bx, FS.bz, clock) * waveAmp(FS.bx, FS.bz) - .15;
    reelTick(dt);
  } else if (st === 'back') {
    rodTipPos(tmpV);
    const k = Math.min(1, dt * 7);
    FS.bx = lerp(FS.bx, tmpV.x, k); FS.by = lerp(FS.by, tmpV.y, k); FS.bz = lerp(FS.bz, tmpV.z, k);
    if (FS.t > .4) { FS.st = 'idle'; bobber.visible = false; fishLine.visible = false; }
  } else if (st === 'land') {
    if (FS.t > 1.8) { FS.st = 'idle'; heldFish.visible = false; }
  }
  if (FS.jig > 0) FS.jig -= dt;
  if (bobber.visible) bobber.position.set(FS.bx, FS.by - (FS.jig > 0 ? .12 : 0), FS.bz);

  if (catchT > 0) { catchT -= dt; if (catchT <= 0) el.catchC.hidden = true; }
}
function updateLine() {
  rodTipPos(tmpV);
  const ax = tmpV.x, ay = tmpV.y, az = tmpV.z, bx = FS.bx, by = FS.by + .12, bz = FS.bz;
  const tight = FS.st === 'reel' || FS.st === 'shake' ? .15 : FS.st === 'fly' ? .05 : 1;
  const sag = tight * Math.min(2.5, Math.hypot(bx - ax, bz - az) * .12);
  const mx = (ax + bx) / 2, my = Math.min(ay, by) + (Math.abs(ay - by) * .3) - sag, mz = (az + bz) / 2;
  for (let i = 0; i < LINE_N; i++) {
    const t = i / (LINE_N - 1), u = 1 - t;
    linePos[i * 3] = u * u * ax + 2 * u * t * mx + t * t * bx;
    linePos[i * 3 + 1] = u * u * ay + 2 * u * t * my + t * t * by;
    linePos[i * 3 + 2] = u * u * az + 2 * u * t * mz + t * t * bz;
  }
  lineGeo.attributes.position.needsUpdate = true;
}

const ZVAL = [25, 32, 70, 120, 210, 330, 60];
const r5 = n => Math.max(5, Math.round(n / 5) * 5);
function genBounty() {
  const zs = Object.keys(S.visited).map(Number).filter(z => z >= 0 && z < 7);
  const have = S.bounties.map(b => b.t + (b.f != null ? b.f : '') + (b.z != null ? b.z : ''));
  for (let tries = 0; tries < 30; tries++) {
    const z = zs[rndi(zs.length)], t = Math.random();
    let b;
    if (t < .45) { const pool = BY_ZONE[z].filter(f => f.r <= 2 && !f.cond); if (!pool.length) continue; const f = pool[rndi(pool.length)]; const n = f.r === 2 ? 1 : f.r === 1 ? 2 : 3; b = { t: 'sp', f: f.i, n, p: 0, r: r5(f.val * n * 2 + 20) }; }
    else if (t < .65) { const rr = Math.min(2, 1 + rndi(2)); b = { t: 'rz', z, rr, n: 1, p: 0, r: r5(ZVAL[z] * (rr === 2 ? 5 : 2.2) + 30) }; }
    else if (t < .82) { const mw = Math.round(clamp(ROD(S.rod).maxw * rnd(.25, .5), 2, 900)); b = { t: 'wt', w: mw, n: 1, p: 0, r: r5(mw * 3.5 + 40) }; }
    else { const n = 4 + rndi(4); b = { t: 'zn', z, n, p: 0, r: r5(ZVAL[z] * n * .9) }; }
    const key = b.t + (b.f != null ? b.f : '') + (b.z != null ? b.z : '');
    if (have.includes(key)) continue;
    return b;
  }
  return { t: 'zn', z: 0, n: 5, p: 0, r: 150 };
}
function bountyText(b) {
  if (b.t === 'sp') return 'Catch ' + b.n + ' ' + FISH[b.f].n + (b.n > 1 ? 's' : '') + ' (' + ZONES[FISH[b.f].z].n + ')';
  if (b.t === 'rz') return 'Catch a ' + RAR[b.rr].n + ' or better fish at ' + ZONES[b.z].n;
  if (b.t === 'wt') return 'Catch a fish heavier than ' + b.w + ' kg';
  return 'Catch ' + b.n + ' fish at ' + ZONES[b.z].n;
}
function fillBounties() { while (S.bounties.length < 3) S.bounties.push(genBounty()); }
function checkBounties(it, zone) {
  const f = FISH[it.f];
  S.bounties.forEach((b, i) => {
    let hit = false;
    if (b.t === 'sp') hit = it.f === b.f;
    else if (b.t === 'rz') hit = zone === b.z && f.r >= b.rr;
    else if (b.t === 'wt') hit = it.w > b.w;
    else hit = zone === b.z;
    if (!hit) return;
    b.p++;
    if (b.p >= b.n) {
      S.money += b.r; S.earned += b.r; reportBest();
      setTimeout(() => { if (alive) { toast('Bounty done! +' + money(b.r), 'gold'); sfx.coin(); } }, 900);
      S.bounties[i] = genBounty();
    }
  });
}
