  const s=A.createBufferSource();s.buffer=noiseBuf;const bq=A.createBiquadFilter();bq.type=type||'lowpass';bq.frequency.value=f;const g=A.createGain(),t=A.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bq);bq.connect(g);g.connect(A.destination);s.start(t);s.stop(t+d+.02)}catch(e){}}

  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(P,3));g.setAttribute('normal',new T.BufferAttribute(N,3));g.setAttribute('color',new T.BufferAttribute(C,3));g.computeBoundingSphere();return g}

  genD=40;openPrev=[1,1,1];nextItem=180+Math.random()*120;for(const k in runStat)runStat[k]=0;
  for(const m of save.ms)if(MDEF[m.id].run&&!m.done)m.p=0;
  P.pivot.rotation.set(0,0,0);P.root.rotation.set(0,0,0);P.body.rotation.set(0,0,0);setPowerVis();

/* ---------------- level generation ---------------- */
function covered(l,a,b){for(const iv of occ[l])if(iv[0]<b&&iv[1]>a)return true;return false}
function trainAllowed(l,a,b){let n=0;for(let k=0;k<3;k++)if(k!==l&&covered(k,a,b))n++;return n<2}
function addTrain(l,d0,cars,moving,v){const len=cars*CARL+(cars-1)*CARGAP;const so={kind:'train',lane:l,d0,d1:d0+len,pd0:d0,v:moving?v:0,cars:[],passed:false,roofed:false,horn:false};
  const mats=moving?moverMats:liveryMats[Math.floor(Math.random()*liveryMats.length)];
  for(let i=0;i<cars;i++){const cg=getCar();cg.userData.body.material=mats;cg.userData.off=i*(CARL+CARGAP)+CARL/2;cg.position.set(laneX(l),0,-(d0+cg.userData.off));cg.rotation.y=0;so.cars.push(cg)}solids.push(so);return so}
function addRamp(l,d0){const m=getP('ramp');m.position.set(laneX(l),0,-d0);solids.push({kind:'ramp',lane:l,d0,d1:d0+RAMPL,pd0:d0,v:0,mesh:m})}
function addSmall(kind,l,d){const m=getP(kind);m.position.set(laneX(l),0,-d);smalls.push({kind,lane:l,d,mesh:m,hit:false})}
function coinLine(l,d0,n,yy){for(let k=0;k<n;k++)addCoin(d0+k*2.1,laneX(l),yy==null?.75:yy)}
function genBlock(D){
  const diff=Math.min(1,runT/150+p/9000);const sp=Math.max(s,13);const B=Math.max(13,sp*.82);
  const free=[0,1,2].map(l=>busy[l]<=D);
  const plan=[null,null,null];
  const breather=Math.random()<(.1-diff*.05);
  if(!breather){
    const order=[0,1,2].sort(()=>Math.random()-.5);
    for(const l of order){if(!free[l])continue;const r=Math.random();
      const wN=.26-diff*.08,wH=.17,wG=.15,wT=.2+diff*.08,wR=.12,wM=.03+diff*.11;const tot=wN+wH+wG+wT+wR+wM;let v=r*tot;
      plan[l]=(v-=wN)<0?'none':(v-=wH)<0?'hurdle':(v-=wG)<0?'gate':(v-=wT)<0?'train':(v-=wR)<0?'ramp':'mover'}
  }else for(let l=0;l<3;l++)if(free[l])plan[l]='none';
  const isOpen=k=>k==='none'||k==='hurdle'||k==='gate';
  // at least one open lane, and it must connect to last block's open lanes
  const open=()=>[0,1,2].filter(l=>free[l]&&isOpen(plan[l]));
  const linked=()=>open().some(l=>[0,1,2].some(m=>openPrev[m]&&Math.abs(l-m)<=1));
  if(!open().length||!linked()){const cand=[1,0,2].filter(l=>free[l]&&[0,1,2].some(m=>openPrev[m]&&Math.abs(l-m)<=1));if(cand.length)plan[cand[0]]=Math.random()<.5?'none':(Math.random()<.5?'hurdle':'gate');else{for(let l=0;l<3;l++)if(free[l]){plan[l]='none';break}}}
  // never both side lanes hurdled/gated with middle closed when it would demand two moves in one beat: fine as is
  const off=2+Math.random()*2;let coinDone=false;
  for(let l=0;l<3;l++){const k=plan[l];if(!k||k==='none')continue;const d0=D+off;
    if(k==='hurdle'||k==='gate'){addSmall(k,l,d0+Math.random()*3);continue}
    const cars=1+Math.floor(Math.random()*(1.6+diff*1.6));
    if(k==='train'||k==='ramp'){const td=k==='ramp'?d0+RAMPL:d0;const len=cars*CARL+(cars-1)*CARGAP;
      if(!trainAllowed(l,d0,td+len)){addSmall(Math.random()<.5?'hurdle':'gate',l,d0+1);plan[l]='hurdle';continue}
      if(k==='ramp')addRamp(l,d0);addTrain(l,td,cars,false,0);occ[l].push([d0,td+len]);busy[l]=td+len+Math.max(7,sp*.5);
      if(k==='ramp'&&!coinDone&&Math.random()<.8){coinDone=true;for(let j=0;j<4;j++)addCoin(d0+1+j*1.8,laneX(l),.75+(j*1.8+1)/RAMPL*TOP);coinLine(l,td+1,Math.floor((len-2)/2.1),TOP+.75)}
      else if(k==='train'&&!coinDone&&Math.random()<.25){coinDone=true;coinLine(l,td+1,Math.floor((len-2)/2.1),TOP+.75)}
      continue}
    if(k==='mover'){const v=7+diff*9;const meetD=D+off;const front=meetD+v*Math.max(0,(meetD-p))/sp;const c2=Math.min(cars,2);const len=c2*CARL+(c2-1)*CARGAP;
      if(!trainAllowed(l,meetD,front+len+4)){plan[l]='none';continue}
      addTrain(l,front,c2,true,v);occ[l].push([meetD-2,front+len+4]);busy[l]=front+len+Math.max(8,sp*.5)}}
  // coins in an open lane
  if(!coinDone&&Math.random()<.78){const ol=[0,1,2].filter(l=>free[l]&&isOpen(plan[l]));if(ol.length){const l=ol[Math.floor(Math.random()*ol.length)];const sm=smalls.find(q2=>q2.lane===l&&q2.d>=D)||null;
    if(plan[l]==='hurdle'&&sm&&sm.lane===l&&sm.d>=D){const air=JUMPV/GRAV*2*sp;for(let k=-3;k<=3;k++){const dd=k*air/7;const u=dd/(air/2);addCoin(sm.d+dd,laneX(l),.75+Math.max(0,1.85*(1-u*u)))}}
    else if(plan[l]==='gate'&&sm&&sm.lane===l&&sm.d>=D){coinLine(l,sm.d-4.2,5,.5)}
    else coinLine(l,D+off,Math.floor(B/2.1),.75)}}
  // power-up
  if(D>nextItem){const ol=[0,1,2].filter(l=>free[l]&&plan[l]==='none');if(ol.length){const l=ol[Math.floor(Math.random()*ol.length)];const r=Math.random();
      const type=r<.3?'magnet':r<.52?'mult':r<.75?'board':'jet';const m=itemMeshes[type];if(!m.visible&&!items.some(it=>it.type===type)){m.visible=true;const d=D+B*.6;
        for(const cn of coins)if(cn.on&&Math.abs(cn.d-d)<1.6&&Math.abs(cn.x-laneX(l))<.5)cn.on=false;
        items.push({type,d,x:laneX(l),y:1.05,mesh:m});m.position.set(laneX(l),1.05,-d)}nextItem=D+230+Math.random()*200}}
  openPrev=[0,1,2].map(l=>free[l]&&isOpen(plan[l])?1:0);
  for(let l=0;l<3;l++)occ[l]=occ[l].filter(iv=>iv[1]>p-30);
  return B}
function generate(){while(genD<p+165){const B=genBlock(genD);genD+=B}}

/* ---------------- missions ---------------- */
let toastT=0;function toast(a,b){ui.toast.innerHTML=a+(b?'<small>'+b+'</small>':'');ui.toast.classList.add('on');toastT=1.5}
function ev(id,n,abs){for(const m of save.ms){if(m.done)continue;let hit=false;
    if(m.id===id){hit=true}else if(id==='coin'&&(m.id==='coins'||m.id==='coins_run'))hit=true;else if(id==='lane'&&m.id==='lane_run')hit=true;else if(id==='score'&&m.id==='score_run')hit=true;else if(id==='dist'&&m.id==='dist_run')hit=true;
    if(!hit)continue;if(abs!=null)m.p=Math.max(m.p,abs);else m.p+=n;
    if(m.p>=m.n){m.p=m.n;m.done=true;SFX.mission();toast('Mission done!',MDEF[m.id].txt(m.n));if(save.ms.every(q2=>q2.done))setDone()}}}
function setDone(){save.mset++;const bonus=100*save.mset;save.coins+=bonus;newMissions();persist();setTimeout(()=>{if(state==='run'){toast('Score x'+baseMult()+'!','All three missions done. +'+bonus+' coins')}},1600);updMult()}
function misRows(el,small){el.innerHTML='';for(const m of save.ms){const d=document.createElement('div');d.className='mis'+(m.done?' done':'');const pc=Math.min(100,m.p/m.n*100);
    d.innerHTML='<div class="ck">'+(m.done?I.check:'')+'</div><div class="tx">'+MDEF[m.id].txt(m.n)+'<div class="prog"><i style="width:'+pc+'%"></i></div></div><b style="font-size:13px">'+Math.floor(m.p)+'/'+m.n+'</b>';el.append(d)}
  if(!small){const n=document.createElement('div');n.className='note';n.textContent='Finish all three to raise your score multiplier to x'+(baseMult()+1)+' and earn '+(100*(save.mset+1))+' bonus coins. Missions that say "in one run" have to be done in a single run.';el.append(n)}}

/* ---------------- input ---------------- */
function act(d){
  if(state==='menu'){if(d==='up'||d==='go')startRun();return}
  if(state==='over'){if(d==='go')startRun();return}
  if(state!=='run')return;
  if(d==='left'||d==='right'){const nl=Math.max(0,Math.min(2,lane+(d==='left'?-1:1)));if(nl!==lane){prevLane=lane;lane=nl;SFX.lane();ev('lane',1);runStat.lanes++}else{shake=Math.max(shake,.12)}}
  else if(d==='up'){if(jetT>0)return;if(grounded||(y-groundAt(p,x,y)<.25&&vy<=0)){vy=JUMPV;grounded=false;rollT=0;SFX.jump();ev('jump',1)}}
  else if(d==='down'){if(jetT>0)return;if(rollT<=0){ev('roll',1);SFX.roll()}rollT=.62;if(!grounded)vy=Math.min(vy,-24)}
  else if(d==='board')useBoard()}
c.on(document,'keydown',e=>{const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;const k=e.key.toLowerCase();
  const map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',' ':'up',arrowdown:'down',s:'down',b:'board'};
  if(k==='escape'||k==='p'){if(state==='run'){pauseGame();e.preventDefault()}else if(state==='paused'){resumeGame();e.preventDefault()}return}
  if(k==='enter'&&(state==='menu'||state==='over')&&!shadowOpen()){act('go');e.preventDefault();return}
  if(map[k]){if(e.repeat&&(map[k]==='left'||map[k]==='right'))return;if(state==='menu'&&shadowOpen())return;if(state==='run'||state==='menu'){act(map[k]);e.preventDefault()}else if(['arrowup','arrowdown',' '].includes(k)&&state!=='over')e.preventDefault()}});
const shadowOpen=()=>!ui.shop.hidden||!ui.mis.hidden;
let sw=null;
c.on(cvs,'pointerdown',e=>{sw={x:e.clientX,y:e.clientY,t:performance.now(),used:false,id:e.pointerId};try{cvs.setPointerCapture(e.pointerId)}catch(_){}cvs.focus({preventScroll:true})});
c.on(cvs,'pointermove',e=>{if(!sw||sw.used||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,th=Math.max(22,Math.min(40,host.clientWidth*.04));if(Math.abs(dx)<th&&Math.abs(dy)<th)return;sw.used=true;act(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'))});
c.on(cvs,'pointerup',e=>{if(!sw||e.pointerId!==sw.id)return;const was=sw;sw=null;if(was.used)return;const now=performance.now();if(state==='run'){if(now-lastTap<320){act('board');lastTap=0}else lastTap=now}});
c.on(cvs,'pointercancel',()=>{sw=null});

/* ---------------- collisions and physics ---------------- */
function surf(so,pp){if(so.kind==='ramp')return Math.max(0,Math.min(TOP,(pp-so.d0)/RAMPL*TOP));return TOP}
function groundAt(pp,xx,yy){const l=Math.max(0,Math.min(2,Math.round(xx/LW)+1));let g=0;for(const so of solids){if(so.lane!==l||pp<so.d0-.05||pp>so.d1+.05)continue;const t=surf(so,pp);if(yy>=t-.6&&t>g)g=t}return g}
function crash(quit){if(state!=='run')return;state='crash';crashT=0;shake=quit?0:.6;slowmo=quit?1:.35;if(!quit){SFX.crash();burst(x,y+1,-p,22,0xffffff,5,3);burst(x,y+1,-p,10,0xffd23f,4,3);ui.flash.style.opacity=1;setTimeout(()=>ui.flash.style.opacity=0,260)}
  ui.board.hidden=true;finishRun(quit)}
function hitSomething(){if(invT>0)return false;if(boardT>0){boardT=0;invT=1.6;SFX.shield();burst(x,y+.3,-p,18,BOARDS.find(b=>b.id===save.board).a,5,3);shake=.3;setPowerVis();updBoardBtn();toast('Board saved you!');return false}crash();return true}
function bump(){prevLane=lane;SFX.bump();shake=.35;stumbleT=.5;burst(x,y+1,-p,8,0xdddddd,3,2)}
function physics(dt){
  runT+=dt;const target=baseSpeed(runT)*(jetT>0?1.12:1);s+=(target-s)*Math.min(1,dt*2);
  const pp=p;p+=s*dt;
  const tx=laneX(lane);x+=(tx-x)*Math.min(1,dt*15);
  for(const so of solids){so.pd0=so.d0;if(so.v){so.d0-=so.v*dt;so.d1-=so.v*dt;for(const cg of so.cars)cg.position.z=-(so.d0+cg.userData.off)}}
  // vertical
  if(jetT>0){jetT-=dt;y+=(JET_Y-y)*Math.min(1,dt*3.2);vy=0;grounded=false;if(jetT<=0){jetT=0;invT=Math.max(invT,1.3);setPowerVis();toast('Landing!')}}
  else{const wasG=grounded;vy-=GRAV*dt;y+=vy*dt;const gnd=groundAt(p,x,y);if(y<=gnd){if(!wasG&&vy<-6){landSq=1;SFX.land();if(gnd>=TOP-.05){ev('roof',1);if(!onRoof)burst(x,gnd,-p,6,0xcccccc,2,1)}}y=gnd;vy=0;grounded=true;onRoof=gnd>=TOP-.05}else{grounded=y-gnd<.02;if(!grounded&&vy<0&&y-gnd<.08){y=gnd;vy=0;grounded=true}}}
  if(rollT>0)rollT-=dt;if(invT>0)invT-=dt;if(stumbleT>0)stumbleT-=dt;
  if(magT>0){magT-=dt;if(magT<=0){magT=0;setPowerVis()}}if(multT>0){multT-=dt;if(multT<=0){multT=0;updMult()}}if(boardT>0){boardT-=dt;if(boardT<=0){boardT=0;setPowerVis();updBoardBtn()}}
  // obstacles
  if(jetT<=0&&invT<=0){
    for(const so of solids){if(p<so.d0-.4||p>so.d1+.4)continue;const sx=laneX(so.lane);if(Math.abs(x-sx)>1.38)continue;const t=surf(so,p);if(y>=t-.6)continue;
      const front=so.kind==='train'&&pp+.4<=so.pd0&&Math.abs(x-sx)<1.0;
      if(front){if(boardT>0){boardT=0;invT=1;y=TOP+.05;vy=7;grounded=false;SFX.shield();shake=.3;burst(x,y,-p,18,(BOARDS.find(b=>b.id===save.board)||BOARDS[0]).a,5,3);setPowerVis();updBoardBtn();toast('Board saved you!');break}if(hitSomething())return;continue}
      // side swipe: bounce back to the lane we came from
      const back=prevLane!==so.lane?prevLane:(x<sx?Math.max(0,so.lane-1):Math.min(2,so.lane+1));lane=back;x+=(laneX(back)-x)*.35;bump();break}
    for(const sm of smalls){if(sm.hit||Math.abs(p-sm.d)>.45)continue;if(Math.abs(x-laneX(sm.lane))>1.25)continue;
      if(sm.kind==='hurdle'&&y<.98){sm.hit=true;if(hitSomething())return}
      else if(sm.kind==='gate'&&rollT<=0&&y<2.5){sm.hit=true;if(hitSomething())return}}}
  // moving trains passing by
  for(const so of solids)if(so.v&&!so.passed&&so.d1<p){so.passed=true;ev('dodge',1);if(Math.abs(laneX(so.lane)-x)<3){score+=50*baseMult();toast('Close call!','+'+50*baseMult())}}
  for(const so of solids)if(so.v&&!so.horn&&so.d0-p<55&&so.d0>p){so.horn=true;SFX.horn()}
  // coins
  const reach=boardT>0?1.25:.95;
  for(const cn of coins){if(!cn.on)continue;const dd=cn.d-p;if(dd<-4){cn.on=false;continue}
    if(magT>0&&!cn.mag&&dd<16&&dd>-1)cn.mag=true;
    if(cn.mag){const k=Math.min(1,dt*11);cn.d+=(p+.2-cn.d)*k+s*dt*.5;cn.x+=(x-cn.x)*k;cn.y+=(y+1-cn.y)*k}
    if(Math.abs(cn.d-p)<reach&&Math.abs(cn.x-x)<reach&&Math.abs(cn.y-(y+.9))<1.25){cn.on=false;getCoin(cn)}}
  // items
  for(let i=items.length-1;i>=0;i--){const it=items[i];if(it.d<p-4){it.mesh.visible=false;items.splice(i,1);continue}if(Math.abs(it.d-p)<1.1&&Math.abs(it.x-x)<1.1&&Math.abs(it.y-(y+.9))<1.5){it.mesh.visible=false;items.splice(i,1);burst(it.x,it.y,-it.d,14,0xfff2b0,4,2);grab(it.type)}}
  // jetpack sky coins
  if(jetT>0){while(skyD<p+70&&skyD<p+s*Math.max(0,jetT-.8)){if(Math.random()<.06)skyLane=Math.max(0,Math.min(2,skyLane+(Math.random()<.5?-1:1)));addCoin(skyD,laneX(skyLane),JET_Y+.4);skyD+=2.1}}
  // scoring
  const mult=baseMult()*(multT>0?2:1);score+=s*dt*mult;runStat.dist=p;
  if(coinChainT>0){coinChainT-=dt;if(coinChainT<=0)coinChain=0}
  generate();recycle()}
function getCoin(cn){runCoins++;coinChain++;coinChainT=.6;SFX.coin(coinChain);score+=5*baseMult()*(multT>0?2:1);ev('coin',1);ui.coins.textContent=runCoins;if(!LOW||coinChain%2)burst(cn.x,cn.y,-cn.d,3,0xffe27a,2.2,1.5)}
function recycle(){
  for(let i=solids.length-1;i>=0;i--){const so=solids[i];if(so.d1<p-12){if(so.cars)so.cars.forEach(cg=>cg.visible=false);if(so.mesh)so.mesh.visible=false;solids.splice(i,1)}}
  for(let i=smalls.length-1;i>=0;i--){const sm=smalls[i];if(sm.d<p-10){sm.mesh.visible=false;smalls.splice(i,1)}}}
function sceneryFollow(){const far=p+230;
  for(const b of buildings)if(b.d+b.len/2<p-14){let mx=-1e9;for(const o of buildings)if(o.side===b.side)mx=Math.max(mx,o.d+o.len/2);placeBuilding(b,Math.max(mx,p)+1+Math.random()*3)}
  for(const t of trees)if(t.d<p-10){let mx=-1e9;for(const o of trees)if(o.side===t.side)mx=Math.max(mx,o.d);placeTree(t,mx+10+Math.random()*16)}
  for(const g of gantries)if(g.d<p-10){g.d+=gantries.length*42;g.m.position.z=-g.d}
  for(const l of lamps)if(l.d<p-10){l.d+=lamps.length/2*36;l.m.position.z=-l.d}
  const cz=-p-GL/2+30;ground.position.z=cz;gravelTex.offset.y=(p/4)%1;sideG.forEach(m=>m.position.z=cz);sideGroundTex.offset.y=(p/4)%1;rails.forEach(r=>r.position.z=cz);walls.forEach(w=>w.position.z=cz);wallTex.offset.x=-(p/8)%1;wires.forEach(w=>w.position.z=cz);skyline.position.z=-p-260}

/* ---------------- end of run ---------------- */
function finishRun(quit){const sc=Math.floor(score);const prevBest=c.best()||0;const best=c.best(sc)||sc;save.coins+=runCoins;
  ev('score',0,sc);ev('dist',0,Math.floor(p));persist();
  c.after(()=>{state='over';show(ui.hud,false);q('#oTitle').textContent=quit?'Run ended':'Crashed!';q('#oScore').textContent=sc.toLocaleString('en-US');q('#oBest').hidden=!(sc>prevBest&&sc>0);
    q('#oDist').textContent=Math.floor(p).toLocaleString('en-US')+' m';q('#oCoins').textContent='+'+runCoins;q('#oBestV').textContent=Math.floor(best).toLocaleString('en-US');misRows(q('#oMis'),true);show(ui.over,true);
    c.stat('Last run '+sc.toLocaleString('en-US')+' pts · Best '+Math.floor(best).toLocaleString('en-US'));setTimeout(()=>{try{q('#oAgain').focus({preventScroll:true})}catch(_){}},60)},quit?50:1100)}

/* ---------------- animation and camera ---------------- */
const mPos=new T.Vector3(),mLook=new T.Vector3(),mShift=new T.Vector2();
function menuPose(){const port=camera.aspect<1;const side=!ui.shop.hidden||!ui.mis.hidden;let sx=port?0:(side?-2.1:1.15),sy=port?(side?-2.1:-.9):1.2;mShift.x+=(sx-mShift.x)*.12;mShift.y+=(sy-mShift.y)*.12;mPos.set(1.55+mShift.x*.4,port?2.1:1.75,-p-(port?5.8:4.4));mLook.set(mShift.x,mShift.y,-p)}
const camPos=new T.Vector3(),camLook=new T.Vector3(),tmpV=new T.Vector3(),tmpL=new T.Vector3();let camY=3.6,animT=0,legPh=0;
function animate(dt){animT+=dt;const pr=P.parts;if(!pr)return;
  const rolling=rollT>0&&state==='run',air=!grounded&&jetT<=0&&state==='run';
  P.root.position.set(x,y+(boardT>0&&jetT<=0?.22:0),-p);
  if(state==='menu'){const br=Math.sin(animT*2.2);pr.legL.rotation.x=0;pr.legR.rotation.x=0;pr.armL.rotation.x=.05+br*.04;pr.armR.rotation.x=-.05-br*.04;pr.armL.rotation.z=-.12;pr.armR.rotation.z=.12;pr.up.position.y=br*.015;P.pivot.rotation.set(0,0,0);P.root.rotation.y=Math.sin(animT*.6)*.25;P.pivot.position.y=.9;P.body.scale.set(1,1,1);return}
  P.root.rotation.y=0;
  if(state==='crash'||state==='over'){crashT+=dt;const k=Math.min(1,crashT*3);P.pivot.rotation.x=k*1.35;P.pivot.position.y=.9-k*.5;pr.armL.rotation.x=-2.4*k;pr.armR.rotation.x=-2.2*k;pr.legL.rotation.x=-.4*k;pr.legR.rotation.x=.3*k;return}
  // lean into lane changes
  const lean=(laneX(lane)-x)*.16;P.pivot.rotation.z=-lean;P.pivot.rotation.y=lean*.6;
  if(jetT>0){P.pivot.rotation.x=-.55;P.pivot.position.y=.9;pr.legL.rotation.x=.5+Math.sin(animT*8)*.1;pr.legR.rotation.x=.35-Math.sin(animT*8)*.1;pr.armL.rotation.x=-.5;pr.armR.rotation.x=-.5;pr.armL.rotation.z=-.2;pr.armR.rotation.z=.2;
    P.flames.forEach((f,i)=>{const sc=.8+Math.random()*.5;f.scale.set(1,sc,1)});P.body.scale.set(1,1,1);return}
  pr.armL.rotation.z=-.08;pr.armR.rotation.z=.08;
  if(rolling){const k=1-rollT/.62;P.pivot.rotation.x=-k*Math.PI*2;P.pivot.position.y=.55;P.body.scale.set(.85,.62,.85);pr.legL.rotation.x=-1.6;pr.legR.rotation.x=-1.6;pr.armL.rotation.x=-1.8;pr.armR.rotation.x=-1.8;return}
  P.pivot.rotation.x=0;P.pivot.position.y=.9;
  landSq=Math.max(0,landSq-dt*6);const sq=1-landSq*.18;P.body.scale.set(1+landSq*.1,sq,1+landSq*.1);
  if(air){const up=vy>0;pr.legL.rotation.x=up?-1.1:-.5;pr.legR.rotation.x=up?.5:.2;pr.armL.rotation.x=up?-2.6:-1.8;pr.armR.rotation.x=up?.8:.4;pr.armL.rotation.z=-.35;pr.armR.rotation.z=.35;pr.up.position.y=0;return}
  if(boardT>0){pr.legL.rotation.x=-.35;pr.legR.rotation.x=.35;pr.armL.rotation.x=-.3;pr.armR.rotation.x=.3;pr.armL.rotation.z=-.6;pr.armR.rotation.z=.6;pr.up.position.y=Math.sin(animT*5)*.02;P.pivot.rotation.y+=.35;return}
  legPh+=dt*s*.62;const sw2=Math.sin(legPh);pr.legL.rotation.x=sw2*1.0;pr.legR.rotation.x=-sw2*1.0;pr.armL.rotation.x=-sw2*.9;pr.armR.rotation.x=sw2*.9;pr.up.position.y=Math.abs(Math.cos(legPh))*.07;P.pivot.rotation.x=-.12}
function cameraUpdate(dt){
  // run pose
  const gG=groundAt(p,x,y+.01);const gy=jetT>0?y*.85:gG*.8+Math.max(0,y-gG)*.25;camY+=(gy-camY)*Math.min(1,dt*(jetT>0?3:4));
  tmpV.set(x*.7,3.55+camY,-p+6.4);tmpL.set(x*.85,1.35+camY,-p-10);
  menuPose();
  if(state==='menu'){menuT+=dt;tmpV.copy(mPos);tmpL.copy(mLook);camBlend=0}
  else{camBlend=Math.min(1,camBlend+dt*1.6)}
  if(state!=='menu'&&camBlend<1){const k=camBlend*camBlend*(3-2*camBlend);tmpV.lerpVectors(mPos,tmpV,k);tmpL.lerpVectors(mLook,tmpL,k)}
  camPos.copy(tmpV);camLook.copy(tmpL);
  if(shake>0){shake=Math.max(0,shake-dt);const a=shake*.6;camPos.x+=(Math.random()-.5)*a;camPos.y+=(Math.random()-.5)*a}
  camera.position.copy(camPos);camera.lookAt(camLook);
  const fov=baseFov+(state==='run'?(s-13.5)*.42+(jetT>0?6:0):0);if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,dt*3);camera.updateProjectionMatrix()}
  sun.position.set(x-9,24,-p+10);sun.target.position.set(x,0,-p-10);
  const gy2=groundAt(p,x,y+.01);blob.position.set(x,gy2+.03,-p);const hh=Math.max(0,y-gy2);blob.scale.setScalar(Math.max(.35,1-hh*.12));blob.material.opacity=.28*Math.max(.2,1-hh*.1);blob.visible=jetT<=0||y<JET_Y-1}
function drawCoins(dt){let n=0;const spin=animT*3.2;for(const cn of coins){if(!cn.on)continue;if(cn.d-p>150)continue;dummy.position.set(cn.x,cn.y,-cn.d);dummy.rotation.set(0,spin+cn.ph*.2,0);const sc=cn.mag?.85:1;dummy.scale.set(sc,sc,sc);dummy.updateMatrix();coinMesh.setMatrixAt(n++,dummy.matrix)}coinMesh.count=n;coinMesh.instanceMatrix.needsUpdate=true}
function drawParts(dt){for(let i=0;i<NP;i++){const pa=parts[i];if(pa.life<=0)continue;pa.life-=dt;pa.vy-=9*dt;pa.x+=pa.vx*dt;pa.y+=pa.vy*dt;pa.z+=pa.vz*dt;if(pa.life<=0)pa.y=-50;pPos[i*3]=pa.x;pPos[i*3+1]=pa.y;pPos[i*3+2]=pa.z}pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true}
let hudAcc=0;
function hud(dt){hudAcc+=dt;if(toastT>0){toastT-=dt;if(toastT<=0)ui.toast.classList.remove('on')}if(hintT>0){hintT-=dt;if(hintT<=0){ui.hint.style.opacity=0;setTimeout(()=>ui.hint.hidden=true,400)}}
  if(hudAcc<.08)return;hudAcc=0;ui.score.textContent=Math.floor(score).toLocaleString('en-US');
  const tm={magnet:[magT,upDur('magnet')],jet:[jetT,upDur('jet')],mult:[multT,upDur('mult')],board:[boardT,upDur('board')]};
  for(const k of PU_LIST){const [v,mx]=tm[k];const e=puEls[k];const on=v>0&&state==='run';if(e.hidden===on)e.hidden=!on;if(on)e.lastChild.firstChild.style.width=Math.max(0,v/mx*100)+'%'}
  if(state==='run'&&Math.floor(p)%50<1)ev('dist',0,Math.floor(p));if(state==='run')ev('score',0,Math.floor(score))}

/* ---------------- main loop ---------------- */
c.loop(ms=>{const raw=Math.min(.05,ms/1000);
  if(state==='crash'){slowmo+=(1-slowmo)*Math.min(1,raw*2)}
  const dt=raw*(state==='crash'?slowmo:1);
  if(state==='run')physics(dt);
  if(state!=='paused'){animate(dt);drawParts(dt);
    for(const it of items){it.mesh.userData.inner.rotation.y+=dt*2.4;it.mesh.position.y=it.y+Math.sin(animT*3+it.d)*.15}
    if(invT>0&&state==='run'){P.root.visible=Math.floor(animT*14)%2===0}else P.root.visible=true;
    P.shield.material.opacity=boardT>0?.12+Math.sin(animT*6)*.05:0}
  sceneryFollow();drawCoins(dt);cameraUpdate(raw);hud(raw);
  renderer.render(scene,camera)});

resize();resetScenery();goMenu();
if(LOW){for(const k of[sun])k.castShadow=false}

return()=>{ro.disconnect();scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.map&&m.map.dispose();m.dispose()})});renderer.dispose();try{renderer.forceContextLoss()}catch(e){}host.remove()};
});
}});
</script>
