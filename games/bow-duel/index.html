G.push({id:'m_bowduel',levels:true,name:'Bow Duel',kind:'arcade',tint:'#fde8d8',blurb:'An archery campaign across four lands. Drag back to aim, mind the wind, unlock trick arrows and upgrades, and take down knights, mages and giant bosses.',fmt:b=>b+' wins',
art:'<rect x="0" y="50" width="120" height="22" fill="#6ab04a"/><circle cx="18" cy="36" r="6" fill="#ffd8a8" stroke="#1D1A2F" stroke-width="2"/><rect x="13" y="42" width="10" height="10" fill="#3a8aff"/><circle cx="102" cy="36" r="6" fill="#ffd8a8" stroke="#1D1A2F" stroke-width="2"/><rect x="97" y="42" width="10" height="10" fill="#e83a3a"/><path d="M26 34Q60 0 94 30" stroke="#1D1A2F" stroke-width="2" stroke-dasharray="4 4" fill="none"/>',
run(root,c){const W=720,H=420;const {cv,x}=MOB.canvas(root,W,H);cv.style.width='min(100%,calc(70vh*1.714))';
  const INK='#1D1A2F',GY=330;

    {name:'Green Meadow',sky:['#7cc6f2','#e4f5ff'],sun:'#fff3b0',far:'#9cc6a8',hill:'#86c06c',ground:'#6ab04a',ground2:'#4f8f3a',prop:'tree'},
    {name:'Red Canyon',sky:['#ffb07a','#ffe6c4'],sun:'#fff0c0',far:'#d9875a',hill:'#c9764a',ground:'#d99a5a',ground2:'#b8783e',prop:'cactus'},
    {name:'Frost Peaks',sky:['#a9cfee','#eef7ff'],sun:'#ffffff',far:'#c4d8ec',hill:'#dde9f5',ground:'#f4f8fc',ground2:'#c8d9e8',prop:'ice',snow:true},
    {name:'Shadow Keep',sky:['#101a33','#35507a'],sun:'#f2f0d8',far:'#22304d',hill:'#2b3b5a',ground:'#3e5236',ground2:'#2c3b26',prop:'wall',night:true}];

  const FOES={
    dummy:{name:'Straw Dummy',hp:60,skill:.12,dmg:.5,weapon:'arrow',look:{body:'#c9a24a',skin:'#e8cf8a',pants:'#8a6a3a',hat:'straw'},trait:'Barely knows which end of the bow is which. Good practice.'},
    hunter:{name:'Hunter',hp:100,skill:.5,weapon:'arrow',look:{body:'#4a7a3a',pants:'#3a2f28',hat:'hood',hatCol:'#2f5a2a'},trait:'A steady shot with a longbow. Finds the range fast.'},
    axeman:{name:'Axe Thrower',hp:120,skill:.45,weapon:'axe',look:{body:'#8a4a2a',pants:'#4a3020',hat:'horns',beard:'#d9822b'},trait:'Hurls heavy spinning axes. Big damage, short range.'},
    knight:{name:'Shield Knight',hp:130,skill:.5,weapon:'arrow',shield:1,look:{body:'#8a9aa8',pants:'#5a6672',hat:'helm'},trait:'His shield blocks body shots. Aim for the head, or break it with a Heavy or Bomb arrow.'},
    xbow:{name:'Crossbowman',hp:100,skill:.7,weapon:'bolt',look:{body:'#3a4a7a',pants:'#2a2a3a',hat:'cap',hatCol:'#c0392b'},trait:'Fast, flat bolts that barely drop. Very accurate.'},
    bomber:{name:'Bomber',hp:110,skill:.45,weapon:'bomb',look:{body:'#6a6a5a',pants:'#3a3a32',hat:'goggles'},trait:'Lobs bombs that hurt even when they land close.'},
    frost:{name:'Frost Mage',hp:100,skill:.55,weapon:'ice',look:{body:'#5aa0d8',pants:'#3a6a9a',hat:'wizard',hatCol:'#3a78b8'},trait:'Ice orbs freeze you solid. Frozen archers lose their next turn.'},
    monk:{name:'Healer Monk',hp:110,skill:.5,weapon:'arrow',heal:12,look:{body:'#e8a03a',pants:'#c07a2a',hat:'bald'},trait:'Heals 12 HP at the start of every turn. Hit hard and fast.'},
    ogre:{name:'Grumbold the Ogre',hp:260,skill:.5,weapon:'boulder',boss:1,scale:1.55,look:{body:'#7a5a3a',skin:'#9ac07a',pants:'#5a4028',hat:'ogre'},trait:'Huge, tough and throws boulders. Easy to hit, hard to knock down.'},
    bandit:{name:'Bandit Queen Vex',hp:220,skill:.72,weapon:'triple',boss:1,scale:1.1,look:{body:'#a83a3a',pants:'#3a2a2a',hat:'bandana'},trait:'Fires three arrows at once from behind cover.'},
    yeti:{name:'The Yeti',hp:300,skill:.55,weapon:'snow',boss:1,scale:1.65,look:{body:'#eef3f8',skin:'#8ab4d8',pants:'#d8e2ec',hat:'yeti',fur:1},trait:'Hurls giant snowballs that freeze you in place.'},
    lord:{name:'The Shadow Lord',hp:340,skill:.8,weapon:'fireball',boss:1,scale:1.25,shield:2,magic:1,look:{body:'#2a2a3a',skin:'#b8b8c8',pants:'#1a1a24',hat:'crown',cape:'#8a1a2a'},trait:'Fireballs that burn, a magic shield, and he heals when hurt.'}};
  const LEVELS=[
    {r:0,f:['dummy']},{r:0,f:['hunter']},{r:0,f:['hunter'],props:1},{r:0,f:['axeman'],props:1},{r:0,f:['hunter','hunter'],props:1},{r:0,f:['ogre'],props:1},
    {r:1,f:['xbow'],props:1},{r:1,f:['axeman'],props:2},{r:1,f:['bomber'],props:1},{r:1,f:['knight'],props:1},{r:1,f:['xbow','bomber'],props:2},{r:1,f:['bandit'],props:2},
    {r:2,f:['frost'],props:1},{r:2,f:['knight'],props:2},{r:2,f:['monk'],props:1},{r:2,f:['frost','hunter'],props:2},{r:2,f:['xbow','knight'],props:2},{r:2,f:['yeti'],props:1},
    {r:3,f:['bomber','axeman'],props:2},{r:3,f:['monk','xbow'],props:2},{r:3,f:['knight','frost'],props:2},{r:3,f:['frost','bomber'],props:2},{r:3,f:['monk','knight'],props:2},{r:3,f:['lord'],props:2}];
  const WEAP=[
    {id:'arrow',name:'Arrow',ammo:0,unlock:1,desc:'Your trusty arrow. Unlimited.'},
    {id:'triple',name:'Triple',ammo:2,unlock:3,desc:'Three arrows in a spread. Easier to land a hit.'},
    {id:'fire',name:'Fire',ammo:2,unlock:5,desc:'Sets the target alight: 7 damage a turn for 3 turns.'},
    {id:'heavy',name:'Heavy',ammo:2,unlock:8,desc:'Hits 60% harder, drops faster, and smashes shields.'},
    {id:'bomb',name:'Bomb',ammo:1,unlock:10,desc:'Explodes on impact. Ignores shields and blows up cover.'},
    {id:'ice',name:'Ice',ammo:1,unlock:13,desc:'Freezes the target so it loses its next turn.'},
    {id:'zap',name:'Lightning',ammo:1,unlock:17,desc:'Flies dead straight: no drop, no wind.'}];
  const PHYS={
    arrow:{g:.35,wf:1,len:22,dmg:1},triple:{g:.35,wf:1,len:22,dmg:.62},fire:{g:.35,wf:1,len:22,dmg:1,burn:3},
    heavy:{g:.5,wf:.6,len:26,dmg:1.6,heavy:1},bomb:{g:.4,wf:.8,r:6,dmg:0,boom:62,boomDmg:44},ice:{g:.3,wf:.7,r:6,dmg:.55,freeze:1},
    zap:{g:0,wf:0,len:26,dmg:1.25},bolt:{g:.18,wf:.35,len:18,dmg:.95,spd:1.15},axe:{g:.45,wf:.4,r:8,dmg:1.35,spin:1,max:20},
    boulder:{g:.5,wf:.15,r:13,dmg:1.5,boom:40,boomDmg:18,max:20},snow:{g:.42,wf:.3,r:12,dmg:1.15,freeze:1,max:21},fireball:{g:.25,wf:.5,r:7,dmg:1.05,burn:3}};
  const UPG=[
    {id:'hp',name:'Tough Leather',desc:'+20 max health',max:3,cost:[30,60,90]},
    {id:'dmg',name:'Sharp Tips',desc:'+10% arrow damage',max:3,cost:[40,80,120]},
    {id:'eye',name:'Eagle Eye',desc:'Longer aiming guide',max:3,cost:[25,50,75]},
    {id:'quiver',name:'Big Quiver',desc:'+1 ammo for every special arrow',max:2,cost:[60,120]}];

  /* ---------- save data ---------- */
  const SK='bowduel2';
  const save=Object.assign({lvl:1,stars:{},coins:0,wins:0},S.get(SK,{}));
  save.up=Object.assign({hp:0,dmg:0,eye:0,quiver:0},save.up||{});save.stars=save.stars||{};
  const persist=()=>S.set(SK,save);
  if(save.wins)c.best(save.wins);

  /* ---------- helpers ---------- */
  const R=MOB.rnd,clamp=MOB.clamp;
  const txt=(s,px,py,size,col,align,bold)=>{x.font=(bold==null?'800 ':bold)+size+'px Figtree, system-ui, sans-serif';x.textAlign=align||'center';x.textBaseline='middle';x.fillStyle=col;x.fillText(s,px,py)};
  const title=(s,px,py,size,col,outline)=>{x.font=size+'px "Bagel Fat One", Figtree, sans-serif';x.textAlign='center';x.textBaseline='middle';if(outline){x.lineWidth=size/6;x.strokeStyle=outline;x.lineJoin='round';x.strokeText(s,px,py)}x.fillStyle=col;x.fillText(s,px,py)};
  const circ=(px,py,r,fill,line)=>{x.beginPath();x.arc(px,py,r,0,7);if(fill){x.fillStyle=fill;x.fill()}if(line){x.lineWidth=line;x.strokeStyle=INK;x.stroke()}};
  const box=(px,py,w,h,r,fill,line)=>{MOB.rr(x,px,py,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(line){x.lineWidth=line;x.strokeStyle=INK;x.stroke()}};
  const seg=(a,b,cc,d,col,w)=>{x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.lineTo(cc,d);x.stroke()};
  function wrap(s,maxW,size){x.font='600 '+size+'px Figtree, sans-serif';const out=[];let line='';for(const w of s.split(' ')){const tryL=line?line+' '+w:w;if(x.measureText(tryL).width>maxW&&line){out.push(line);line=w}else line=tryL}if(line)out.push(line);return out}
  function star(px,py,r,on){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr)}x.closePath();x.fillStyle=on?'#ffd23f':'rgba(0,0,0,.25)';x.fill();x.lineWidth=2;x.strokeStyle=on?INK:'rgba(0,0,0,.3)';x.stroke()}
  function coin(px,py,r){circ(px,py,r,'#ffd23f',2);circ(px,py,r*.55,null);x.lineWidth=1.5;x.strokeStyle='#c9961a';x.beginPath();x.arc(px,py,r*.55,0,7);x.stroke()}
  function lockIcon(px,py){x.lineWidth=3;x.strokeStyle='#d8d8e0';x.beginPath();x.arc(px,py-4,6,Math.PI,0);x.stroke();box(px-8,py-3,16,12,2,'#d8d8e0')}
  const unlocked=lv=>WEAP.filter(w=>w.unlock<=lv);
  const ammoFor=w=>w.id==='arrow'?Infinity:w.ammo+save.up.quiver;

  /* ---------- buttons (rebuilt every frame) ---------- */
  let btns=[];
  function button(label,bx,by,bw,bh,fn,o={}){btns.push({x:bx,y:by,w:bw,h:bh,fn:o.dis?null:fn});
    box(bx+3,by+4,bw,bh,10,'rgba(0,0,0,.35)');box(bx,by,bw,bh,10,o.dis?'#b8b4c4':(o.col||'#ffd23f'),2.5);
    txt(label,bx+bw/2,by+bh/2+1,o.size||17,o.dis?'#6a6680':(o.tc||INK))}

  /* ---------- game state ---------- */
  let scene='menu',t=0,L=null,brief=null,result=null,parts=[],floats=[],keyAim=false;
  function ground(gx){return GY+Math.sin(gx/140+L.s1)*16+Math.sin(gx/53+L.s2)*5}

  function mkArcher(kind,id,ax){const d=kind==='player'?PLAYER:FOES[id],s=d.scale||1;
    const max=kind==='player'?100+20*save.up.hp:Math.round(d.hp*c.pick(.85,1,1.15));
    return{kind,id,def:d,x:ax,y:0,hp:max,max,face:kind==='player'?1:-1,s,shield:d.shield||0,burn:0,frozen:0,dead:false,fall:0,flash:0,
      aimAng:kind==='player'?-.55:Math.PI+.55,pull:0,weapon:kind==='player'?'arrow':d.weapon,skill:d.skill||0,turns:0}}

  function startLevel(idx,quick){
    const lv=quick||LEVELS[idx],reg=REGIONS[lv.r];
    L={idx,quick:!!quick,lv,reg,s1:R(0,6),s2:R(0,6),arch:[],props:[],stuck:[],proj:[],ghost:[],trailNow:[],wind:0,state:'aim',cam:0,aim:null,
      turn:0,waitT:0,after:null,shake:0,slow:0,shots:0,aiT:0,msg:'',kAng:-.55,kPw:15,weapon:'arrow',ammo:{}};
    const lvNum=quick?save.lvl:idx+1;
    for(const w of unlocked(lvNum))L.ammo[w.id]=ammoFor(w);
    L.arch.push(mkArcher('player','you',150));
    let fx=150+620+lv.r*60+R(0,110);if(FOES[lv.f[0]].boss)fx=150+660+lv.r*40;
    lv.f.forEach((id,i)=>L.arch.push(mkArcher('foe',id,fx+i*140)));
    L.WW=L.arch[L.arch.length-1].x+230;
    for(const a of L.arch)a.y=ground(a.x);
    const np=lv.props||0,x0=L.arch[0].x+230,x1=L.arch[1].x-170;
    for(let i=0;i<np;i++)addProp(reg.prop,x0+(x1-x0)*(np===1?R(.35,.65):(i+R(.15,.85))/np));
    newWind();L.cam=0;parts=[];floats=[];
    scene='play';L.turn=0;startTurn(true);
    c.stat(quick?'Quick duel · Wins '+save.wins:'Level '+(lv.r+1)+'-'+(idx%6+1)+' · Coins '+save.coins)}
  function addProp(type,px){const gy=ground(px),p={type,x:px,y:gy,hp:2,shapes:[]};
    if(type==='tree'){p.shapes=[{x:px-7,y:gy-60,w:14,h:60},{c:1,x:px,y:gy-82,r:30}]}
    else if(type==='cactus'){p.shapes=[{x:px-9,y:gy-70,w:18,h:70},{x:px-24,y:gy-52,w:16,h:10},{x:px+8,y:gy-42,w:16,h:10}]}
    else if(type==='ice'){p.shapes=[{x:px-13,y:gy-96,w:26,h:96}]}
    else{p.shapes=[{x:px-18,y:gy-88,w:36,h:88}]}
    L.props.push(p)}
  function newWind(){L.wind=R(-1,1)*c.pick(.025,.04,.055)*(1+L.lv.r*.12)}

  /* ---------- turns ---------- */
  function wait(ms,fn){L.state='wait';L.waitT=ms;L.after=fn}
  function startTurn(first){const a=L.arch[L.turn];a.turns++;
    if(!first&&Math.random()<.35)newWind();
    if(a.burn>0){a.burn--;hurt(a,7,'BURN',null);if(a.dead)return wait(900,resolve)}
    if(a.def.heal&&a.hp<a.max){const h=Math.min(a.def.heal,a.max-a.hp);a.hp+=h;floatW('+'+h,a.x,a.y-90*a.s,'#5ae07a');beep(880,.08,'sine',.05)}
    if(a.def.magic){if(a.hp<a.max*.5&&a.turns%3===0){const h=20;a.hp=Math.min(a.max,a.hp+h);floatW('+'+h,a.x,a.y-90*a.s,'#5ae07a')}if(a.turns%4===0&&a.shield<2){a.shield=2;floatW('SHIELD UP',a.x,a.y-110*a.s,'#b48aff')}}
    if(a.frozen>0){a.frozen--;a.iceImm=2;floatW('FROZEN',a.x,a.y-100*a.s,'#9ad8ff');return wait(900,nextTurn)}
    if(a.iceImm>0)a.iceImm--;
    L.state=L.turn===0?'aim':'foeaim';L.aiT=0;
    if(L.turn===0&&!(L.ammo[L.weapon]>0))L.weapon='arrow'}
  function nextTurn(){const n=L.arch.length;let i=L.turn;do{i=(i+1)%n}while(L.arch[i].dead);L.turn=i;startTurn()}
  function resolve(){const me=L.arch[0],foes=L.arch.slice(1);
    if(me.dead)return wait(1200,()=>finish(false));
    if(foes.every(f=>f.dead))return wait(1200,()=>finish(true));
    wait(550,nextTurn)}

  /* ---------- shooting ---------- */
  function hand(a){return{x:a.x+a.face*16*a.s,y:a.y-46*a.s}}
  function fire(a,ang,pw,type){const ph=PHYS[type],h=hand(a);a.aimAng=ang;a.pull=0;
    const mk=(an,typ)=>{const p=PHYS[typ],sp=typ==='zap'?26:pw*(p.spd||1);L.proj.push({type:typ,x:h.x,y:h.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,owner:L.arch.indexOf(a),age:0,rot:0,trail:[]})};
    if(type==='triple'){for(const d of[-.07,0,.07])mk(ang+d,'triple')}else mk(ang,type);
    L.state='fly';if(a.kind==='player'){L.shots++;L.trailNow=[]}
    if(type==='zap')beep(1400,.15,'sawtooth',.06);else if(ph.r)beep(260,.1,'triangle',.08);else beep(640,.06,'triangle',.07)}
  function playerShoot(ang,pw){if(L.state!=='aim'||L.turn!==0)return;const w=L.weapon;if(!(L.ammo[w]>0))return;
    if(L.ammo[w]!==Infinity)L.ammo[w]--;fire(L.arch[0],ang,pw,w);L.lastAim={ang,pw};keyAim=false}
  function maxPw(type){return PHYS[type].max||24}
  function sim(a,ang,pw,type,tg,ox=0){const ph=PHYS[type],h=hand(a),sp=pw*(ph.spd||1);let px=h.x,py=h.y,vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp,bd=1e9;const hx=tg.x+ox,hy=tg.y-40*tg.s;
    for(let i=0;i<500;i++){vx+=L.wind*ph.wf;vy+=ph.g;px+=vx;py+=vy;const d=Math.hypot(px-hx,py-hy);if(d<bd)bd=d;if(i>4&&hitProp(px,py,ph.r||2))return bd+260;if(py>ground(px)||px<-100||px>L.WW+100)break}return bd}
  // The AI aims at a spot near you on purpose; how far off depends on its skill, and it closes in every turn.
  function aiShoot(a){const tg=L.arch[0],type=a.weapon==='triple'?'arrow':a.weapon;
    const spread=Math.max(12+(1-a.skill)*80,(30+(1-a.skill)*170*c.pick(1.4,1,.65))*Math.pow(.8,a.turns-1)),gauss=(Math.random()+Math.random()+Math.random()-1.5)*2,ox=gauss*spread;
    let best=null;for(let k=0;k<420;k++){const ang=Math.PI+R(.04,1.35),pw=R(7,maxPw(type)),r=sim(a,ang,pw,type,tg,ox);if(!best||r<best.r)best={r,ang,pw}}
    fire(a,best.ang,best.pw,a.weapon)}

  function hitArcher(a,px,py,r){if(a.dead)return null;const s=a.s;
    if(a.shield>0){const sx=a.x+a.face*20*s;if(Math.abs(px-sx)<5*s+r&&py>a.y-54*s&&py<a.y-4*s)return'shield'}
    if(Math.hypot(px-a.x,py-(a.y-58*s))<12*s+r)return'head';
    if(Math.abs(px-a.x)<12*s+r&&py>a.y-47*s-r&&py<a.y-19*s)return'body';

  function hitProp(px,py,r){for(const p of L.props){if(p.hp<=0)continue;for(const q of p.shapes){if(q.c?Math.hypot(px-q.x,py-q.y)<q.r+r:(px>q.x-r&&px<q.x+q.w+r&&py>q.y-r&&py<q.y+q.h+r))return p}}return null}
  function hurt(a,dmg,label,owner){dmg=Math.max(1,Math.round(dmg));a.hp-=dmg;a.flash=220;
    floatW('-'+dmg,a.x,a.y-84*a.s,label==='HEADSHOT'?'#ffd23f':'#ff5a4a');if(label&&label!=='BURN')floatW(label+'!',a.x,a.y-108*a.s,'#ffd23f');

    else beep(label==='HEADSHOT'?1200:320,.1,'square',.07)}

  function explode(px,py,rad,dmg,owner){L.shake=Math.max(L.shake,9);beep(90,.35,'sawtooth',.1);
    burst(px,py,26,['#ff9a2a','#ffd23f','#5a5a5a','#ff5a2a'],5,700);burst(px,py,10,['#8a8a8a'],2,1000);
    for(const a of L.arch){if(a.dead)continue;const d=Math.hypot(a.x-px,(a.y-35*a.s)-py),rr=rad+16*a.s;if(d<rr)hurt(a,dmg*(.35+.65*(1-d/rr))*dmgMul(owner),d<rr*.4?'DIRECT HIT':null,owner)}

    L.stuck=L.stuck.filter(s=>s.prop!==p);beep(180,.2,'square',.06)}

  function stepProj(p){const ph=PHYS[p.type];p.vx+=L.wind*ph.wf;p.vy+=ph.g;p.x+=p.vx;p.y+=p.vy;p.age++;if(ph.spin)p.rot+=.38*Math.sign(p.vx||1);

    if(p.type==='fire'||p.type==='fireball'){if(p.age%2===0)parts.push({x:p.x,y:p.y,vx:R(-.5,.5),vy:R(-1,0),t:0,l:350,c:Math.random()<.5?'#ff9a2a':'#ffd23f',r:R(2,4)})}
    if(p.type==='ice'||p.type==='snow'){if(p.age%3===0)parts.push({x:p.x,y:p.y,vx:R(-.4,.4),vy:R(-.4,.4),t:0,l:400,c:'#dff3ff',r:R(1.5,3)})}
    if(p.type==='zap'&&p.age%1===0)parts.push({x:p.x,y:p.y,vx:R(-1,1),vy:R(-1,1),t:0,l:220,c:'#fff6a0',r:R(1.5,3)});
    if(p.type==='bomb'&&p.age%3===0)parts.push({x:p.x,y:p.y-6,vx:R(-.4,.4),vy:R(-1,-.2),t:0,l:300,c:'#ffd23f',r:2});
    const r=ph.r||2,tipX=p.x+(ph.len?Math.cos(Math.atan2(p.vy,p.vx))*6:0),tipY=p.y+(ph.len?Math.sin(Math.atan2(p.vy,p.vx))*6:0);
    for(let i=0;i<L.arch.length;i++){const a=L.arch[i];if(i===p.owner&&p.age<14)continue;const z=hitArcher(a,tipX,tipY,r);if(!z)continue;
      if(z==='shield'){if(ph.boom){explode(p.x,p.y,ph.boom,ph.boomDmg,p.owner);return false}
        if(ph.heavy){a.shield--;floatW(a.shield>0?'CRACK!':'SHIELD BROKEN!',a.x,a.y-108*a.s,'#ffd23f');burst(tipX,tipY,14,['#c8d0d8','#8a96a2'],4,600);beep(500,.15,'square',.08);return false}
        floatW('BLOCKED',a.x,a.y-104*a.s,'#d8e0ff');burst(tipX,tipY,8,['#e0e6ee'],3,400);beep(900,.06,'square',.06);
        if(ph.len)L.stuck.push({arch:a,dx:(tipX-a.x)*a.face,dy:tipY-a.y,a:Math.atan2(p.vy,p.vx),f:a.face,t:p.type});return false}
      if(ph.boom){explode(p.x,p.y,ph.boom,ph.boomDmg,p.owner);return false}
      const base=z==='head'?R(44,54):z==='body'?R(20,28):R(10,14);
      hurt(a,base*ph.dmg*dmgMul(p.owner),z==='head'?'HEADSHOT':null,p.owner);
      burst(tipX,tipY,12,['#c81a1a','#ff5a4a'],3,500);
      if(ph.burn&&!a.dead){a.burn=ph.burn;floatW('BURNING',a.x,a.y-120*a.s,'#ff9a2a')}
      if(ph.freeze&&!a.dead&&!(a.iceImm>0)){a.frozen=1;floatW('FROZEN',a.x,a.y-120*a.s,'#9ad8ff');burst(a.x,a.y-40*a.s,16,['#dff3ff','#9ad8ff'],3,700)}
      if(ph.len&&!a.dead)L.stuck.push({arch:a,dx:(tipX-a.x)*a.face,dy:tipY-a.y,a:Math.atan2(p.vy,p.vx),f:a.face,t:p.type});

      burst(tipX,tipY,8,L.reg.prop==='ice'?['#dff3ff']:['#a07a4a','#6a4a2a'],2.5,400);beep(220,.05,'triangle',.05);
      if(ph.len)L.stuck.push({prop:pr,x:tipX,y:tipY,a:Math.atan2(p.vy,p.vx),t:p.type});return false}

      burst(p.x,ground(p.x),ph.r?14:6,[L.reg.ground2,L.reg.ground,p.type==='snow'||p.type==='ice'?'#ffffff':L.reg.ground],ph.r?3:2,500);beep(150,.05,'triangle',.04);
      if(ph.len)L.stuck.push({x:p.x,y:ground(p.x),a:Math.atan2(p.vy,p.vx),t:p.type});return false}

  /* ---------- end of level ---------- */

  function cloud(px,py,s){x.fillStyle='rgba(255,255,255,.85)';for(const[dx,dy,r]of[[0,0,16],[16,-6,20],[34,0,15],[18,6,14]]){x.beginPath();x.arc(px+dx*s,py+dy*s,r*s,0,7);x.fill()}}

  function drawProp(p,cam){if(p.hp<=0)return;const sx=p.x-cam,gy=p.y;x.save();

      x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.moveTo(sx-8,gy-10);x.lineTo(sx-9,gy-60);x.lineTo(sx-3,gy-84);x.lineTo(sx-3,gy-10);x.fill()}

    x.restore()}

    button('< Map',W-284,H-78,86,48,()=>{scene='map'},{col:'#fffdf6',size:14});
    button('FIGHT!',W-188,H-78,166,48,()=>startLevel(brief.li),{col:'#d64933',tc:'#fff',size:22});btns[btns.length-1].main=1}
  function drawShop(){btns=[];x.fillStyle='#1d1a2f';x.fillRect(0,0,W,H);title('Upgrades',W/2,32,30,'#ffd23f');
    button('< Back',12,10,86,34,()=>{scene=L&&L.arch?'map':'menu'},{col:'#fffdf6',size:14});coin(W-110,27,9);txt(save.coins+' coins',W-96,27,15,'#ffd23f','left');
    UPG.forEach((u,i)=>{const y=74+i*82,lvl=save.up[u.id],maxed=lvl>=u.max,cost=maxed?0:u.cost[lvl];box(40,y,W-80,70,14,'#fffdf6',2.5);
      txt(u.name,62,y+22,18,INK,'left');txt(u.desc,62,y+48,13,'#3a3650','left','600 ');
      for(let k=0;k<u.max;k++)box(330+k*26,y+26,20,18,4,k<lvl?'#4ae06a':'#d8d4e4',2);
      button(maxed?'Maxed':'Buy  '+cost,W-210,y+15,150,40,()=>{save.coins-=cost;save.up[u.id]++;persist();beep(1000,.1,'triangle',.08)},{dis:maxed||save.coins<cost,size:15})});
    txt('Earn coins by winning levels. More stars, more coins.',W/2,H-20,12,'#bdb8d0','center','600 ')}
  function drawResult(){drawWorld();btns=[];x.fillStyle='rgba(29,26,47,.55)';x.fillRect(0,0,W,H);const r=result;
    const lines=r.won?0:wrap(L.arch.find(a=>!a.dead&&a.kind==='foe').def.trait,330,13);
    const ph=r.won?(L.quick?190:230)+(r.newW?26:0):170+lines.length*18,py=(H-ph)/2;
    box(W/2-200,py,400,ph,18,'#fffdf6',3);title(r.won?'Victory!':'Defeated',W/2,py+44,40,r.won?'#4f8f3a':'#d64933');
    let y=py+90;if(r.won&&!L.quick){for(let k=0;k<3;k++){const pop=clamp((r.t-300-k*250)/200,0,1);if(pop>0){x.save();x.translate(W/2-50+k*50,y);x.scale(pop,pop);star(0,0,20,k<r.stars);x.restore()}else star(W/2-50+k*50,y,20,false)}y+=40}
    if(r.won){coin(W/2-40,y,9);txt('+'+r.coins+' coins',W/2+10,y,16,INK);y+=30;if(r.newW){txt('New arrow unlocked: '+r.newW.name+'!',W/2,y,14,'#d64933');y+=26}}
    else{txt('Tip:',W/2,y-4,13,'#d64933');y+=14;for(const ln of lines){txt(ln,W/2,y,13,'#3a3650','center','600 ');y+=18}}
    const by=py+ph-60;
    if(L.quick){button('Again',W/2-170,by,160,42,quickDuel);btns[btns.length-1].main=1;button('Menu',W/2+10,by,160,42,()=>{scene='menu'},{col:'#fffdf6'})}
    else{const next=r.won&&L.idx+1<LEVELS.length;
      if(next){button('Next level',W/2-185,by,140,42,()=>openBrief(L.idx+1));btns[btns.length-1].main=1}
      button(r.won?'Replay':'Try again',next?W/2-35:W/2-150,by,next?110:140,42,()=>startLevel(L.idx),{col:r.won?'#fffdf6':'#ffd23f'});if(!next)btns[btns.length-1].main=1;
      button('Map',next?W/2+85:W/2+10,by,next?100:140,42,()=>{scene='map'},{col:'#fffdf6'})}}

  /* ---------- update ---------- */
  function update(dt){
    for(const p of parts){p.t+=dt;p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=(p.g||0)*dt/16}parts=parts.filter(p=>p.t<p.l);
    for(const f of floats){f.t+=dt;f.y-=dt*.035}floats=floats.filter(f=>f.t<1100);
    if(scene==='result')result.t+=dt;
    if(scene!=='play'&&scene!=='result')return;
    for(const a of L.arch){if(a.flash>0)a.flash-=dt;if(a.dead&&a.fall<1)a.fall=Math.min(1,a.fall+dt/500)}
    if(L.shake>0)L.shake=Math.max(0,L.shake-dt*.03);
    if(scene!=='play')return;
    let sdt=dt;if(L.slow>0){L.slow-=dt;sdt=dt*.3}
    if(L.state==='wait'){L.waitT-=dt;if(L.waitT<=0){const f=L.after;L.after=null;f&&f()}}
    else if(L.state==='foeaim'){const a=L.arch[L.turn];L.aiT+=dt;a.pull=Math.min(1,L.aiT/900);if(L.aiT>1000)aiShoot(a)}
    else if(L.state==='fly'){L.acc=(L.acc||0)+sdt;while(L.acc>=16){L.acc-=16;L.proj=L.proj.filter(stepProj);if(!L.proj.length)break}
      if(!L.proj.length){L.acc=0;if(L.turn===0&&L.trailNow.length)L.ghost=L.trailNow.slice();L.state='settle';wait(450,resolve)}}
    // camera
    let want;if(L.state==='fly'&&L.proj.length){want=L.proj[0].x-W/2}else{const a=L.arch[L.turn];want=a.kind==='player'?a.x-170:a.x-(W-170)}
    L.cam+=(clamp(want,0,Math.max(0,L.WW-W))-L.cam)*Math.min(1,dt/(L.state==='fly'?90:320))}

  c.loop(dt=>{t+=dt;update(dt);
    if(scene==='menu')drawMenu();else if(scene==='map')drawMap();else if(scene==='shop')drawShop();else if(scene==='brief')drawBrief();
    else if(scene==='play'){drawWorld();drawHUD()}else if(scene==='result')drawResult()})}});
</script>
<script src="/js/app.js"></script>
