  const PN=520,pX=new Float32Array(PN),pY=new Float32Array(PN),pVX=new Float32Array(PN),pVY=new Float32Array(PN),pL=new Float32Array(PN),pM=new Float32Array(PN),pS=new Float32Array(PN),pD=new Float32Array(PN),pG=new Float32Array(PN),pR=new Float32Array(PN),pC=new Uint8Array(PN),pK=new Uint8Array(PN);let pI=0;

    for(let i=0;i<5;i++){const hx=18+i*22,hy=H-24;if(i>=lives&&i>=3)continue;x.fillStyle=i<lives?'#dde8ff':'rgba(221,232,255,.15)';x.beginPath();x.moveTo(hx-8,hy+5);x.lineTo(hx-5,hy-2);x.lineTo(hx+5,hy-2);x.lineTo(hx+8,hy+5);x.closePath();x.fill();x.fillRect(hx-1.5,hy-9,3,7)}
    if(shield){x.strokeStyle='#9FE8FF';x.lineWidth=2;x.beginPath();x.arc(18+Math.max(3,lives)*22+4,H-24,8,0,TAU);x.stroke()}
    /* bomb button */
    const ready=bombs>0&&state==='play';x.globalAlpha=ready?1:.45;x.fillStyle='rgba(10,18,40,.8)';x.beginPath();x.arc(BOMBX,BOMBY,BOMBR,0,TAU);x.fill();x.strokeStyle=ready?'#fff':'rgba(255,255,255,.4)';x.lineWidth=2.5;x.stroke();
    x.save();x.translate(BOMBX,BOMBY-2);x.fillStyle='#fff';x.beginPath();x.arc(0,2,9,0,TAU);x.fill();x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();x.moveTo(5,-5);x.quadraticCurveTo(9,-12,13,-9);x.stroke();if(ready){x.fillStyle=Math.sin(time*16)>0?'#FFE27A':'#FF6B3D';x.beginPath();x.arc(13,-9,3,0,TAU);x.fill()}x.restore();
    for(let i=0;i<3;i++){x.fillStyle=i<bombs?'#FFE27A':'rgba(255,255,255,.18)';x.beginPath();x.arc(BOMBX-10+i*10,BOMBY+BOMBR+6,3,0,TAU);x.fill()}x.globalAlpha=1}
  function drawBanner(){if(state!=='play')return;if(!(phase==='banner'||phase==='clear'))return;const t=bannerT,a=Math.min(1,t*4,phaseT*3),sc=t<.25?.5+t/.25*.6:1.1-Math.min(.1,(t-.25)*.4);
    x.save();x.globalAlpha=Math.max(0,a);x.translate(W/2,300);x.scale(sc,sc);x.textAlign='center';x.textBaseline='middle';const bossW=bannerB.indexOf('Boss')===0;
    if(bossW){x.fillStyle='rgba(255,77,106,.18)';x.fillRect(-W/2-20,-46,W+40,92);x.fillStyle='#FF4D6A';for(let i=-12;i<12;i++){x.beginPath();x.moveTo(i*24+(time*60)%24,-46);x.lineTo(i*24+12+(time*60)%24,-46);x.lineTo(i*24+(time*60)%24,-38);x.lineTo(i*24-12+(time*60)%24,-38);x.fill()}}
    x.font=bagel(46);x.lineWidth=8;x.strokeStyle='rgba(3,6,15,.85)';x.strokeText(bannerA,0,-6);x.fillStyle=bossW?'#FF9EC4':'#FFE27A';x.fillText(bannerA,0,-6);x.font=figF(800,17);x.fillStyle='#fff';x.strokeText(bannerB,0,30);x.fillText(bannerB,0,30);x.restore()}
  function panel(y0,h){x.fillStyle='rgba(4,8,20,.88)';rr(26,y0,W-52,h,16);x.fill();x.strokeStyle='rgba(127,216,255,.35)';x.lineWidth=2;x.stroke()}
  function button(label,y){const bw=210,bh=50,p=1+Math.sin(time*4)*.03;x.save();x.translate(W/2,y);x.scale(p,p);x.fillStyle='#FFE27A';rr(-bw/2,-bh/2,bw,bh,10);x.fill();x.fillStyle='#1a1405';x.font=bagel(24);x.textAlign='center';x.textBaseline='middle';x.fillText(label,0,1);x.restore()}
  function drawIntro(){panel(96,452);x.textAlign='center';x.textBaseline='middle';x.font=bagel(50);x.lineWidth=8;x.strokeStyle='#04081a';x.strokeText('Splitstorm',W/2,152);x.fillStyle='#FFE27A';x.fillText('Splitstorm',W/2,152);
    const rows=[['Slide left and right.','Your cannon fires by itself.'],['Big rocks split in two.','Smash them down to dust!'],['Catch power-ups: spread, rapid,','laser, shield, bomb, extra hull.'],['A rock that lands on you costs','a hull. You have three.']];
    for(let i=0;i<4;i++){const y=214+i*64,ix=70;
      if(i===0){x.save();x.translate(ix,y+6);x.fillStyle='#dde8ff';x.beginPath();x.moveTo(-16,8);x.lineTo(-11,-4);x.lineTo(11,-4);x.lineTo(16,8);x.closePath();x.fill();x.fillStyle='#9FE8FF';x.fillRect(-2.5,-18,5,14);x.restore()}
      else if(i===1){const s=RS[2][0];x.drawImage(s.cn,ix-s.sz/2*.75,y-s.sz/2*.75,s.sz*.75,s.sz*.75);x.font=bagel(13);x.fillStyle='#fff';x.fillText('10',ix,y)}
      else if(i===2){x.fillStyle=COLS[YEL];x.beginPath();for(let k=0;k<6;k++){const a=k/6*TAU+Math.PI/6;x.lineTo(ix+Math.cos(a)*16,y+Math.sin(a)*16)}x.closePath();x.fill();powIcon('spread',ix,y,.95)}
      else{for(let k=0;k<3;k++){const hx=ix-20+k*20;x.fillStyle='#dde8ff';x.beginPath();x.moveTo(hx-7,y+5);x.lineTo(hx-4,y-2);x.lineTo(hx+4,y-2);x.lineTo(hx+7,y+5);x.closePath();x.fill();x.fillRect(hx-1.5,y-9,3,7)}}
      x.textAlign='left';x.fillStyle='#eef4ff';x.font=figF(700,16);x.fillText(rows[i][0],108,y-10);x.fillStyle='rgba(220,232,255,.7)';x.fillText(rows[i][1],108,y+11);x.textAlign='center'}
    x.font=figF(700,14);x.fillStyle='rgba(220,232,255,.75)';x.fillText('Space or the bomb button sets off a bomb.',W/2,468);button('Play',508);x.font=figF(700,13);x.fillStyle='rgba(220,232,255,.6)';x.fillText('Best '+prevBest+' pts',W/2,544)}
  function drawOver(){panel(150,350);x.textAlign='center';x.textBaseline='middle';x.font=bagel(30);x.fillStyle='#FF9EC4';x.fillText('Storm over',W/2,192);x.font=bagel(58);x.fillStyle='#fff';x.fillText(String(score),W/2,252);
    x.font=figF(800,15);x.fillStyle=newBest?'#FFE27A':'rgba(220,232,255,.7)';x.fillText(newBest?'New personal best!':'Best '+Math.max(prevBest,score)+' pts',W/2,296);
    x.font=figF(700,15);x.fillStyle='#cfe0ff';x.fillText('Wave '+wave+'   ·   '+kills+' rocks   ·   best combo '+bestCombo,W/2,332);if(time-overT>.8)button('Play again',414);x.font=figF(700,13);x.fillStyle='rgba(220,232,255,.55)';x.fillText('or press Enter',W/2,456)}
  let lastDt=0;
  function draw(){const s1=shake>0?(Math.random()-.5)*shake:0,s2=shake>0?(Math.random()-.5)*shake:0;x.setTransform(DPR,0,0,DPR,0,0);x.drawImage(bg,0,0,W,H);
    for(let i=0;i<3;i++){const o=SOFF[i];x.drawImage(SL[i],0,o,W,H);x.drawImage(SL[i],0,o-H,W,H)}
    x.setTransform(DPR,0,0,DPR,s1*DPR,s2*DPR);x.drawImage(ground,0,GY-40,W,H-GY+40);
    for(const rk of rocks){const hgt=GY-rk.y-rk.r,a=Math.max(0,1-hgt/420);if(a<=0)continue;x.globalAlpha=a*.5;x.fillStyle='#000';x.beginPath();x.ellipse(rk.x,GY+3,rk.r*(.5+.5*a),4+rk.r*.12,0,0,TAU);x.fill()}x.globalAlpha=1;
    drawLaser();drawBullets();for(const rk of rocks)drawRock(rk);drawPows();if(state!=='over'&&!(state==='dying'&&dieT>.2))drawShip();drawParts();drawRings(lastDt);
    if(bombFx>0){x.globalCompositeOperation='lighter';x.globalAlpha=Math.max(0,bombFx/.6)*.5;x.strokeStyle='#fff';x.lineWidth=30;x.beginPath();x.arc(bombX,GY,bombR,0,TAU);x.stroke();x.globalAlpha=1;x.globalCompositeOperation='source-over'}
    x.setTransform(DPR,0,0,DPR,0,0);drawFloats(lastDt);drawHud();drawBanner();
    if(flash>0){x.globalAlpha=flash*.6;x.fillStyle=COLS[flashC];x.fillRect(0,0,W,H);x.globalAlpha=1}
    if(state==='intro')drawIntro();else if(state==='over')drawOver();else if(state==='paused'){panel(260,150);x.textAlign='center';x.font=bagel(36);x.fillStyle='#fff';x.fillText('Paused',W/2,310);x.font=figF(700,15);x.fillStyle='rgba(220,232,255,.75)';x.fillText('Tap or press P to keep going',W/2,356)}}

  /* ---------- input ---------- */
  function lp(e){const r=cv.getBoundingClientRect(),w=cv.clientWidth||r.width,h=cv.clientHeight||r.height;return[(e.clientX-r.left-cv.clientLeft)*W/w,(e.clientY-r.top-cv.clientTop)*H/h]}
  function start(){unlockAudio&&unlockAudio();reset();state='play';beep(523,.08,'triangle',.06);setTimeout(()=>beep(784,.1,'triangle',.06),70)}
  c.on(cv,'pointerdown',e=>{e.preventDefault();const[px,py]=lp(e);
    if(state==='intro'){start();return}if(state==='over'){if(time-overT>.8)start();return}if(state==='paused'){state='play';return}if(state!=='play')return;
    if(Math.hypot(px-BOMBX,py-BOMBY)<BOMBR+10){useBomb();return}
    ptrMode=e.pointerType;if(e.pointerType!=='mouse'){dragId=e.pointerId;dragX0=px;tx0=tx=sx;try{cv.setPointerCapture(e.pointerId)}catch(_){}}else tx=px});
  c.on(cv,'pointermove',e=>{const[px]=lp(e);if(e.pointerType==='mouse'){ptrMode='mouse';if(!keyL&&!keyR)tx=px}else if(e.pointerId===dragId)tx=tx0+(px-dragX0)*1.35});
  c.on(cv,'pointerup',e=>{if(e.pointerId===dragId)dragId=-1});c.on(cv,'pointercancel',()=>{dragId=-1});c.on(cv,'contextmenu',e=>e.preventDefault());
  c.on(document,'keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A'){keyL=true;e.preventDefault()}else if(k==='ArrowRight'||k==='d'||k==='D'){keyR=true;e.preventDefault()}
    else if(k===' '||k==='Enter'||k==='b'||k==='B'||k==='ArrowUp'){e.preventDefault();if(e.repeat)return;if(state==='intro')start();else if(state==='over'){if(time-overT>.8)start()}else if(state==='paused')state='play';else if(k!=='Enter')useBomb()}
    else if(k==='p'||k==='P'||k==='Escape'){if(state==='play')state='paused';else if(state==='paused')state='play'}});
  c.on(document,'keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A'){keyL=false;tx=sx}else if(k==='ArrowRight'||k==='d'||k==='D'){keyR=false;tx=sx}});
  c.on(window,'blur',()=>{keyL=keyR=false;if(state==='play')state='paused'});
  c.on(document,'visibilitychange',()=>{if(document.hidden&&state==='play')state='paused'});

  prevBest=c.best()||0;wave=1;stat();
  c.loop(ms=>{let dt=ms/1000;lastDt=dt;if(freeze>0){freeze-=dt;dt=0}if(state==='paused')dt=0;if(state==="dying")dt*=.5;update(dt);if(dt===0)lastDt=0;draw()});
  return()=>{try{master&&master.disconnect()}catch(e){}};
}});
</script>
