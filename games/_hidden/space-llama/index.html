  function bomb(){if(bombs<=0||state!=='play')return;bombs--;say('BOMB!',900);noise(.8,'lowpass',300,.5);sweep(200,40,.8,'sawtooth',.1);vig.style.background='radial-gradient(circle,rgba(255,255,255,.9),transparent)';vig.style.opacity=1;setTimeout(()=>{vig.style.background='';},200);foes.forEach(f=>{f.hp=0});ebul.forEach(b=>b.l=0);if(boss)hitBoss(25)}

  function startSector(){clearAll();const s=SECT[si];scene.background.setHex(s.col);scene.fog.color.setHex(s.fogc);hp=maxhp;bombs=3;power=0;tl=0;spawnT=1;pos.set(0,0);ship.visible=true;inv=1.5;state='play';say(s.name,2200)}
