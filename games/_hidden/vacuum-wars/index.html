function heroCat(T){const g=humanoid(T,{skin:0xFF9F43,shirt:0x8c96a8,pants:0x5a6474,eye:0x2BB673});const h=g.userData.head;part(T,new T.ConeGeometry(.12,.22,4),M(T,0xFF9F43),-.16,.34,0,h);part(T,new T.ConeGeometry(.12,.22,4),M(T,0xFF9F43),.16,.34,0,h);const tail=part(T,cy(T,.05,.05,.8),M(T,0xFF9F43),0,1,-.35,g);tail.rotation.x=-.8;g.userData.anim=(P,dt)=>{tail.rotation.z=Math.sin(performance.now()/300)*.4};part(T,bx(T,.8,.3,.5),M(T,0x5a6474),0,1.55,-.1,g);return g}

  const vac=(T,s)=>{const g=new T.Group();part(T,cy(T,.55,.6,.3,24),M(T,0x3a3552),0,.18,0,g);part(T,cy(T,.4,.4,.05,24),M(T,0x6b7280),0,.35,0,g);part(T,sp(T,.08),M(T,0xF2352A,{emissive:0xff0000}),0,.38,.3,g);const br=new T.Group();part(T,bx(T,.9,.05,.08),M(T,0xFFD23F),0,0,0,br);part(T,bx(T,.08,.05,.9),M(T,0xFFD23F),0,0,0,br);br.position.set(0,.05,.45);g.add(br);g.userData.spin=br;if(s)g.scale.setScalar(s);return g};

  return runShooter(root,c,{id:'vacuum',short:'Vacuum Wars',view:'tps',hero:heroCat,camDist:4.6,camHeight:2.2,tag:'A Detourr original · 3D third-person shooter',title:'Vacuum Wars',hitColor:[0xFFD23F,0x6b7280],killColors:[0x3a3552,0x6b7280,0xFFD23F,0xF2352A],killWord:'robots unplugged',
    intro:['You are <b>Captain Whiskers</b>, a very serious house cat. The humans left on vacation and put the smart-home in “deep clean” mode. The vacuums got a software update. Now they want to suck up everything, cats included.','Luckily you’ve been secretly building a mech suit out of a toaster and a Roomba charger. Time to defend the house.'],
    player:{hp:110,speed:6.2},hpLabel:'HP',
    weapons:[{name:'Laser Pointer',auto:true,rate:.09,dmg:13,spread:.01,tracer:0xF2352A,impact:0xF2352A,model:T=>{const g=new T.Group();part(T,cy(T,.05,.05,.5,10),M(T,0x6b7280),0,0,-.2,g).rotation.x=Math.PI/2;part(T,sp(T,.05),M(T,0xF2352A,{emissive:0xff0000}),0,0,-.46,g);return g},sound:()=>beep(1800+Math.random()*200,.03,'sine',.03)},
      {name:'Yarn Shotgun',rate:.85,dmg:12,pellets:9,spread:.14,ammo:26,tracer:0xFF8FB1,kick:.2,model:gunModel(0xFF8FB1,0xB9A7FF,{len:.5,bore:.08}),sound:()=>{noise(.18,'lowpass',1400,.4);sweep(300,90,.12,'square',.05)}},
      {name:'Hairball Cannon',rate:1,dmg:80,ammo:10,proj:{speed:18,grav:5,splash:4,color:0x8a5a2b,size:.25},model:gunModel(0x2BB673,0x8a5a2b,{drum:0x8a5a2b,bore:.1}),sound:()=>{sweep(180,60,.3,'sawtooth',.08);noise(.2,'lowpass',500,.2)}}],
    enemies:{
      r:{name:'Robo Vacuum',hp:40,speed:3.6,kind:'melee',dmg:11,cooldown:.9,score:100,height:.6,radius:.6,drop:.2,build:T=>vac(T),attackSound:()=>noise(.2,'bandpass',900,.2)},
      d:{name:'Duster Drone',hp:34,speed:3,kind:'ranged',range:18,cooldown:1.5,score:140,height:2.5,hover:2,radius:.5,proj:{speed:14,color:0xb9b4c9,dmg:9,size:.2},build:duster},

    boss:{ch:'K',deathLine:'King Roomba powers down. His battery indicator blinks red, then goes dark.',special:(e,dt,api,{dist,dx,dz})=>{e.spT=(e.spT||3)-dt;if(e.spT<=0){e.spT=c.pick(3.5,2.6,1.9);for(let k=0;k<12;k++)api.enemyShoot(e,e.d.proj,Math.cos(k*.52),Math.sin(k*.52),1,0);api.say('DUST STORM!',1000)}const fr=e.hp/e.max;if(fr<.7&&e.phase<1||fr<.4&&e.phase<2){e.phase++;api.say('King Roomba deploys his minions!',1600);for(let k=0;k<5;k++){const s=api.spawn('r',e.x+Math.cos(k*1.2)*3,e.z+Math.sin(k*1.2)*3);s.seen=true}}}},

      {name:'The Kitchen',goal:'Unplug every vacuum in the kitchen',objective:'clear',theme:Object.assign({},HOUSE,{floor:TX.tiles('#ffffff','#d9e4ee',4),wall:TX.tiles('#e6f2ef','#cfe2dd',6)}),brief:['The vacuums ambushed your food bowl. That’s personal.','Clear the kitchen. The counters (brown blocks) are good cover.'],talk:[['Captain Whiskers','“Nobody touches the kibble.”']],after:'You find a note on the fridge: “ROBOT UPDATE INSTALLED: CLEAN EVERYTHING.” The living room hums ominously.',
        map:['##################','#P......=.....r..#','#..===..=..d.....#','#...............r#','#..r....===......#','#......=...=..d..#','#.x....=...=.....#','#h..........a..r.#','######E###########']},
      {name:'The Living Room',goal:'Hold the couch fort',objective:'waves',waves:[[['r',6]],[['r',5],['d',3]],[['r',6],['d',3],['x',1]],[['x',2],['d',5],['r',6]]],theme:Object.assign({},HOUSE,{floor:TX.carpet('#6b8fc4','#5a7ab0')}),brief:['You built a fort out of couch cushions. The vacuums are coming through every doorway.','Four waves. The Hairball Cannon is great against groups of vacuums.'],talk:[['Duster Drone','“BEEP. DUST DETECTED. CAT DETECTED. SAME THING.”']],after:'The last vacuum sputters out. A loud whirring comes from the garage: the charging dock of King Roomba himself.',
