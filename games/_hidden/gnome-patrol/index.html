  const shroom=T=>{const g=new T.Group();part(T,cy(T,.2,.25,.8,12),M(T,0xf4f0ea),0,.4,0,g);const cap=part(T,sp(T,.6),M(T,0x8a2be2,{emissive:0x3a1060}),0,.95,0,g);cap.scale.y=.6;for(let k=0;k<6;k++)part(T,sp(T,.08),M(T,0xffffff),Math.cos(k)*.4,1.15,Math.sin(k)*.4,g);return g};
  return runShooter(root,c,{id:'gnome',short:'Gnome Patrol',view:'tps',hero:heroKid,flashlight:true,camDist:4,tag:'A Detourr original · 3D third-person',title:'Gnome Patrol',hitColor:[0x7FC8F8,0xffffff],killColors:[0x7FC8F8,0xF2352A,0xffffff],killWord:'gnomes soaked',
    intro:['Grandma always said: “Never turn your back on the garden gnomes.” You thought she was joking. Then she went to bed, and the gnomes started moving.','They only move when nobody is looking at them. Your flashlight freezes them in place. Your water blaster knocks them back to being lawn decor. Protect Grandma’s house until sunrise.'],

      p:{name:'Spore Shroom',hp:40,speed:0,kind:'ranged',range:18,cooldown:1.8,score:140,height:1.4,radius:.6,proj:{speed:11,color:0xb070ff,dmg:9,size:.22},build:shroom,sight:22},
      Q:{name:'The Gnome King',hp:1400,speed:3.2,kind:'melee',dmg:26,reach:2.4,cooldown:1.1,score:3500,height:2,radius:1,build:T=>{const g=gnome(T,2.4);part(T,cy(T,.25,.3,.2,5),M(T,0xFFD23F),0,1.95,0,g);return g},ai:(e,dt,api,info)=>{const f=freezeAI(e,dt,api,info);if(f){e.slowT=(e.slowT||0)+dt;if(e.slowT<1.5)return true}else e.slowT=0;return false}}},
    boss:{ch:'Q',deathLine:'The Gnome King topples over and shatters into harmless garden ceramic.',special:(e,dt,api)=>{const fr=e.hp/e.max;if(fr<.66&&e.phase<1||fr<.33&&e.phase<2){e.phase++;api.say('The King summons his court!',1600);for(let k=0;k<4;k++){const s=api.spawn('g',e.x+Math.cos(k*1.6)*4,e.z+Math.sin(k*1.6)*4);s.seen=true}}}},
