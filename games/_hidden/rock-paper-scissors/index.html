<div class="wrap"><div class="top"><a class="pill" href="/">← All games</a></div><main class="card"><div class="body"><h1>Rock Paper Scissors</h1><p>Best of forever against the computer.</p></div></main></div>

<script>
/* ===================== Rock Paper Scissors: game code ===================== */
G.push({id:'rps',name:'Rock Paper Scissors',kind:'game',tint:'var(--pink)',blurb:'Best of forever against the computer.',fmt:b=>b+' wins',
art:'<text x="60" y="46" font-size="26" text-anchor="middle">✊✋✌️</text>',
run(root,c){
  const M=[['rock','✊'],['paper','✋'],['scissors','✌️']];const t=S.get('rps',{w:0,l:0,d:0});const you=el('div',{class:'hand'},'❔'),cpu=el('div',{class:'hand'},'❔');const msg=el('p',{class:'big-text',style:'text-align:center'},'Pick one.');
  const cap=s=>s[0].toUpperCase()+s.slice(1);const st=()=>c.stat('W '+t.w+' · L '+t.l+' · T '+t.d);
  function play(i){const j=rand(3);you.textContent=M[i][1];cpu.textContent=M[j][1];const r=(i-j+3)%3;if(r===0){t.d++;msg.textContent='Tie!';beep(400,.1)}else if(r===1){t.w++;msg.textContent=cap(M[i][0])+' beats '+M[j][0]+'. You win!';beep(880,.15,'triangle')}else{t.l++;msg.textContent=cap(M[j][0])+' beats '+M[i][0]+'. You lose.';beep(160,.2,'sawtooth')}S.set('rps',t);c.best(t.w);st()}
  root.append(el('div',{class:'vs'},el('div',null,you,el('small',null,'You')),el('b',{style:'font-family:var(--display);font-weight:400;font-size:28px'},'vs'),el('div',null,cpu,el('small',null,'Computer'))),msg,el('div',{class:'row'},M.map((m,i)=>el('button',{class:'btn',type:'button',style:'font-size:20px',onclick:()=>play(i)},m[1]+' '+m[0]))),el('p',{class:'hint'},'Keys 1, 2 and 3 work too.'));
  c.on(document,'keydown',e=>{const n=+e.key;if(n>=1&&n<=3)play(n-1)});st();
}});
</script>
