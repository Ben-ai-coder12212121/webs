<div class="wrap"><div class="top"><a class="pill" href="/">← All games</a></div><main class="card"><div class="body"><h1>Pebble Boy</h1><p>Pick up pebbles, stack them into stairs and climb your way to the door. A classic carry-and-climb puzzle.</p></div></main></div>

<script>
/* ===================== Pebble Boy: game code ===================== */
const PEB_LV=[
 ['..........','..........','..........','.....#...D','P.o..#...#','##########'],
 ['...........','...........','........#.D','P..o...##.#','###########'],
 ['..........','..........','.........D','...#.....#','Po.#...o.#','##########'],
 ['.............','.............','......#.....D','P.o.o.##...##','#############'],
 ['...........','...........','..........D','......###.#','Po..o.###.#','###########'],
 ['............','............','............','.....#....oD','Po.o.##...##','############'],
 ['.............','.............','.............','.........o...','.........#...','P..oo.##.##.D','#############'],
 ['..............','..............','..............','........o.....','........#...#D','Poo.o...###.##','##############']];
function pebParse(L){const H=L.length,W=L[0].length;let p=null,d=null;const g=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=L[y][x];if(ch==='P')p={x,y};if(ch==='D')d={x,y};g.push(ch==='#'?1:ch==='o'?2:0)}return{W,H,g,px:p.x,py:p.y,f:1,carry:0,door:d}}
function pebFall(st,x,y){while(y+1<st.H&&st.g[(y+1)*st.W+x]===0)y++;return y}
function pebStep(st,a){const s={W:st.W,H:st.H,g:st.g.slice(),px:st.px,py:st.py,f:st.f,carry:st.carry,door:st.door};const W=s.W,at=(x,y)=>x<0||x>=W||y<0||y>=s.H?1:s.g[y*W+x];
  if(a==='L'||a==='R'){const dx=a==='L'?-1:1;if(s.f!==dx){s.f=dx;return s}const nx=s.px+dx;if(at(nx,s.py)===0&&(!s.carry||at(nx,s.py-1)===0)){s.px=nx;s.py=pebFall(s,nx,s.py);return s}return s}
  if(a==='U'){const nx=s.px+s.f;if(at(nx,s.py)!==0&&at(nx,s.py-1)===0&&at(s.px,s.py-1)===0&&(!s.carry||(at(s.px,s.py-2)===0&&at(nx,s.py-2)===0))){s.px=nx;s.py=s.py-1;return s}return s}
  if(a==='D'){const nx=s.px+s.f;if(!s.carry){if(at(nx,s.py)===2&&at(nx,s.py-1)===0&&at(s.px,s.py-1)===0){s.g[s.py*W+nx]=0;s.carry=1;const top=s.py-1;void top}}else{if(at(nx,s.py)===0&&at(nx,s.py-1)===0){const yy=pebFall(s,nx,s.py);s.g[yy*W+nx]=2;s.carry=0}else if(at(nx,s.py)!==0&&at(nx,s.py-1)===0){s.g[(s.py-1)*W+nx]=2;s.carry=0}}return s}return s}
const pebWon=s=>s.px===s.door.x&&s.py===s.door.y;
G.push({id:'pebble',name:'Pebble Boy',kind:'puzzle',levels:true,tint:'#8c86a3',blurb:'Pick up pebbles, stack them into stairs and climb your way to the door. A classic carry-and-climb puzzle.',fmt:b=>'level '+b,
art:'<rect width="120" height="72" fill="#cfe8ff"/><rect y="60" width="120" height="12" fill="#5A5470"/><rect x="90" y="36" width="14" height="24" fill="#FF9F43" stroke="#1D1A2F" stroke-width="2"/><rect x="70" y="46" width="14" height="14" fill="#5A5470"/><circle cx="54" cy="53" r="7" fill="#8c86a3" stroke="#1D1A2F" stroke-width="2"/><rect x="24" y="40" width="14" height="20" rx="4" fill="#2d6fd6" stroke="#1D1A2F" stroke-width="2"/><circle cx="31" cy="30" r="7" fill="#8c86a3" stroke="#1D1A2F" stroke-width="2"/>',
run(root,c){const Wc=700,Hc=460;const[cv,x]=mk(Wc,Hc,'width:min(100%,700px)');root.append(cv);const keys=holdPad(root,[['L','◀'],['U','⤴ Climb'],['D','⤓ Pick/drop'],['R','▶']]);const row=el('div',{class:'row'});const ub=el('button',{class:'btn',type:'button'},'↶ Undo'),rb=el('button',{class:'btn',type:'button'},'Restart');row.append(ub,rb);root.append(row,el('p',{class:'hint'},'←/→ walk (or turn), ↑ climb one step up, ↓ pick up the pebble in front of you or put it down. You can’t jump, so build stairs!'));
  let lvl=Math.min(PEB_LV.length,Math.max(1,S.get('peb_lv',1))),st,hist,state='play',moves=0;const kl={};
  function load(){st=pebParse(PEB_LV[lvl-1]);hist=[];state='play';moves=0;c.stat('Pebble Boy · level '+lvl)}
  function act(a){if(state!=='play')return;const ns=pebStep(st,a);hist.push(st);st=ns;moves++;beep(a==='D'?300:500,.03,'triangle',.03);if(pebWon(st)){state='won';S.set('peb_lv',Math.max(S.get('peb_lv',1),Math.min(PEB_LV.length,lvl+1)));c.best(lvl);[523,659,784].forEach((q,i)=>c.after(()=>beep(q,.15,'triangle',.06),i*100))}}
  function draw(){x.fillStyle='#cfe8ff';x.fillRect(0,0,Wc,Hc);const Q=Math.min(Wc/st.W,(Hc-30)/st.H),ox=(Wc-st.W*Q)/2,oy=Hc-st.H*Q;for(let i=0;i<st.g.length;i++){const gx=i%st.W,gy=i/st.W|0,v=st.g[i],px=ox+gx*Q,py=oy+gy*Q;if(v===1){x.fillStyle='#5A5470';x.fillRect(px,py,Q,Q);x.strokeStyle='#3a3552';x.strokeRect(px+1,py+1,Q-2,Q-2)}else if(v===2){x.fillStyle='#8c86a3';x.strokeStyle='#1D1A2F';x.lineWidth=2.5;x.beginPath();x.arc(px+Q/2,py+Q/2+2,Q*.42,0,7);x.fill();x.stroke()}}
    const d=st.door;x.fillStyle='#FF9F43';x.strokeStyle='#1D1A2F';x.lineWidth=2.5;x.fillRect(ox+d.x*Q+Q*.15,oy+d.y*Q,Q*.7,Q);x.strokeRect(ox+d.x*Q+Q*.15,oy+d.y*Q,Q*.7,Q);x.fillStyle='#FFD23F';x.beginPath();x.arc(ox+d.x*Q+Q*.7,oy+d.y*Q+Q*.55,3,0,7);x.fill();
    const px=ox+st.px*Q,py=oy+st.py*Q;x.fillStyle='#2d6fd6';x.beginPath();x.roundRect?x.roundRect(px+Q*.2,py+Q*.15,Q*.6,Q*.85,8):x.rect(px+Q*.2,py+Q*.15,Q*.6,Q*.85);x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(px+Q/2+st.f*Q*.12,py+Q*.35,Q*.08,0,7);x.fill();if(st.carry){x.fillStyle='#8c86a3';x.beginPath();x.arc(px+Q/2,py-Q*.45,Q*.42,0,7);x.fill();x.stroke()}
    x.fillStyle='#1D1A2F';x.font='700 15px "JetBrains Mono"';x.textAlign='left';x.fillText('LEVEL '+lvl+'/'+PEB_LV.length+'  moves '+moves,12,22);if(state==='won')banner(x,Wc,Hc,'You made it!',lvl<PEB_LV.length?'Tap for level '+(lvl+1):'All levels done! Tap to replay')}
  c.on(document,'keydown',e=>{const m={arrowleft:'L',a:'L',arrowright:'R',d:'R',arrowup:'U',w:'U',arrowdown:'D',s:'D'}[e.key.toLowerCase()];if(m){e.preventDefault();act(m)}});c.on(cv,'pointerdown',()=>{if(state==='won'){lvl=lvl<PEB_LV.length?lvl+1:1;load()}});ub.addEventListener('click',()=>{if(hist.length){st=hist.pop();state='play'}});rb.addEventListener('click',load);
  load();c.loop(()=>{['L','R','U','D'].forEach(k=>{if(keys[k]&&!kl[k])act(k);kl[k]=keys[k]});draw()})}});
</script>
