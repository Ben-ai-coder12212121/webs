function newTile(t){return{t:t,v:rand(5),lv:1,hp:BLD[t]?BLD[t].hp:1,prog:1,was:0,crop:Math.random(),wk:0,br:0}}
function genWorld(){
  T=[];for(let k=0;k<NN;k++)T.push(newTile(GRASS));
  // lake in the back corner and a creek to the left edge
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const d=Math.hypot((i-3.5)/3.6,(j-4)/3)+Math.sin(i*1.7+j)*.08;if(d<1)T[idx(i,j)].t=WATER}
  let cj=5;for(let i=0;i<5;i++){}
  for(let j=7;j<N;j++){const ci=2+Math.round(Math.sin(j*.6)*1.2);T[idx(ci,j)].t=WATER;if(j%4===1)T[idx(ci+1,j)].t=WATER}
  // forests
  const seeds=[[20,3],[21,19],[6,20],[17,1],[1,14],[22,10]];
  for(const [si,sj] of seeds)for(let k=0;k<16;k++){const i=si+Math.round(rnd(-2.6,2.6)),j=sj+Math.round(rnd(-2.6,2.6));if(inb(i,j)&&T[idx(i,j)].t===GRASS)T[idx(i,j)].t=TREE}
  for(let k=0;k<18;k++){const i=rand(N),j=rand(N);if(T[idx(i,j)].t===GRASS&&(Math.abs(i-12)>4||Math.abs(j-12)>4))T[idx(i,j)].t=TREE}
  const put=(i,j,t)=>{T[idx(i,j)]=newTile(t)};
  for(let i=6;i<=18;i++)put(i,12,ROAD);
  for(let j=7;j<=18;j++)put(12,j,ROAD);
  put(11,11,HALL);put(13,11,HOUSE);put(13,13,HOUSE);put(11,13,HOUSE);put(10,11,FARM);put(9,11,FARM);put(14,11,WORK);
  for(let j=9;j<=15;j++)for(let i=8;i<=16;i++){const q=T[idx(i,j)];if(q.t===TREE)q.t=GRASS}
  T[idx(10,13)].t=GRASS;
  const h1=idx(13,11),h2=idx(13,13),h3=idx(11,13);
  P=[];nextId=1;
  const a=mkP({fam:'Pebble',home:h1}),b=mkP({fam:'Pebble',home:h1}),k=mkP({fam:'Pebble',home:h1,kid:true});
  a.partner=b.id;b.partner=a.id;a.kids.push(k.id);b.kids.push(k.id);k.par=[a.id,b.id];
  const d=mkP({fam:'Crumb',home:h2}),e=mkP({fam:'Crumb',home:h2});d.partner=e.id;e.partner=d.id;
  const f=mkP({fam:'Puddle',home:h3});

  day=1;hour=7;food=30;mat=36;peak=P.length;log=[];memorials=[];scars=[];goalI=0;flags={};reqDone=0;partyDay=0;

}

    mood:70,hunger:rnd(60,95),energy:rnd(70,95),fun:rnd(50,80),trust:o.trust==null?62:o.trust,hp:3,fear:0,grief:0,griefFor:'',rel:{},mem:[],

const dist=new Float32Array(NN),prev=new Int32Array(NN),hp_=new Int32Array(NN*6),hk=new Float32Array(NN*6);

  const live=alive();const st=[['People',live.length],['Most ever',peak],['Families',live.filter(p=>p.partner&&p.id<p.partner).length],['Wishes granted',reqDone],['In Cloud Town',memorials.length]];
  card.innerHTML='<h3>The story of Tiny Town</h3><p><b>'+rankName(live.length)+'</b>, day '+day+'. '+st.map(s=>s[0]+': <b>'+s[1]+'</b>').join(' &middot; ')+'</p>'+(memorials.length?'<p>Remembered: '+memorials.map(m=>esc(m.n)).join(', ')+'</p>':'')+'<div class="tt-log">'+log.slice(0,40).map(l=>'<div><b>Day '+l.d+'</b> '+esc(l.s)+'</div>').join('')+'</div>';
  const go=el('button',{class:'go',type:'button'},'Close');go.addEventListener('click',closeModal);card.append(go);modal.append(card);view.append(modal)}
bHelp.addEventListener('click',()=>showHelp(false));bStory.addEventListener('click',showStory);
function toggleSpeed(){speed=speed===0?1:speed===1?2:speed===2?3:0;bSpeed.innerHTML=speed===0?svg('play'):'<b style="font:900 12px Figtree,sans-serif">'+speed+'x</b>';bSpeed.title=speed===0?'Paused: tap to play':'Speed '+speed+'x'}
bSpeed.addEventListener('click',toggleSpeed);bSpeed.innerHTML='<b style="font:900 12px Figtree,sans-serif">1x</b>';
chWish.addEventListener('click',()=>{if(!reqs.length)return toast('No wishes right now. Look for a ! above someone.');const r=reqs[(flags.wi=(flags.wi||0)+1)%reqs.length];const p=P.find(o=>o.id===r.pid);if(p){const [wx,wy]=w2(p.x,p.y);camX=wx;camY=wy;selectPerson(p)}});
function speedMul(){return Math.max(1,speed)}

/* ---------------- goals ---------------- */
const GOALS=[
  ['Tap a tiny person to say hello.',()=>flags.met,[0,4]],
  ['Build a new House (Build tab).',()=>flags['placed'+HOUSE],[0,6]],
  ['Drop a Food basket (Care tab).',()=>flags.gaveFood,[0,6]],
  ['Build another Farm so nobody goes hungry.',()=>flags['placed'+FARM],[10,0]],
  ['Grant a wish (look for a ! above someone).',()=>reqDone>=1,[0,10]],
  ['Grow your town to 10 people.',()=>alive().length>=10,[10,10]],
  ['Throw a Party.',()=>flags.party,[0,10]],
  ['Build a Market.',()=>count(MARKET,true)>0,[10,10]],
  ['Give someone a pat.',()=>flags.pat,[0,6]],
  ['Grow to 18 people.',()=>alive().length>=18,[15,15]],
  ['Build a School.',()=>count(SCHOOL,true)>0,[10,15]],
  ['Reach 75 trust.',()=>trustAvg>=75,[10,10]],
  ['Grow to 25 people and build a Fountain.',()=>count(FOUNT,true)>0,[15,15]],
  ['Earn the Sky Statue (85 trust and 12 people).',()=>count(STATUE)>0,[20,20]],
  ['Grow to 50 people (Big Town).',()=>alive().length>=50,[25,25]],
  ['Grow to 80 people (City).',()=>alive().length>=80,[40,40]]];
function goalText(){if(goalI>=GOALS.length)return 'Your City is thriving. Keep caring for it (or not...).';return '<b>Goal '+(goalI+1)+':</b> '+GOALS[goalI][0]}
function checkGoals(){if(goalI<GOALS.length&&GOALS[goalI][1]()){const r=GOALS[goalI][2];food+=r[0];mat+=r[1];toast('Goal done! '+(r[0]?'+'+r[0]+' food ':'')+(r[1]?'+'+r[1]+' materials':''),'good');jingle();goalI++;addLog('Goal reached: '+GOALS[goalI-1][0].replace(/\.$/,''))}}
let lastRank='';

/* ---------------- statue + town-wide checks ---------------- */
function townChecks(){
  const live=alive();
  if(trustAvg>=85&&live.length>=12&&!count(STATUE)){const h=partyTile()>=0?partyTile():idx(12,12);let spot=-1;for(let r=1;r<5&&spot<0;r++)for(let t=0;t<16;t++){const i=h%N+rand(r*2+1)-r,j=((h/N)|0)+rand(r*2+1)-r;if(inb(i,j)&&T[idx(i,j)].t===GRASS){spot=idx(i,j);break}}
    if(spot>=0){const nt=newTile(STATUE);nt.prog=0;nt.was=STATUE;T[spot]=nt;groundDirty=true;addLog('The townsfolk started building a statue to thank the Sky!');toast('The tiny people are building a statue of you!','good');jingle()}}
  let b=0;b+=Math.min(6,count(PARK,true)*1.5)+Math.min(6,count(FOUNT,true)*3)+Math.min(4,count(MARKET,true)*2)+(count(STATUE,true)?4:0);bonusCache=b}

/* ---------------- camera ---------------- */
function centerCam(){const h=partyTile()>=0?partyTile():idx(12,12);const [wx,wy]=w2(h%N+.5,((h/N)|0)+.5);camX=wx;camY=wy;zoom=cw<600?1:1.35}

/* ---------------- main loop ---------------- */
let simAcc=0,hourPrev=Math.floor(hour),saveT=0,uiT=0,arrT=0;
if(!load()){genWorld()}
resize();centerCam();assignJobs();assignHomes();setTab('care');
if(!S.get('tinytown_help',0))showHelp(true);
c.loop((dtMs)=>{
  const rdt=dtMs/1000;time+=rdt;
  for(const k in cool)if(cool[k]>0)cool[k]=Math.max(0,cool[k]-rdt);
  if(toastT>0){toastT-=rdt;if(toastT<=0)toastEl.classList.remove('on')}
  // camera keys + follow
  const pan=420*rdt/zoom;if(keys.arrowleft||keys.a)camX-=pan;if(keys.arrowright||keys.d)camX+=pan;if(keys.arrowup||keys.w)camY-=pan;if(keys.arrowdown||keys.s)camY+=pan;
  if(follow){if(!P.includes(follow)||follow.st==='gone')follow=null;else{const [wx,wy]=w2(follow.x,follow.y);camX+=(wx-camX)*Math.min(1,rdt*4);camY+=(wy-camY)*Math.min(1,rdt*4)}}
  clampCam();
  // sim
  const sdt=rdt*speed;
  if(speed>0){
    const night=hour>=22||hour<6;hour+=sdt*(night?1/1.5:1/6);
    if(hour>=24){hour-=24;newDay()}
    const hi=Math.floor(hour);if(hi!==hourPrev){hourPrev=hi;assignHomes();if(hi%2===0)assignJobs();arrT++;if(arrT%3===0)arrivals();if(hi===17||hi===8)for(const p of P)if(p.st==='work'||p.st==='build')p.tm=0}
    for(let n=0;n<P.length;n++){const p=P[n];if(p.st==='held')p.holdT+=rdt;if(p.st==='fly'){stepFly(p,rdt);continue}if(p.st==='ghost'){p.ghostT+=rdt;p.z+=rdt*26;p.x+=Math.sin(time*2+p.id)*rdt*.3;continue}stepPerson(p,sdt)}
    if(partyOn>0){partyOn-=sdt/6;if(Math.random()<rdt*8&&partyAt>=0)partAt(partyAt,'confetti');if(Math.random()<rdt*1.5&&!muted)beep(hz([0,4,7,9,12][rand(5)]+12),.12,'triangle',.025)}
    reqTimer-=sdt;if(reqTimer<=0){reqTimer=rnd(22,38);genReq()}checkReqs(sdt);
  }else{for(const p of P){if(p.st==='held')p.holdT+=rdt;if(p.st==='fly')stepFly(p,rdt)}}
  // held person follows the pointer
  if(heldP){const [wx,wy]=toWorld(ptr.x,ptr.y+14+(heldP.kid?11:14.5)*zoom+40*zoom);const [tx,ty]=toTile(wx,wy);heldP.x=clamp(tx,.2,N-.2);heldP.y=clamp(ty,.2,N-.2);heldP.z=40;
    if(holdSamples.length>=2){const a=holdSamples[0],b=holdSamples[holdSamples.length-1];const sp=Math.hypot(b.x-a.x,b.y-a.y)/Math.max(.016,(b.t-a.t)/1000);if(sp>1600){heldP.dizzy=3;if(Math.random()<rdt*2)say(heldP,['Dizzy!','Wooah!','Stop shaking!'],true,1.2);heldP.trust=Math.max(0,heldP.trust-rdt*2)}}}
  // remove ghosts that floated away and leavers who reached the edge
  for(let n=P.length-1;n>=0;n--){const p=P[n];if((p.st==='ghost'&&p.ghostT>6.5)||p.st==='gone'){if(sel===p)closeSide();if(p.st==='gone')addLog(p.name+' walked out of town.');P.splice(n,1);for(const o of P){if(o.partner===p.id)o.partner=0}}}
  // fx
  for(let n=FX.length-1;n>=0;n--){const f=FX[n];f.t=(f.t||0)+rdt;
    if(f.k==='crate'){f.z-=rdt*(f.z>20?150:80);if(f.z<=0){landCrate(f);FX.splice(n,1)}continue}
    if(f.k==='meteor'&&f.t>=f.d){FX.splice(n,1);const r=impact(f.fx,f.fy,1.9,5,'meteor');const ci=Math.floor(f.fx),cj=Math.floor(f.fy);if(inb(ci,cj)){const q=T[idx(ci,cj)];if(q.t!==WATER&&q.t!==RUBBLE){const was=q.t===ROAD?ROAD:0;T[idx(ci,cj)]=newTile(CRATER);T[idx(ci,cj)].was=was;T[idx(ci,cj)].prog=0}else FX.push({k:'splash',fx:f.fx,fy:f.fy,t:0})}groundDirty=true;
      shake=18;flash=.6;FX.push({k:'ring',fx:f.fx,fy:f.fy,t:0,r:3});dust(f.fx,f.fy,22,1.6);debris(f.fx,f.fy,18,['#8c7a6b','#6b5a4c','#FF9F43','#FFD23F']);noise(1.2,'lowpass',180,.35);kick();continue}
    if(f.k==='foot'){if(!f.hit&&f.t>=.55){f.hit=1;impact(f.fx,f.fy,1.3,3,'stomp');shake=12;FX.push({k:'ring',fx:f.fx,fy:f.fy,t:0,r:2.2});dust(f.fx,f.fy,18,1.1);kick();noise(.35,'lowpass',220,.25)}if(f.t>1.3)FX.splice(n,1);continue}
    if(f.k==='zap'&&f.t>.6){FX.splice(n,1);continue}
    if((f.k==='ring'&&f.t>.6)||(f.k==='splash'&&f.t>.8)){FX.splice(n,1);continue}}
  if(bolt){const b=bolt;if(b.z>0){b.z=Math.max(0,b.z-rdt*900);if(b.z===0){impact(b.fx,b.fy,1.1,3,'robot stomp');shake=14;kick();dust(b.fx,b.fy,16,1)}}
    else{b.t-=rdt;const dx=b.tx-b.fx,dy=b.ty-b.fy,d=Math.hypot(dx,dy);const sp=b.t>4?1.25:.6;if(d>.15){b.fx+=dx/d*Math.min(d,sp*rdt);b.fy+=dy/d*Math.min(d,sp*rdt);if(Math.abs(dx-dy)>.05)b.face=(dx-dy)>0?1:-1;b.ph+=rdt*7;
        b.step+=rdt;if(b.step>.48){b.step=0;impact(b.fx,b.fy,.8,3,'robot stomp',false);shake=Math.max(shake,6);kick();dust(b.fx,b.fy,6,.6)}}
      else{b.ph+=rdt*2}
      if(Math.random()<rdt*.4){/* robot chatter */}
      if(b.t<=0){dust(b.fx,b.fy,24,1.2);FX.push({k:'ring',fx:b.fx,fy:b.fy,t:0,r:2});noise(.5,'lowpass',500,.15);bolt=null;addLog('Big Bolt wound down and vanished in a puff.');toast('Big Bolt ran out of wind-up power.')}}}
  if(shake>0)shake=Math.max(0,shake-rdt*30);if(flash>0)flash=Math.max(0,flash-rdt*2);if(rainbowT>0)rainbowT-=rdt;
  // particles
  for(const p of PART){if(!p.on)continue;p.l-=rdt;if(p.l<=0){p.on=false;continue}p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.vy+=p.g*rdt;if(p.k===2||p.k===4){p.vx*=.97}}
  for(let n=FLO.length-1;n>=0;n--){FLO[n].t+=rdt;if(FLO[n].t>1.6)FLO.splice(n,1)}
  // storm: rain + people run
  if(stormOn){const [sx,sy]=toScreen(...w2(stormX,stormY));const cy=Math.max(46,sy-110*zoom-20);for(const r of RAIN){if(!r.on||r.y>sy+20*zoom){r.on=true;r.x=sx+rnd(-60,60)*Math.max(.7,zoom);r.y=cy+rnd(0,20);r.v=rnd(380,520)}r.y+=r.v*rdt;r.x-=rdt*60}
    if(speed>0)for(const p of P){if(p.inside||p.st==='ghost'||p.st==='faint'||p.st==='held'||p.st==='fly'||p.st==='panic')continue;const d=Math.hypot(p.x-stormX,p.y-stormY);if(d<2.4){p.fun=Math.max(0,p.fun-rdt*4);p.fear=Math.min(1,p.fear+rdt*.08);p.trust=Math.max(0,p.trust-rdt*.25);if(p.st!=='walk'||p.act!=='shelter'){if(!homeless(p)){goTo(p,p.home,'shelter');if(Math.random()<.4)say(p,'rain')}else panic(p,stormX,stormY,d)}}}}
  else for(const r of RAIN)r.on=false;
  // wave / flee from the hand
  if(ptr.in&&ptr.mouse&&!heldP&&(tool==='hand'||tab==='mis')){const [wx,wy]=toWorld(ptr.x,ptr.y);const [tx,ty]=toTile(wx,wy);
    for(const p of P){if(p.inside||p.kid&&p.trust>60&&false)continue;if(p.st!=='idle'&&p.st!=='walk'&&p.st!=='work'&&p.st!=='chat'&&p.st!=='play')continue;const d=Math.hypot(p.x-tx,p.y-ty);
      if(d<1.7&&p.trust<35&&p.st!=='flee'){p.st='flee';p.tm=1.2;let ax=p.x-tx,ay=p.y-ty;const l=Math.hypot(ax,ay)||1;p.vx=ax/l;p.vy=ay/l;p.path=null;if(p.waveCd<=0){p.waveCd=8;say(p,'wary')}}
      else if(d<2.2&&p.trust>68&&p.waveCd<=0){p.wave=1.4;p.waveCd=14;if(Math.random()<.5)say(p,'love')}}}
  // averages + HUD
  uiT-=rdt;if(uiT<=0){uiT=.25;
    const live=alive();let ts=0,ms=0;for(const p of live){ts+=p.trust;ms+=p.mood}trustAvg=live.length?ts/live.length:60;moodAvg=live.length?ms/live.length:60;
    if(live.length>peak){peak=live.length;c.best(peak)}
    townChecks();checkGoals();
    const rk=rankName(live.length);if(lastRank&&rk!==lastRank&&live.length>=10){toast('Tiny Town is now a '+rk+'!','good');addLog('Tiny Town grew into a '+rk+'!');jingle()}lastRank=rk;
    const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60/10)*10;const night=hour>=20||hour<6;
    chDay.firstChild.outerHTML;chDay.querySelector('svg').innerHTML=night?IC.moon:IC.clock;
    setChip(chDay,'Day '+day+' <small>'+((hh%12)||12)+':'+String(mm).padStart(2,'0')+(hh<12?' am':' pm')+'</small>');
    setChip(chPop,live.length+' <small>'+rk+'</small>');
    setChip(chFood,Math.floor(food)+'');setChip(chMat,Math.floor(mat)+'');
    setChip(chMood,'<span class="tt-meter"><i style="width:'+Math.round(moodAvg)+'%;background:'+(moodAvg>55?'#2BB673':moodAvg>35?'#FFD23F':'#F2352A')+'"></i></span>');
    setChip(chTrust,'Trust <span class="tt-meter"><i style="width:'+Math.round(trustAvg)+'%;background:'+(trustAvg>60?'#2BB673':trustAvg>35?'#FFD23F':'#F2352A')+'"></i></span>');
    setChip(chWish,reqs.length+' <small>'+(reqs.length===1?'wish':'wishes')+'</small>');chWish.classList.toggle('hot',reqs.length>0);
    chMood.title='Mood '+Math.round(moodAvg);chTrust.title='Trust '+Math.round(trustAvg);
    const gt=goalText();if(goalEl.innerHTML!==gt)goalEl.innerHTML=gt;
    c.stat('Day '+day+' · '+live.length+' people');
    syncTools();
    sideT-=.25;if(sideT<=0&&!side.hidden){sideT=.5;sideHTML()}
  }
  saveT+=rdt;if(saveT>15){saveT=0;save()}
  render();
});
c.on(document,'visibilitychange',()=>{if(document.hidden)save()});

return()=>{save();try{ro&&ro.disconnect()}catch(e){}};
}});
