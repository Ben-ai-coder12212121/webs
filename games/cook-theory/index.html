/* ===================== Cook Theory: game code ===================== */
/* Cook Theory: a cartoon crime-empire sim with hands-on cook minigames, in a 3D diorama.
   All chemistry in this game is made up: fictional ingredients, abstract mechanics. */
const CK_CSS = `
:host{--bg:#15120f;--ink:#0b0a08;--plate:rgba(20,17,14,.88);--plate2:#2a231c;--plate3:#382e24;--line:#000;--edge:#4a3d2f;--sand:#f1e2bf;--dim:#b3a385;--mute:#7e715c;
--az:#47c9f2;--az2:#1d8fc4;--gold:#ffc94a;--cash:#86df6c;--red:#ff5b45;--amber:#ffa53a;--pink:#ff8fb1;
--f-t:"Black Ops One","Arial Black",Impact,system-ui,sans-serif;--f-b:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
#game{position:absolute;inset:0;overflow:hidden;background:#1b1612;color:var(--sand);font-family:var(--f-b);font-size:14px;line-height:1.3;text-align:left;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;container-type:size;overscroll-behavior:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;margin:0;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
svg{display:block}
.plate{background:var(--plate);border:2px solid var(--line);border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;background:var(--plate3);border:2px solid var(--line);border-radius:4px;box-shadow:0 3px 0 #000;font-weight:600;font-size:14px;color:var(--sand);text-align:center;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:#46392c}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.go{background:var(--az2);color:#fff;border-color:#06283a}
.btn.go:hover:not(:disabled){background:#22a2dc}
.btn.warn{background:#9a3a22;color:#fff}
.btn.warn:hover:not(:disabled){background:#b44a2c}
.btn.gold{background:#c8901e;color:#1b1208}
.btn.gold:hover:not(:disabled){background:#e0a42a}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn svg{width:18px;height:18px}
kbd{display:inline-block;min-width:18px;padding:0 4px;border:1.5px solid var(--dim);border-radius:3px;font-family:var(--f-m);font-size:10px;line-height:15px;text-align:center;color:var(--dim)}
.g-touch kbd{display:none}
.money{font-family:var(--f-m);font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#vig{position:absolute;inset:0;pointer-events:none!important;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(8,6,4,.55) 100%)}
#top{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;align-items:stretch;pointer-events:none}
#top>*{pointer-events:auto}
#dayBox{padding:4px 10px 5px;min-width:96px;max-width:160px}
#dayBox b{display:block;font-family:var(--f-t);font-weight:400;font-size:20px;line-height:1.05;color:var(--gold);letter-spacing:.02em}
#dayBox span{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;text-transform:uppercase}
.chip{display:grid;grid-template-columns:auto auto;column-gap:7px;align-items:center;padding:4px 10px 4px 7px;min-width:0}
.chip svg{width:24px;height:24px;grid-row:span 2}
.chip small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);line-height:1.1;white-space:nowrap}
.chip b{font-family:var(--f-m);font-size:15px;font-weight:700;line-height:1.15;white-space:nowrap}
#cDirty b{color:var(--cash)}#cClean b{color:#d8ffcf}#cStash b{color:var(--az)}#cRep b{color:var(--gold)}
.chip.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.08)}}
#sp{flex:1}
.meter{display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center;padding:4px 9px 4px 6px;width:124px}
.meter svg{width:24px;height:24px;grid-row:span 2}
.meter small{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .bar{height:9px;background:#0a0806;border:1px solid #000;border-radius:2px;overflow:hidden;position:relative}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .5s}
#mHeat .bar i{background:linear-gradient(90deg,#ffcf4a,#ff8a2a 60%,#ff3a2a)}
#mSusp .bar i{background:linear-gradient(90deg,#ffb3c6,#ff6a8a)}
#mHeat.hot{animation:hotp 1s infinite}
@keyframes hotp{50%{border-color:#ff3a2a;box-shadow:0 0 12px rgba(255,60,40,.6)}}
#menuBtn{width:40px;display:grid;place-items:center}
#menuBtn svg{width:22px;height:22px}
#goals{position:absolute;left:10px;top:64px;width:min(260px,40cqw);padding:8px 10px 9px}
#goals h4{margin:0 0 5px;font-family:var(--f-t);font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--az);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
#goals h4 button{font-family:var(--f-b);font-size:11px;color:var(--dim);letter-spacing:0}
#goals ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#goals li{display:grid;grid-template-columns:16px 1fr;gap:6px;font-size:13px;line-height:1.25}
#goals li i{width:14px;height:14px;margin-top:1px;border:2px solid var(--dim);border-radius:2px}
#goals li.ok{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(179,163,133,.6)}
#goals li.ok i{background:var(--cash);border-color:var(--cash);box-shadow:inset 0 0 0 2px #1b2a14}
#goals li small{display:block;color:var(--dim);font-size:11px;text-decoration:none}
#goals .bar{height:4px;margin-top:3px;background:#0a0806;border-radius:1px;overflow:hidden}
#goals .bar i{display:block;height:100%;background:var(--az)}
#goals.min ul{display:none}
#log{position:absolute;right:10px;top:64px;width:min(250px,36cqw);display:grid;gap:4px;pointer-events:none!important}
.lg{padding:5px 9px;font-size:12px;line-height:1.3;background:rgba(15,12,10,.82);border-left:3px solid var(--az);border-radius:2px;animation:lgin .35s;transition:opacity .6s}
.lg.bad{border-left-color:var(--red)}.lg.good{border-left-color:var(--cash)}.lg.gold{border-left-color:var(--gold)}
@keyframes lgin{from{transform:translateX(30px);opacity:0}}
#where{position:absolute;left:12px;bottom:92px;pointer-events:none!important;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6)}
#where b{display:block;font-family:var(--f-t);font-weight:400;font-size:24px;color:var(--sand);letter-spacing:.03em}
#where span{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
#phase{position:absolute;right:12px;bottom:92px;pointer-events:none!important;text-align:right;text-shadow:0 2px 0 #000}
#phase b{display:block;font-family:var(--f-t);font-weight:400;font-size:18px;color:var(--gold)}
#phase span{font-size:12px;color:var(--dim)}
#acts{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.act{pointer-events:auto;position:relative;width:86px;height:70px;display:grid;justify-items:center;align-content:center;gap:3px;background:var(--plate);border:2px solid var(--line);border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.5);transition:transform .08s,background .15s,border-color .15s}
.act svg{width:30px;height:30px}
.act span{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.act kbd{position:absolute;left:4px;top:3px;font-size:9px;line-height:12px;min-width:14px;border-width:1px}
.act:hover:not(:disabled){background:#2e261e;border-color:var(--edge)}
.act:active:not(:disabled){transform:translateY(2px)}
.act.hi{border-color:var(--az);box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 2px rgba(71,201,242,.25),0 0 18px rgba(71,201,242,.35);animation:hip 1.6s infinite}
@keyframes hip{50%{box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 2px rgba(71,201,242,.45),0 0 26px rgba(71,201,242,.6)}}
.act.end{background:#3a2a16;border-color:#000}
.act.end span{color:var(--gold)}
.act .dot{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid #000}
#toast{position:absolute;left:50%;top:26%;transform:translate(-50%,-10px);padding:9px 18px;font-weight:600;font-size:15px;text-align:center;max-width:calc(100% - 32px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none!important;z-index:44}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:rgba(90,24,14,.94);border-color:#2a0a04}
#floats{position:absolute;inset:0;pointer-events:none!important;overflow:hidden;z-index:55}
.fl{position:absolute;font-family:var(--f-m);font-weight:700;font-size:18px;text-shadow:0 2px 0 #000;white-space:nowrap;animation:flup 1.4s forwards}
@keyframes flup{to{transform:translateY(-60px);opacity:0}}

/* ---------- sheets ---------- */
.sheet{position:absolute;left:50%;top:10px;bottom:10px;transform:translateX(-50%);width:min(1000px,calc(100% - 20px));display:flex;flex-direction:column;background:#1d1813;border:2px solid #000;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:30;overflow:hidden;animation:shin .2s}
@keyframes shin{from{transform:translate(-50%,16px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#2b231b;border-bottom:2px solid #000}
.sheet header svg{width:28px;height:28px}
.sheet header h2{flex:1;margin:0;font-family:var(--f-t);font-weight:400;font-size:22px;line-height:1.05;color:var(--sand);letter-spacing:.03em}
.sheet header h2 small{display:block;font-family:var(--f-b);font-size:12px;color:var(--dim);letter-spacing:.02em}
.sheet .body{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
.card{background:#261f18;border:2px solid #000;border-radius:5px;padding:10px 12px}
.card h3{margin:0 0 6px;font-family:var(--f-t);font-weight:400;font-size:15px;letter-spacing:.05em;color:var(--az);text-transform:uppercase}
.card p{margin:4px 0;color:var(--dim);font-size:13px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin:6px 0}
.kv span{color:var(--dim)}.kv b{font-family:var(--f-m);font-weight:700;text-align:right}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid #000}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:#261f18;border:2px solid #000;border-radius:5px}
.item+.item{margin-top:8px}
.item .ic{width:44px;height:44px;display:grid;place-items:center;background:#16120e;border:2px solid #000;border-radius:4px}
.item .ic svg{width:32px;height:32px}
.item h4{margin:0;font-size:15px;font-weight:700}
.item p{margin:2px 0 0;font-size:12px;color:var(--dim);line-height:1.3}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:6px;background:#0d0b08;border:1px solid #000;border-radius:1px}
.pips i.on{background:var(--az)}
.pips i.lock{background:repeating-linear-gradient(45deg,#2a221a 0 3px,#14100c 3px 6px)}
.item .btn{min-width:96px}
.sub2{font-size:12px;color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#0d0b08;border:1.5px solid #000;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;background:var(--gold);border:2px solid #000;border-radius:3px}
input[type=range]::-moz-range-track{height:8px;background:#0d0b08;border:1.5px solid #000;border-radius:2px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--gold);border:2px solid #000;border-radius:3px}
#map svg{width:100%;height:auto;border:2px solid #000;border-radius:4px;background:#2a2219}
#map .d{cursor:pointer;transition:filter .15s}
#map .d:hover{filter:brightness(1.25)}
#map .d.sel path{stroke:#fff;stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid #000;margin-right:4px;vertical-align:-2px}
.est{font-size:13px;color:var(--dim);margin-top:4px}
.est b{color:var(--sand);font-family:var(--f-m)}
.pricev{font-family:var(--f-m);font-size:22px;font-weight:700;color:var(--cash)}
.buyer{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.buyer .pt{width:56px;height:62px;border:2px solid #000;border-radius:4px;overflow:hidden;background:#3a2f24}
.buyer .pt svg{width:100%;height:100%}

/* ---------- dialogue ---------- */
#dlg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 12px;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55));cursor:pointer}
#dlgBox{position:relative;width:min(860px,100%);display:grid;grid-template-columns:150px 1fr;gap:0;min-height:150px}

.chcard{text-align:center}

.chcard .num{font-family:var(--f-t);color:var(--az);letter-spacing:.2em;font-size:14px}
#title{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,rgba(10,8,6,.2),rgba(10,8,6,.75))}
#title .in{text-align:center;padding:16px;max-width:620px}

#title .btn{min-width:150px;min-height:44px;font-size:16px}
#title .fine{margin-top:14px;font-size:12px;color:#cdbf9f;text-shadow:0 1px 0 #000}
.help{display:grid;gap:8px;margin:8px 0}
.help div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--sand)}
.help svg{width:30px;height:30px}
.help small{display:block;color:var(--dim);font-size:12px}
#loading{position:absolute;inset:0;z-index:70;display:grid;place-items:center;background:#15120f}
#loading .in{text-align:center;width:min(340px,80%)}
#loading b{display:block;font-family:var(--f-t);font-weight:400;font-size:30px;color:var(--sand)}
#loading small{display:block;color:var(--dim);margin:6px 0 12px}
#loading .lb{height:8px;background:#000;border:1px solid #3a2f24;border-radius:2px;overflow:hidden}
#loading .lb i{display:block;height:100%;width:0;background:var(--az);transition:width .2s}
#err{position:absolute;left:12px;right:12px;top:40%;z-index:80;padding:12px;background:#4a140c;border:2px solid #000;border-radius:5px;text-align:center}

/* ---------- cook ---------- */
#cook{position:absolute;inset:0;z-index:20;pointer-events:none}
#cook>*{pointer-events:auto}
#ckTop{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;align-items:center}
.stp{display:grid;justify-items:center;padding:3px 9px;min-width:64px;border-radius:3px;background:#120f0c;border:1.5px solid #000;color:var(--mute);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.stp b{font-family:var(--f-m);font-size:12px;color:var(--mute)}
.stp.on{background:#173a4c;color:#fff;border-color:var(--az)}
.stp.done{color:var(--dim)}.stp.done b{color:var(--cash)}
#ckPur{position:absolute;left:10px;top:10px;padding:5px 12px;text-align:center}
#ckPur small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#ckPur b{font-family:var(--f-m);font-size:24px;color:var(--az)}
#ckFume{position:absolute;right:10px;top:10px;width:96px;padding:6px;display:grid;gap:5px;justify-items:stretch}
#ckFume small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
#ckFume .fb{height:110px;background:#0a0806;border:1.5px solid #000;border-radius:2px;position:relative;overflow:hidden}
#ckFume .fb i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#5fbf4a,#c8e24a 60%,#ff7a3a)}
#ckFume .fb s{position:absolute;left:0;right:0;bottom:60%;border-top:2px dashed rgba(255,255,255,.5)}
#vent{min-height:40px;font-weight:800;letter-spacing:.06em}
#vent.need{background:#c8901e;color:#1b1208;animation:hip2 .6s infinite}
@keyframes hip2{50%{background:#ffcf4a}}
#ckPanel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));padding:8px;display:grid;grid-template-columns:1fr auto;gap:8px}
#ckHelp{grid-column:span 2;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sand);min-height:22px}
#ckHelp b{font-family:var(--f-t);font-weight:400;color:var(--gold);letter-spacing:.06em;font-size:15px}
#ckHelp span{color:var(--dim)}
#ckCv{width:100%;height:170px;display:block;background:#100d0a;border:1.5px solid #000;border-radius:3px;touch-action:none;cursor:pointer}
#ckSide{display:grid;gap:6px;align-content:stretch;width:112px}
#ckSide .btn{min-height:48px;font-size:14px;font-weight:800;letter-spacing:.04em}
#ckBig{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);font-family:var(--f-t);font-size:clamp(28px,6cqw,56px);color:#fff;text-shadow:0 4px 0 #000,0 0 20px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none!important;white-space:nowrap;text-align:center}
#ckBig.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ckBig small{display:block;font-family:var(--f-b);font-size:16px;letter-spacing:.06em;color:var(--sand)}
#ckFire{position:absolute;inset:0;pointer-events:none!important;box-shadow:inset 0 0 120px rgba(255,90,20,.65);animation:firep .3s infinite alternate}
@keyframes firep{to{box-shadow:inset 0 0 160px rgba(255,140,30,.8)}}
#ckQuit{position:absolute;left:10px;top:70px;font-size:12px}

/* site full screen puts its own small buttons in the top-left corner */
.g-fs #top{top:46px}.g-fs #goals{top:100px}.g-fs #log{top:100px}.g-fs #ckPur{top:46px}.g-fs #ckQuit{top:106px}.g-fs .sheet{top:46px}

 #dayBox{min-width:0;padding:3px 8px}#dayBox b{font-size:16px}#dayBox span{font-size:9px}
 .chip{padding:3px 7px 3px 5px;column-gap:5px}.chip svg{width:18px;height:18px}.chip b{font-size:12px}.chip small{font-size:8px}
 .meter{width:112px;padding:3px 6px 3px 4px}.meter svg{width:18px;height:18px}
 #sp{display:none}
 #goals{top:auto;bottom:86px;width:min(260px,calc(100% - 20px));padding:6px 9px}
 #log{display:none}
 #where{display:none}#phase{display:none}
 .act{width:min(15.5cqw,78px);height:62px}.act svg{width:26px;height:26px}.act span{font-size:10px;letter-spacing:.02em}
 .cols{grid-template-columns:1fr}
 #dlgBox{grid-template-columns:96px 1fr}#dlgPic{height:112px}#dlgPic svg{width:100px;height:112px}
 #dlgText{font-size:15px}
 #ckPanel{grid-template-columns:1fr}#ckHelp{grid-column:auto}
 #ckSide{width:auto;grid-auto-flow:column;grid-auto-columns:1fr}
 #ckCv{height:150px}
 #ckTop{left:84px;right:104px;transform:none;top:10px;padding:3px;gap:2px;justify-content:center}.stp{min-width:0;flex:1;padding:2px 2px;font-size:9px;letter-spacing:0}.stp b{font-size:10px}
 #ckPur{padding:4px 6px;width:68px}#ckPur b{font-size:18px}
 #ckQuit{top:64px;padding:2px 6px;min-height:26px;font-size:11px}
 .g-fs #ckTop{top:46px}.g-fs #ckFume{top:46px}.g-fs #ckQuit{top:100px}
 #ckFume{width:88px;padding:4px}#ckFume .fb{height:56px}#vent{min-height:34px;font-size:13px}
}
@container (max-width:560px){

}

 #dlgText{font-size:15px}#dlgPic{height:120px}#dlgPic svg{width:106px;height:120px}#dlgBox{grid-template-columns:106px 1fr}
}

const camCur = { tx: 0, ty: 1, tz: 0, dist: 10, yaw: 0, pitch: 0.2, init: false };

  const yaw = P.yaw + camState.yaw + sway, pitch = clamp(P.pitch + camState.pitch, 0.05, 0.9);

  camCur.tx = lerp(camCur.tx, P.tx, k); camCur.ty = lerp(camCur.ty, P.ty, k); camCur.tz = lerp(camCur.tz, P.tz, k);
  camCur.dist = lerp(camCur.dist, dist, k); camCur.yaw = lerp(camCur.yaw, yaw, k); camCur.pitch = lerp(camCur.pitch, pitch, k);
  camera.position.set(camCur.tx + Math.sin(camCur.yaw) * Math.cos(camCur.pitch) * camCur.dist, camCur.ty + Math.sin(camCur.pitch) * camCur.dist, camCur.tz + Math.cos(camCur.yaw) * Math.cos(camCur.pitch) * camCur.dist);
  camera.lookAt(camCur.tx, camCur.ty, camCur.tz);

  const offT = camState.mode === 'cook' ? (W / Hh < 1 ? 0.26 : 0.17) : 0;

  if (camCur.off > 0.002) camera.setViewOffset(W, Hh, 0, Hh * camCur.off, W, Hh); else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  if (shake > 0) { shake = Math.max(0, shake - dt); camera.position.x += (Math.random() - 0.5) * shake * 0.15; camera.position.y += (Math.random() - 0.5) * shake * 0.15; }
}

/* ================= flow ================= */
let started = false, busy = false;
function doAct(id) {
  if (!started || dlgQ || modalOpen() || ck) return;
  SFX.click();
  if (id === 'cook') cookChoice();
  else if (id === 'end') endDayPrompt();
  else { if (sheetKind === id) closeSheet(); else openSheet(id); }
}
function afterAction() {
  if (!started || busy || dlgQ || modalOpen() || ck || sheetKind || st.ending) return;
  checkTriggers();
  if (st.queue.length) runQueue();
}
function queueEvent(id, data, front) { if (front) st.queue.unshift({ id, data: data || {} }); else st.queue.push({ id, data: data || {} }); }
function runQueue() {
  if (dlgQ || st.ending || ck) return;
  const e = st.queue.shift();
  if (!e) { busy = false; renderHUD(); save(); afterAction(); return; }
  const ev = EVENTS[e.id]; if (!ev) { runQueue(); return; }
  busy = true; save();
  ev(e.data || {}, () => { busy = false; renderHUD(); later(runQueue, 60); });
}
function once(k) { if (st.seen[k]) return false; st.seen[k] = true; return true; }
function checkTriggers() {
  const q = id => { if (once(id)) queueEvent(id); };
  if (st.ch === 1) {
    if (st.day >= 3 && st.batches > 0) q('ray1');
    if (st.bestBatch >= 70 && st.sold >= 15 && st.billPaid) q('ch1end');
  } else if (st.ch === 2) {
    const d2 = st.day - (st.flags.chDay || 0);
    if (d2 >= 1) q('spikeIntro');
    if (st.spike === 'later' && d2 >= 5) q('spikeAgain');
    if (d2 >= 3) q('dorado');
    if (st.dirty >= 20000 || d2 >= 4) q('kaneIntro');
    if (st.spike === 'active' && st.spikeSold >= 40) q('spikeBetray');
    if (owned().length >= 4 && st.wash > 0 && st.laundered >= 30000 && st.bestBatch >= 90) q('ch2end');
  } else if (st.ch === 3) {
    const d3 = st.day - (st.flags.chDay || 0);
    if (d3 >= 3) q('raySample');
    if (d3 >= 5 && st.crane === 'partner' && st.skid === 'in') q('craneSkid');
    if (d3 >= 7) q('coyWar');
  }
  if (st.heat >= 55) q('raySketch');
  if (st.heat >= 80 && once('rayClose' + st.ch)) queueEvent('rayClose');
  if (st.spouse === 'unaware' && st.susp >= 100) queueEvent('lindaConfront');
}
