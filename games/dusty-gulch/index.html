const DG_CSS = `
:host{--ink:#22160c;--paper:#fff3dc;--sand:#ecd09a;--dim:#d8c19a;--plate:rgba(40,25,14,.84);--line:#140c05;--gold:#ffcf4a;--red:#e0603a;--sage:#a9c46c;--sky:#8fcbe8;--blue:#5aa0d8;

.card,.panel{background:#fff3dc;color:var(--ink);border:3px solid var(--line);border-radius:8px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
