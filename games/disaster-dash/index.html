// Disaster Dash: a 3D survival party game. Up to 8 players on a small island town; a random natural disaster
// hits each round and whoever is still standing at the end earns coins. The host's browser simulates the
// disasters and the falling buildings; guests send their position and get the world back (js/lib/online.js).
// env: { THREE, audio(), muted(), best(n), stat(t), lowGfx() }
function DisasterDash(host, env) {
'use strict';
const THREE = env.THREE || window.THREE;
const LOW = !!(env.lowGfx && env.lowGfx());
const shadow = host.shadowRoot || host.attachShadow({ mode: 'open' });
shadow.innerHTML = '<style>' + DD_CSS + '</style>' + DD_HTML;
const $ = s => shadow.querySelector(s);
let alive = true, raf = 0, gameFocus = true;
const offs = [], timers = [];
const on = (t, ev, fn, o) => { t.addEventListener(ev, fn, o); offs.push(() => t.removeEventListener(ev, fn, o)); };
const later = (fn, ms) => { const i = setTimeout(() => { if (alive) fn(); }, ms); timers.push(i); return i; };
on(document, 'pointerdown', e => { gameFocus = e.composedPath().includes(host); }, true);

/* ================= small helpers ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI, TAU = PI * 2;
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const fmtT = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry(1);          // seeded: map building only (must match on every player's machine)
const rr = (a, b) => a + R() * (b - a);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (cDirty && bMesh.instanceColor) { bMesh.instanceColor.needsUpdate = true; cDirty = false; }
  renderer.render(scene, camera);
}
