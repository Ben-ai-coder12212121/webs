function lathe(cx, cz, y0, y1, rAt, seg, rings, seed) {
  // a displaced cone of rock (scenery only)
  const pos = [], col = [], idx = [];
  const b0 = RCH.n;
  for (let j = 0; j <= rings; j++) {
    const t = j / rings, y = lerp(y0, y1, t);
    for (let i = 0; i < seg; i++) {
      const a = i / seg * TAU, ca = Math.cos(a), sa = Math.sin(a);
      let r = rAt(t);
      const n = fbm3(ca * 2.2 + seed, y * 0.035, sa * 2.2 - seed, 4);
      r *= 0.72 + 0.56 * n;
      r *= 1 - 0.08 * Math.sin(y * 0.4 + n * 6);
      if (j === rings) r *= 0.15;
      const x = cx + ca * r, z = cz + sa * r;
      RCH.pos.push(x, y, z);
      const c = rockTint(y), k = 0.75 + 0.4 * n;
      RCH.col.push(c.r * k, c.g * k, c.b * k);
    }
  }
  for (let j = 0; j < rings; j++) for (let i = 0; i < seg; i++) {
    const a = b0 + j * seg + i, b = b0 + j * seg + (i + 1) % seg, c = b0 + (j + 1) * seg + (i + 1) % seg, d = b0 + (j + 1) * seg + i;
    RCH.idx.push(a, d, b, b, d, c);
  }
  RCH.n += (rings + 1) * seg;
  void pos; void col; void idx;
  if (RCH.n > 60000) flushRock();
}

}

/* ================= sky, light, fog ================= */
const _sv = new THREE.Vector3();
const C_FOG = new THREE.Color(0xc9d6e2), C_FOG_STORM = new THREE.Color(0x8d969f), C_FOG_LOW = new THREE.Color(0xd2d9d6);
let lightningT = 8, flashA = 0;
function updateSky(dt) {
  const camY = camera.position.y;
  const high = smooth(SNOW_Y - 40, SNOW_Y + 10, camY);
  const storm = WX.storm * (0.35 + 0.65 * high);
  const fog = WX.fog;
  scene.fog.density = FOG_BASE * (1 + fog * 4.5 + storm * 3);
  const fc = scene.fog.color; fc.copy(C_FOG_LOW).lerp(C_FOG, smooth(0, 60, camY)).lerp(C_FOG_STORM, storm * 0.85);
  SKY.uniforms.uFog.value.copy(fc); SKY.uniforms.uHor.value.copy(fc).lerp(new THREE.Color(0xe6edf2), 0.4 * (1 - storm));
  SKY.uniforms.uDark.value = storm * 0.9;
  SH.uHF.value.x = camY - 48 - fog * 10; SH.uHF.value.z = 0.006 + fog * 0.03 + storm * 0.01; SH.uHF.value.w = 0.65 * (1 - storm) * (1 - fog * 0.5);
  sun.intensity = (HQ ? 2.7 : 2.2) * (1 - storm * 0.65) * (1 - fog * 0.3);
  hemi.intensity = (HQ ? 0.55 : 0.95) * (1 - storm * 0.25);
  for (const m of STD) m.envMapIntensity = 1 - storm * 0.5;
  cloudMat.uniforms.uCam.value.copy(camera.position);
  cloudMat.uniforms.uA.value = smooth(-5, 45, camY);
  sky.position.copy(camera.position);
  // sun follows you so shadows stay sharp near the climber
  sun.position.set(P.x + SUN_DIR.x * 120, P.y + SUN_DIR.y * 120, P.z + SUN_DIR.z * 120); sun.target.position.set(P.x, P.y, P.z);
  // sun glare on screen, hidden when a cliff is in the way
  _sv.copy(SUN_DIR).multiplyScalar(1000).add(camera.position).project(camera);
  let g = 0;
  if (_sv.z < 1 && Math.abs(_sv.x) < 1.4 && Math.abs(_sv.y) < 1.4) {
    if ((frameNo & 7) === 0) glareVis = rayRock(camera.position.x, camera.position.y, camera.position.z, SUN_DIR.x, SUN_DIR.y, SUN_DIR.z, 300) >= 300 ? 1 : 0;
    g = glareVis * (1 - storm) * (1 - fog * 0.7) * (1 - Math.max(Math.abs(_sv.x), Math.abs(_sv.y)) / 1.4);
  }
  glareA = lerp(glareA, g, 1 - Math.exp(-dt * 6));
  UI.glare.style.opacity = (glareA * 0.9).toFixed(3);
  if (glareA > 0.01) UI.glare.style.transform = 'translate(' + ((_sv.x * 0.5 + 0.5) * host.clientWidth).toFixed(0) + 'px,' + ((-_sv.y * 0.5 + 0.5) * host.clientHeight).toFixed(0) + 'px)';
  // lightning in storms up high
  if (storm > 0.5 && high > 0.5) { lightningT -= dt; if (lightningT <= 0) { lightningT = 6 + Math.random() * 10; flashA = 1; sfx('thunder', 0.4 + Math.random()); } }
  if (flashA > 0) { flashA = Math.max(0, flashA - dt * 3); UI.flash.style.opacity = (flashA * (flashA > 0.6 ? 0.55 : 0.25)).toFixed(3); }
  // wind sound
  if (A.windG && A.ctx) { const w = isMuted() ? 0 : clamp(0.04 + windNow * 0.22 + storm * 0.1, 0, 0.4); A.windG.gain.setTargetAtTime(w, A.ctx.currentTime, 0.3); A.windF.frequency.setTargetAtTime(380 + windNow * 600, A.ctx.currentTime, 0.3); }
  return { storm, high };
}
let glareA = 0, glareVis = 1, frameNo = 0;

/* ================= small animations ================= */
function updateProps(dt, time) {
  for (const f of FIRES) { if (Math.abs(f.y - P.y) > 80) continue; const s = 0.85 + 0.25 * Math.sin(time * 13 + f.x) * Math.sin(time * 7.3); f.g.scale.set(1, s, 1); f.g.rotation.y = time * 0.7; }
  for (const F of FLAGS) {
    if (Math.abs(F.m.position.y - P.y) > 120) continue;
    if (F.up && F.m.position.y < F.y1) F.m.position.y = Math.min(F.y1, F.m.position.y + dt * 2);
    const a = F.m.geometry.attributes.position, b = F.base;
    for (let i = 0; i < a.count; i++) { const x = b[i * 3]; a.setZ(i, Math.sin(x * 3 - time * 6 + F.ph) * 0.12 * x); }
    a.needsUpdate = true;
  }
  for (let i = 0; i < ROPES.length; i++) { const r = ROPES[i], on = ropeActive(i); ROPE_MESH[i].rope.visible = on; ROPE_MESH[i].coil.visible = !on; }
}

/* ================= main loop ================= */
let last = performance.now(), acc = 0, perfAcc = 0, perfN = 0, attractA = 0;
function frame(now) {
  if (!alive) return;
  raf = requestAnimationFrame(frame);
  const raw = now - last; last = now;
  const dt = Math.min(0.05, raw / 1000);
  const time = now / 1000; frameNo++;
  SH.uTime.value = time;
  const paused = menuOpen() && !NET.mode && started;
  if (!paused) simStep(dt);
  // your climber
  me.ch.g.position.set(P.x, P.y, P.z); me.ch.g.rotation.y = P.yaw;
  me.ch.g.visible = started;
  if (started) driveAnim(me.ch, P.anim, P.spd, paused ? 0 : dt);
  updatePeers(dt);
  netTick(dt);
  if (started) updateCamera(dt);
  else { // slow fly-around of the mountain behind the title card
    attractA += dt * 0.04;
    const r = 150, y = 60 + Math.sin(attractA * 0.7) * 25;
    camera.position.set(Math.cos(attractA) * r - 30, y, Math.sin(attractA) * r);
    camera.lookAt(0, y + 25, 0); P.x = camera.position.x; P.y = camera.position.y - 1.5; P.z = camera.position.z;
  }
  const sk = updateSky(dt);
  const snowK = smooth(SNOW_Y - 25, SNOW_Y, camera.position.y) * (0.25 + 0.75 * WX.storm);
  updateParticles(dt, snowK, windNow + sk.storm * 0.3);
  updateProps(dt, time);
  updateHud(dt);
  renderer.render(scene, camera);
  // adaptive resolution: keep it smooth on slow machines
  if (raw < 250 && !document.hidden) { perfAcc += raw; perfN++; }
  if (perfAcc > 2000) {
    const ms = perfAcc / perfN; let np = pixelRatio;
    if (ms > 26 && pixelRatio > 0.55) np = Math.max(0.55, pixelRatio * 0.85); else if (ms < 15 && pixelRatio < PR_MAX) np = Math.min(PR_MAX, pixelRatio * 1.1);

}
function simStep(dt) {

  if (started) {
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 4) { acc -= 1 / 60; n++; simT += 1 / 60; updateBridgesPhys(); stepPlayer(1 / 60); }
    if (n === 4) acc = 0;
  } else { simT += dt; updateBridgesPhys(); }
  updateCrumble(dt); updateGullies(dt); updateBoulders(dt); updateIce(dt); updateDust(dt);
  updateProgress(dt); updateHints();
  if (fadeT > 0) fadeT = Math.max(0, fadeT - dt);
}
let simT = 0;
let lastBridgeT = 0;
function updateBridgesPhys() { const t = simT; if (t - lastBridgeT < 1 / 70) { for (const B of BRIDGES) for (const c of B.planks) { c.dx = c.dy = c.dz = 0; } return; } lastBridgeT = t; updateBridges(t); }
function resize() {
  const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
const ro = new ResizeObserver(resize); ro.observe(host); resize();
addHintSpots();
for (const F of FLAGS) if (FLAGS.indexOf(F) <= SAVE.maxCamp) { F.up = 1; F.m.position.y = F.y1; }
P.camp = Math.min(SAVE.camp || 0, SAVE.maxCamp); campSel = P.camp;
placeAtCamp(P.camp);
openMenu('main');
raf = requestAnimationFrame(frame);
// an invite link joins straight away
let inv = null; try { if (ONLINE_OK) inv = Online.inviteCode(); } catch (e) {}
if (inv) setTimeout(() => { if (!alive) return; openMenu('net'); startJoin(inv); }, 400);

function dispose() {
  if (!alive && !raf) return;
  try { save(); } catch (_) {}
  try { if (NET.mode) stopOnline(); } catch (_) {}
  cancelAnimationFrame(raf); raf = 0; ro.disconnect();
  exitLock();
  try { if (A.wind) A.wind.stop(); A.master && A.master.disconnect(); } catch (_) {}
  const seen = new Set();
  scene.traverse(o => {
    if (o.geometry && !seen.has(o.geometry)) { seen.add(o.geometry); o.geometry.dispose(); }
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (seen.has(m)) return; seen.add(m); if (m.map) m.map.dispose(); m.dispose(); });
  });
  for (const k in ART.tex) { const t = ART.tex[k]; t.c && t.c.dispose(); t.n && t.n.dispose(); }
  if (envRT) envRT.dispose();
  renderer.dispose(); try { renderer.forceContextLoss(); } catch (_) {}
  
}
return dispose;

}   // end game()
